eintraege:
  - id: hausarztpflicht-und-arztvorbehalt
    wenn:
      - frage: ambulant-steuerung
        option: primaerarzt
      - frage: fachkraefte-aufgabenteilung
        option: arztvorbehalt
    titel: Mehr Wege über die Hausarztpraxis – aber nur Ärzte entscheiden
    text: Ein verbindliches Primärarztsystem schickt mehr Menschen zuerst in die Hausarztpraxis. Wenn dort weiterhin nur Ärztinnen und Ärzte eigenständig entscheiden dürfen, muss diese Mehrarbeit von einer Berufsgruppe getragen werden, von der schon heute Sitze unbesetzt sind.
    aufloesung: Beides passt zusammen, wenn man die Arbeit innerhalb der ärztlichen Verantwortung neu verteilt – etwa durch mehr Delegation an Praxisteams, eine gute digitale Ersteinschätzung vor dem Termin und mehr Studienplätze. Wer den Arztvorbehalt für ein Qualitätsmerkmal hält, kann ihn bewusst als Teil eines Primärarztsystems wollen.

  - id: verhaltenstarif-und-datenhoheit
    wenn:
      - frage: praevention-anreize
        option: verhaltensabhaengig
      - frage: digitalisierung-gesundheitsdaten
        option: opt-in
    titel: Belohnung fürs Verhalten – und strenge Kontrolle über die eigenen Daten
    text: Beiträge nach Verhalten setzen voraus, dass die Kasse etwas über das Verhalten erfährt – zum Beispiel über Vorsorge, Bewegung oder Rauchen. Gleichzeitig soll ohne ausdrückliche Zustimmung nichts fließen.
    aufloesung: Das lässt sich verbinden, wenn verhaltensbezogene Tarife selbst freiwillig sind. Wer mitmacht, stimmt der Datennutzung ausdrücklich zu; wer nicht zustimmt, bleibt im normalen Tarif. Die Zustimmung ist dann gerade der Schlüssel zum Anreiz.

  - id: digitale-steuerung-ohne-automatische-akte
    wenn:
      - frage: digitalisierung-telemedizin
        option: digital-zuerst
      - frage: digitalisierung-gesundheitsdaten
        option: opt-in
    titel: Digital zuerst – aber die Akte nur auf Wunsch
    text: Eine digitale Ersteinschätzung wird umso besser, je mehr sie über Vorerkrankungen und Medikamente weiß. Die Pläne der Bundesregierung binden sie deshalb an die ePA an. Wenn die Akte nur mit Zustimmung entsteht, fehlen diese Informationen bei vielen.
    aufloesung: Eine Ersteinschätzung funktioniert auch mit den Angaben, die Anrufende selbst machen – so arbeitet die 116117 schon heute. Wer beides will, kann eine digitale Steuerung befürworten, die mit Akte besser, aber ohne Akte nicht schlechter ist als heute.

  - id: pflege-uebernimmt-mehr-bei-mangel
    wenn:
      - frage: fachkraefte-aufgabenteilung
        option: erweitern
      - frage: fachkraefte-pflege
        option: personalbemessung
    titel: Pflege soll mehr übernehmen – und am Krankenbett mehr Personal binden
    text: Erweiterte Befugnisse holen Pflegekräfte in neue Aufgaben, etwa in Hausarztpraxen oder in der Gemeinde. Eine verbindliche Personalbemessung im Krankenhaus verlangt zugleich mehr Pflegekräfte am Bett. Beides zieht an derselben knappen Gruppe.
    aufloesung: Die beiden Ziele können sich auch gegenseitig stützen. Mehr Verantwortung und Entwicklungsmöglichkeiten machen den Beruf attraktiver und können Menschen zurückholen oder länger halten. Wer beides will, setzt darauf, dass ein besserer Beruf am Ende mehr Pflegekräfte bringt.
