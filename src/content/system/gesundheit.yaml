steuerung:
  - titel: Der Bund setzt den Rahmen
    text: Bundestag und Bundesrat beschließen die Gesetze. Sie legen fest, welche Leistungen es grundsätzlich gibt, wie hoch die Beiträge sind und wie Kliniken bezahlt werden.
    wer: Bundestag, Bundesrat, Bundesgesundheitsministerium
  - titel: Die Selbstverwaltung füllt ihn aus
    text: "Kassen, Ärzte und Kliniken handeln die Einzelheiten untereinander aus: Preise, Honorare und die Frage, welche Behandlungen die Kassen bezahlen. Der Staat führt nur die Aufsicht."
    wer: Gemeinsamer Bundesausschuss, Krankenkassen, Kassenärztliche Vereinigungen, Krankenhausgesellschaft
  - titel: Die Länder planen die Kliniken
    text: Welche Krankenhäuser es wo gibt, entscheiden die Bundesländer. Sie sollen auch Gebäude und Geräte bezahlen.
    wer: Landesregierungen
