stand: "2026-11-25"
status: entwurf
kernaussagen:
  - typ: fakt
    text: Fast **neun von zehn** Menschen in Deutschland sind gesetzlich versichert, gut jeder Zehnte privat. Wer gesetzlich versichert ist, zahlt Beiträge nach dem Einkommen, nicht nach Alter oder Gesundheitszustand.
    genau: 74,4 Mio. gesetzlich Versicherte (Oktober 2026) und 8,79 Mio. privat Vollversicherte (2025).
    quellen: [bmg-km1-2026, pkv-branchenzahlen-2025]
  - typ: fakt
    text: Etwa **jeder achte Euro**, den Deutschland erwirtschaftet, fließt ins Gesundheitswesen.
    genau: Gesundheitsausgaben 2024 insgesamt 538,2 Mrd. €, das sind 12,4 % des Bruttoinlandsprodukts oder 6.444 € je Einwohner. Für 2025 werden 579,5 Mrd. € geschätzt.
    quellen: [destatis-gesundheitsausgaben-2024]
  - typ: fakt
    text: Deutschland gibt pro Kopf rund **anderthalbmal so viel** aus wie der Durchschnitt der Industrieländer. Die Lebenserwartung liegt trotzdem nur im Durchschnitt.
    genau: 9.365 US-$ je Kopf gegenüber 5.967 US-$ im OECD-Schnitt (2024, Kaufkraftparitäten). Lebenserwartung bei Geburt 81,1 Jahre, genau so hoch wie im OECD-Schnitt (2023).
    quellen: [oecd-hag-2025]
  - typ: fakt
    text: Bezahlt wird vor allem aus **Beiträgen auf Löhne und Renten**, nur ein kleiner Teil aus Steuern. Deshalb hängt die Finanzierung daran, wie viele Menschen arbeiten und wie viel sie verdienen.
    genau: Der Gesundheitsfonds rechnet für 2026 mit Einnahmen von 312,3 Mrd. €; davon sind 14,5 Mrd. € Bundeszuschuss aus Steuern, der Rest im Wesentlichen Beiträge.
    quellen: [bas-schaetzerkreis-2025]
  - typ: fakt
    text: '**Mehr als vier von fünf** Pflegebedürftigen werden zu Hause versorgt, oft von Angehörigen.'
    genau: 5,7 Mio. Pflegebedürftige Ende 2023, davon 86 % zu Hause.
    quellen: [destatis-pflegestatistik-2023]
