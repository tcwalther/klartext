geldfluss:
  - von: Versicherte und Arbeitgeber
    an: Gesundheitsfonds
    betrag: Hauptteil der Fondseinnahmen von 312,3 Mrd. € (Schätzung 2026)
    text: Beiträge der Versicherten und ihrer Arbeitgeber sind die wichtigste Einnahmequelle des Gesundheitsfonds. Die Zusatzbeiträge der Kassen kommen hinzu.
    quelle: bas-schaetzerkreis-2025
  - von: Bund
    an: Gesundheitsfonds
    betrag: 14,5 Mrd. € Bundeszuschuss (2026)
    text: Der Bund zahlt einen regulären Zuschuss für sogenannte versicherungsfremde Leistungen. 2026 kommen ein ergänzender Zuschuss von 2,5 Mrd. € für die Umbaukosten der Krankenhäuser und ein Darlehen des Bundes von 2,3 Mrd. € hinzu.
    quelle: bas-schaetzerkreis-2025
  - von: Gesundheitsfonds
    an: Krankenkassen
    betrag: 294,7 Mrd. € Zuweisungen (2025)
    text: Der Fonds verteilt das Geld als feste Zuweisungen an die Kassen. Die Höhe richtet sich nach der Risikostruktur ihrer Versicherten (Risikostrukturausgleich).
    quelle: bas-schaetzerkreis-2025
  - von: Krankenkassen
    an: Krankenhäuser
    betrag: 102,2 Mrd. € (2024)
    text: Krankenhausbehandlung ist der größte Ausgabenblock der GKV. Die Kassen bezahlen die laufenden Behandlungskosten.
    quelle: bmg-kennzahlen-gkv-2025
  - von: Krankenkassen
    an: Arztpraxen (über die Kassenärztlichen Vereinigungen)
    betrag: 50,3 Mrd. € (2024)
    text: Die Kassen zahlen eine Gesamtvergütung an die Kassenärztlichen Vereinigungen, die das Geld an die Praxen verteilen.
    quelle: bmg-kennzahlen-gkv-2025
  - von: Krankenkassen
    an: Apotheken und Hersteller (Arzneimittel)
    betrag: 55,2 Mrd. € (2024)
    text: Arzneimittel sind nach den Krankenhäusern der zweitgrößte Ausgabenblock der GKV.
    quelle: bmg-kennzahlen-gkv-2025
  - von: Länder
    an: Krankenhäuser (Investitionen)
    betrag: rund 4,24 Mrd. € (2024)
    text: Für Investitionen der Kliniken, etwa Gebäude und große Geräte, sind die Länder zuständig. Die Deutsche Krankenhausgesellschaft beziffert den Bedarf für 2023 auf 6,52 Mrd. €.
    quelle: dkg-investitionen-2026
akteure:
  - name: Bundestag und Bundesrat
    rolle: Beschließen die Gesetze, die Leistungen, Beiträge und Zuständigkeiten im Gesundheitswesen festlegen.
  - name: Bundesministerium für Gesundheit (BMG)
    rolle: Bereitet Gesetze vor, führt die Rechtsaufsicht über die Selbstverwaltung und legt jährlich den durchschnittlichen Zusatzbeitrag fest.
  - name: Gemeinsamer Bundesausschuss (G-BA)
    rolle: Oberstes Gremium der Selbstverwaltung aus Kassen, Ärzten und Kliniken; entscheidet, welche Leistungen die Kassen bezahlen, und bewertet den Nutzen neuer Arzneimittel.
  - name: Krankenkassen und GKV-Spitzenverband
    rolle: Die Kassen versichern rund 74 Millionen Menschen und bezahlen deren Behandlung; ihr Spitzenverband verhandelt bundesweit, etwa die Preise neuer Arzneimittel.
  - name: Private Krankenversicherungen
    rolle: Versichern Beamte, Selbstständige und Gutverdienende als Alternative zur GKV; außerdem haben viele Menschen dort eine Zusatzversicherung.
  - name: Kassenärztliche Vereinigungen (KVen) und KBV
    rolle: Vertreten die niedergelassenen Ärztinnen und Ärzte, verteilen deren Honorare und sollen die ambulante Versorgung sicherstellen.
  - name: Deutsche Krankenhausgesellschaft (DKG)
    rolle: Dachverband der Krankenhausträger; verhandelt mit den Kassen über Regeln der Klinikvergütung.
  - name: Bundesländer
    rolle: Planen, welche Krankenhäuser es wo gibt, und finanzieren deren Investitionen; sie sind auch für die Investitionskosten von Pflegeeinrichtungen zuständig.
  - name: Bundesamt für Soziale Sicherung (BAS)
    rolle: Verwaltet den Gesundheitsfonds, verteilt die Zuweisungen an die Kassen und führt die Aufsicht über bundesweite Krankenkassen.
