geschichte:
  ereignisse:
    - jahr: "1993"
      titel: Gesundheitsstrukturgesetz
      text: Das Gesetz begrenzt die Budgets unter anderem der Krankenhäuser und leitet den Umbau der Krankenhausfinanzierung ein. Es ist eines von vielen „Kostendämpfungsgesetzen“ seit den 1970er-Jahren.
      quellen: [bpb-verguetung-2017]
    - jahr: "2004"
      titel: Praxisgebühr und neue Zuzahlungen
      text: Mit der Gesundheitsreform 2004 werden die Zuzahlungen neu geregelt und eine Praxisgebühr eingeführt. Die Praxisgebühr fällt Ende 2012 wieder weg; die Zuzahlungsbeträge bleiben bis 2026 unverändert.
      quellen: [bmg-kennzahlen-gkv-2025, bundesregierung-bstabg-2026]
    - jahr: "2009"
      titel: Gesundheitsfonds und einheitlicher Beitragssatz
      text: Alle Beiträge und der Bundeszuschuss fließen seitdem in einen gemeinsamen Gesundheitsfonds. Die Bundesregierung legt einen einheitlichen Beitragssatz für alle Kassen fest.
      quellen: [gkv-sv-finanzierung]
    - jahr: "2015"
      titel: Fester Satz plus Zusatzbeitrag
      text: Der allgemeine Beitragssatz wird auf 14,6 % festgeschrieben. Reicht das Geld nicht, erhebt jede Kasse einen einkommensabhängigen Zusatzbeitrag. Bis 2018 zahlen ihn die Beschäftigten allein.
      quellen: [gkv-sv-finanzierung]
    - jahr: "2019"
      titel: Rückkehr zur Parität
      text: Arbeitgeber und Beschäftigte teilen sich auch den Zusatzbeitrag wieder je zur Hälfte.
      quellen: [gkv-sv-finanzierung]
    - jahr: "2022"
      titel: GKV-Finanzstabilisierungsgesetz
      text: "Gegen ein drohendes Defizit kombiniert die Politik mehrere Maßnahmen: Der Bundeszuschuss steigt 2023 einmalig um 2 Mrd. €, der Bund gibt ein Darlehen, Pharmahersteller zahlen einen höheren Rabatt, zahnärztliche Honorare werden begrenzt."
      quellen: [bundesregierung-finstg-2022]
    - jahr: "2025"
      titel: FinanzKommission Gesundheit eingesetzt
      text: Die Bundesregierung setzt im September 2025 eine Kommission ein. Ihr erster Bericht im März 2026 enthält 66 Empfehlungen mit einem Volumen, das die Lücke für 2027 deutlich übersteigt.
      quellen: [bmg-zusatzbeitrag-2027, finanzkommission-bericht-2026]
    - jahr: "2026"
      titel: GKV-Beitragssatzstabilisierungsgesetz
      text: Bundestag und Bundesrat beschließen im Juli 2026 ein Sparpaket von knapp 19 Mrd. € für 2027. Preise und Honorare dürfen nur noch so stark steigen wie die tatsächlichen Kosten, höchstens wie die Löhne. Der durchschnittliche Zusatzbeitrag bleibt 2027 bei 2,9 %.
      quellen: [bmg-bstabg-2026, bundesregierung-bstabg-2026, bmg-zusatzbeitrag-2027]
  bilanz:
    - typ: fakt
      text: "Trotz vieler Spargesetze ist der Beitragssatz langfristig gestiegen: von gut 12 % Anfang der 1990er-Jahre auf heute 17,5 %."
      quellen: [iaq-beitragssatz-2026]
    - typ: fakt
      text: Nach Erwartung des Ministeriums decken 2027 erstmals seit drei Jahren wieder die Einnahmenzuwächse den Ausgabenanstieg. Strukturreformen sollen folgen.
      quellen: [bmg-zusatzbeitrag-2027]
    - typ: wertung
      text: "Spargesetze folgen einem wiederkehrenden Muster. Sie kombinieren Preisbremsen, Zuschüsse und Zuzahlungen und stabilisieren die Beiträge für einige Jahre. Die grundlegende Schere zwischen Ausgaben und lohnabhängigen Einnahmen haben sie bisher nicht dauerhaft geschlossen."

laender:
  beispiele:
    - land: Frankreich
      ansatz: Jährliches Ausgabenziel, das das Parlament beschließt
      text: "Das Parlament legt jedes Jahr ein Ausgabenziel für die Krankenversicherung fest, das ONDAM. 2025 wurde es zum ersten Mal seit 2020 eingehalten. Etwa vier von fünf Euro der Behandlungskosten trägt die Sozialversicherung, gut jeden achten Euro private Zusatzversicherungen, die fast alle Menschen haben."
      vergleichbarkeit: mittel
      vergleichbarkeit_text: "Frankreich hat wie Deutschland eine Sozialversicherung. Das Ausgabenziel ist aber ein Steuerungsinstrument des Staates; in Deutschland verhandelt die Selbstverwaltung Preise und Honorare weitgehend selbst. Ein Teil der Kosten, den in Deutschland die GKV trägt, läuft in Frankreich über Zusatzversicherungen."
      quellen: [senat-ondam-2025, drees-financement-2025]
    - land: Niederlande
      ansatz: Pflicht-Selbstbehalt für alle Erwachsenen
      text: "Wer erwachsen ist, zahlt die ersten 385 € im Jahr für viele Behandlungen selbst (Eigenrisiko); 2027 steigt der Betrag auf 400 €. Hausarztbesuche sind davon ausgenommen. Daneben zahlen alle eine einheitliche Prämie an ihren Versicherer und einen einkommensabhängigen Beitrag."
      vergleichbarkeit: mittel
      vergleichbarkeit_text: "Das niederländische System ähnelt dem deutschen mit Wettbewerb zwischen Versicherern. Ein Selbstbehalt in dieser Höhe wäre in Deutschland ein großer Bruch, weil hier bisher nur kleine Zuzahlungen mit Belastungsgrenze gelten."
      quellen: [rijksoverheid-eigen-risico-2026, observatory-nl-2024]
    - land: Schweiz
      ansatz: Hohe Kostenbeteiligung plus Kopfprämien mit staatlicher Verbilligung
      text: "Erwachsene zahlen eine Franchise von mindestens 300 Franken im Jahr und darüber 10 % der Kosten, bis höchstens 700 Franken. Die Prämien sind pro Kopf gleich, unabhängig vom Einkommen. Haushalte mit wenig Geld bekommen eine Prämienverbilligung aus Steuern, 2024 rund 6,6 Mrd. Franken."
      vergleichbarkeit: gering
      vergleichbarkeit_text: "Die Schweiz finanziert über Kopfprämien statt Lohnbeiträge und gleicht soziale Härten über Steuern aus. Der Anteil, den Menschen selbst zahlen, ist deutlich höher als in Deutschland. Das zeigt, wie viel Eigenbeteiligung möglich ist, aber auch, wie viel Umverteilung über Steuern dann nötig wird."
      quellen: [bag-kostenbeteiligung, bag-praemienverbilligung-2025]
    - land: Dänemark
      ansatz: Steuerfinanziert, Budget statt Beitragssatz
      text: "Das Gesundheitssystem wird aus Steuern bezahlt. Die Regionen bekommen Budgets; einen Beitragssatz, der steigen könnte, gibt es nicht. Wer in einem öffentlichen Krankenhaus zu lange warten müsste, darf nach einer Wartezeitgarantie in eine private Klinik ausweichen."
      vergleichbarkeit: gering
      vergleichbarkeit_text: "In Dänemark entscheidet das Parlament über die Höhe der Mittel im Haushalt; die Lücke zeigt sich dort eher als Wartezeit oder Leistungsgrenze, nicht als Beitragserhöhung. Ein Wechsel Deutschlands zu diesem Modell wäre ein kompletter Systemumbau."
      quellen: [observatory-dk-2024-hit]
  diagramme:
    - titel: Anteil der Gesundheitsausgaben, den Menschen selbst zahlen
      einheit: Prozent der laufenden Gesundheitsausgaben
