status: entwurf
stand: "2026-11-25"
titel: Wie soll die Finanzlücke der Krankenkassen geschlossen werden?
frage: Die Ausgaben der gesetzlichen Krankenversicherung steigen seit Jahren schneller als ihre Einnahmen. Wie soll die Lücke vor allem geschlossen werden?
kurz_erklaert:
  - typ: fakt
    text: Die Ausgaben der Krankenkassen steigen seit Jahren schneller als ihre Einnahmen.
    quellen:
      - iaq-schere-2026
  - typ: fakt
    text: Bisher wird die Lücke vor allem mit höheren Beiträgen gestopft. Sie sind in drei Jahren um mehr als einen Prozentpunkt gestiegen.
    quellen:
      - vdek-basisdaten-2026
      - gkv-sv-beitragsniveau-2026
  - typ: schaetzung
    text: Für 2027 fehlten ohne Gegenmaßnahmen rund 15 Milliarden Euro. Bezahlen müssen das am Ende Versicherte, Steuerzahler, Kliniken und Praxen oder Patienten.
    quellen:
      - finanzkommission-bericht-2026
kurzfrage: Die Krankenkassen haben zu wenig Geld. Was soll passieren?
videos_tief:
  - titel: Wer zahlt für das 15-Milliarden-Defizit der Krankenkassen?
    absender: Politico
    dauer: 19 Min.
    url: https://www.youtube.com/watch?v=dj71A8PEqSo
    youtube_id: dj71A8PEqSo
video:
  titel: "Krankenkassen in der Krise: Was passiert mit unseren Beiträgen?"
  absender: ZDF frontal (Kanal ZDFheute Nachrichten)
  dauer: 8 Min.
  url: https://www.youtube.com/watch?v=tj05V3KSiww
  youtube_id: tj05V3KSiww

optionen:
  - id: hoehere-beitraege
    titel: Höhere Beiträge
    kurz: Die Leistungen bleiben, wie sie sind; Versicherte und Arbeitgeber zahlen bei Bedarf höhere Beiträge.
    pro:
      - typ: schaetzung
        text: "Der Beitragssatz ist der stärkste einzelne Hebel: Ein Prozentpunkt mehr bringt nach der Faustformel des Ministeriums rund 19 Mrd. € im Jahr. Damit ließe sich eine Lücke wie die für 2027 erwartete in einem Schritt schließen, ohne in die Versorgung einzugreifen."
        genau: "1 Beitragssatzpunkt (allgemeine Krankenversicherung und Rentner) = 18,9 Mrd. € (Schätzung für 2025). Deckungslücke 2027 ohne Reform laut FinanzKommission: 15,3 Mrd. €."
        quellen: [bmg-kennzahlen-gkv-2025, finanzkommission-bericht-2026]
      - typ: fakt
        text: "Die Last verteilt sich nach dem Einkommen und ist nach oben gedeckelt. Ein zusätzlicher Prozentpunkt kostet Beschäftigte an der Beitragsbemessungsgrenze höchstens rund 350 € im Jahr, den Arbeitgeber noch einmal so viel. Wer wenig verdient, zahlt entsprechend wenig."
        genau: "Beitragsbemessungsgrenze 2026: 69.750 € im Jahr. 1 % davon = 697,50 €, je zur Hälfte von Beschäftigten und Arbeitgebern getragen (eigene Berechnung)."
        quellen: [bundesregierung-rechengroessen-2026]
      - typ: wertung
        text: Der Leistungsumfang bleibt erhalten. Niemand muss auf Behandlungen verzichten oder bei Krankheit mehr aus eigener Tasche zahlen.
    contra:
      - typ: schaetzung
        text: "Beiträge verteuern Arbeit. Simulationen des Instituts für Arbeitsmarkt- und Berufsforschung ergaben, dass ein Prozentpunkt niedrigere Sozialbeiträge langfristig bis zu 150.000 Arbeitsplätze bringen könnte. Umgekehrt kosten höhere Beiträge Beschäftigung. Wie groß der Effekt ist, hängt stark davon ab, wie die Löhne reagieren und wie die Beiträge gegenfinanziert werden."
        quellen: [iab-kurzbericht-2005]
        unsicherheit: "Modellrechnung von 2005, als die Arbeitslosigkeit sehr hoch war. Auf den heutigen Arbeitsmarkt mit Fachkräftemangel ist sie nur eingeschränkt übertragbar."
      - typ: fakt
        text: "Beiträge erfassen fast nur Löhne und Renten, und zwar nur bis zur Beitragsbemessungsgrenze. Steigt der Satz, tragen Beschäftigte mit mittlerem Einkommen einen größeren Teil ihres Einkommens bei als Menschen mit sehr hohem Einkommen oder mit Einkünften aus Vermögen."
        quellen: [bundesregierung-rechengroessen-2026]
      - typ: fakt
        text: "Höhere Beiträge lösen das Grundproblem nicht: Wenn die Ausgaben dauerhaft schneller wachsen als die Löhne, muss der Satz Jahr für Jahr weiter steigen. Ohne Eingriffe hätte der Gesamtbeitrag bis 2030 auf über 19 % klettern können."
        genau: "Prognose ohne Reform: durchschnittlicher Zusatzbeitrag 2030 rund 4,7 %, Gesamtbeitragssatz bis zu 19,3 %."
        quellen: [bt-drs-21-6130]
    gewinnt: [Umfang des Leistungskatalogs, Patientinnen und Patienten mit hohem Behandlungsbedarf]
    kostet: [Beschäftigte mit mittlerem Einkommen, Arbeitgeber, Arbeitskosten]
    kurz_pro: Die Versorgung bleibt, wie sie ist.
    kurz_contra: Arbeit wird teurer, Beschäftigten bleibt weniger netto.

  - id: mehr-steuermittel
    titel: Mehr Steuergeld
    kurz: Der Bund zahlt mehr in die Krankenversicherung, etwa kostendeckende Beiträge für Bürgergeldbeziehende.
    pro:
      - typ: schaetzung
        text: "Für Bürgergeldbeziehende zahlt der Bund eine Pauschale an die Kassen. Nach einem Gutachten im Auftrag des GKV-Spitzenverbands deckte sie 2022 nur gut ein Drittel der Kosten. Den Rest tragen die Beitragszahler, also Beschäftigte, Rentner und Arbeitgeber, nicht aber alle Steuerzahler."
        genau: "Pauschale 2022: 108,48 € im Monat je Person; kostendeckend wären 311,45 € gewesen. Fehlbetrag rund 9,2 Mrd. €."
        quellen: [gkv-sv-iges-buergergeld-2024]
        unsicherheit: Studie im Auftrag eines Interessenträgers; Daten von 2022.
      - typ: wertung
        text: "Steuern werden auf alle Einkommensarten erhoben, auch auf Mieten, Kapitalerträge und Einkommen oberhalb der Beitragsbemessungsgrenze. Eine Finanzierung über Steuern verteilt die Last daher breiter als Beiträge auf Löhne."
      - typ: position
        wer: GKV-Spitzenverband
        text: Der Bund zahle für die Gesundheitsversorgung von Bürgergeldbeziehenden zu wenig. Diese staatliche Aufgabe werde auf die Beitragszahler abgewälzt. Die Kassen klagen deshalb gegen den Bund.
        quellen: [gkv-sv-klage-2025, gkv-sv-buergergeld-2026]
      - typ: position
        wer: Bundesvereinigung der Deutschen Arbeitgeberverbände (BDA)
        text: Die Krankenversicherung von Bürgergeldbeziehenden sei eine „versicherungsfremde Leistung“, die vollständig aus Steuermitteln bezahlt werden müsse.
        quellen: [bda-finanzkommission-2026]
    contra:
      - typ: fakt
        text: "Steuerzuschüsse hängen von der Haushaltslage ab. Der Bund hat seinen Zuschuss schon mehrfach gekürzt, etwa 2013 bis 2015. Für 2027 senkt er ihn erneut, obwohl er an anderer Stelle mehr zahlt."
        genau: "Bundeszuschuss 2012: 14,0 Mrd. €, 2014: 10,5 Mrd. €, seit 2017 regulär 14,5 Mrd. €. Für 2027 Absenkung um 1,35 Mrd. €."
        quellen: [iaq-bundeszuschuss, bmg-bstabg-2026]
      - typ: wertung
        text: "Ein Steuer-Euro für die Krankenversicherung fehlt an anderer Stelle oder muss über höhere Steuern oder Schulden aufgebracht werden. Die Last verschwindet nicht, sie wird nur anders verteilt."
      - typ: wertung
        text: "Mehr Steuergeld ändert nichts daran, wie schnell die Ausgaben wachsen. Es verschiebt die Frage nur in den Bundeshaushalt, der ebenfalls mit einer alternden Bevölkerung rechnen muss."
    gewinnt: [Beitragszahlende, Arbeitgeber]
    kostet: [Bundeshaushalt, Steuerzahlende, Andere staatliche Aufgaben]
    kurz_pro: Die Last verteilt sich auf alle Einkommen, nicht nur auf Löhne.
    kurz_contra: Das Geld fehlt im Bundeshaushalt an anderer Stelle.

  - id: ausgaben-begrenzen
    titel: Ausgaben begrenzen
    kurz: Preise, Honorare und Strukturen werden so gesteuert, dass die Ausgaben nicht schneller wachsen als die Einnahmen.
    pro:
      - typ: schaetzung
        text: "Die FinanzKommission Gesundheit kommt zu dem Ergebnis, dass vor allem die Preise die Ausgaben treiben: Vergütungen seien schneller gestiegen als die Einnahmen der Kassen, weil der Grundsatz der Beitragssatzstabilität geschwächt worden sei. Wer die Preise bremst, setzt also an der Hauptursache an."
        quellen: [finanzkommission-bericht-2026]
        unsicherheit: "Analyse einer vom Ministerium eingesetzten Kommission. Leistungserbringer verweisen dagegen auf gestiegene Personal- und Energiekosten."
      - typ: fakt
        text: "Die tatsächlichen Kosten der Kliniken stiegen nach Angaben der Bundesregierung im Mittel langsamer als die Einnahmen der Kassen je Mitglied. Eine Obergrenze in Höhe der echten Kostenentwicklung spart deshalb Geld, ohne dass Kliniken weniger bekommen, als sie tatsächlich ausgeben."
        genau: "Orientierungswert (Kostenentwicklung der Krankenhäuser) seit 2013 im Median deutlich unter 2,5 %; Grundlohnrate im Mittel über 3 %."
        quellen: [bt-drs-21-6130]
      - typ: position
        wer: Bundesvereinigung der Deutschen Arbeitgeberverbände (BDA)
        text: Die Ausgaben müssten „strikt an die tatsächlich vorhandenen Einnahmen gebunden werden“. Preis- und Honorarsteigerungen dürften nur so weit gehen, wie die Beitragseinnahmen sie decken.
        quellen: [bda-finanzkommission-2026]
    contra:
      - typ: fakt
        text: "Gesundheit ist personalintensiv. Steigen die Tariflöhne stärker als die Obergrenze, bekommen Kliniken nach dem Spargesetz von 2026 nur noch die Hälfte der Differenz erstattet. Den Rest müssen sie anders auffangen, etwa durch weniger Personal oder ein kleineres Angebot."
        quellen: [bt-drs-21-6130]
      - typ: fakt
        text: "Manche Ausgaben steigen, weil die Politik es so wollte: Die Kosten für Pflegekräfte im Krankenhaus werden seit 2020 voll erstattet. Seitdem gibt es dort mehr Pflegepersonal, und die Ausgaben dafür wuchsen um etwa 11 % pro Jahr. Ein harter Deckel stellt solche Verbesserungen in Frage."
        genau: "Pflegepersonalkosten im Krankenhaus: Wachstum seit 2020 durchschnittlich rund 2,1 Mrd. € pro Jahr, 2025 rund 25 Mrd. €."
        quellen: [bt-drs-21-6130]
      - typ: wertung
        text: "Ein Deckel für alle trifft gute und schlechte Anbieter gleich. Strukturreformen, die gezielt Doppeluntersuchungen oder unnötige Klinikaufenthalte abbauen, brauchen dagegen Jahre, bis sie Geld sparen."
    gewinnt: [Beitragszahlende, Stabilität der Beiträge]
    kostet: ["Einnahmen von Kliniken, Praxen und Herstellern", Beschäftigte im Gesundheitswesen, Möglicherweise kurze Wartezeiten und Breite des Angebots]
    kurz_pro: Beiträge bleiben stabil, ohne dass Patienten mehr zahlen.
    kurz_contra: Kliniken und Praxen bekommen weniger; das kann die Versorgung treffen.

  - id: mehr-eigenbeteiligung
    titel: Patienten zahlen mehr selbst
    kurz: Patientinnen und Patienten zahlen bei Behandlungen mehr selbst, etwa durch höhere Zuzahlungen oder eine Gebühr pro Arztbesuch.
    pro:
      - typ: fakt
        text: "Die Zuzahlungen waren seit 2004 nicht angepasst worden. Weil Preise und Löhne seitdem gestiegen sind, sind sie real immer weniger wert geworden. Eine Anpassung an die Inflation stellt nur das frühere Verhältnis wieder her."
        quellen: [bundesregierung-bstabg-2026]
      - typ: wertung
        text: "Wer einen kleinen Teil selbst zahlt, überlegt eher, ob ein Arztbesuch oder ein Medikament nötig ist. Das kann Leistungen verringern, die wenig bringen, vor allem dort, wo es günstige Alternativen gibt."
      - typ: position
        wer: Bundesvereinigung der Deutschen Arbeitgeberverbände (BDA)
        text: Eine Kontaktgebühr bei jedem Arztbesuch und eine höhere Belastungsgrenze (3 statt 2 % des Einkommens) sollten Anreize für kostenbewusstes Verhalten setzen.
        quellen: [bda-finanzkommission-2026]
    contra:
      - typ: fakt
        text: "Zuzahlungen bringen im Vergleich wenig: Alle Zuzahlungen zusammen machen nur etwa jeden siebzigsten Euro der Kassenausgaben aus. Selbst eine Erhöhung um die Hälfte schließt nur einen kleinen Teil der Lücke."
        genau: "Zuzahlungen 2025 (vorläufig): 5,2 Mrd. € bei Gesamtausgaben von 352,4 Mrd. €. Erhöhung um 50 %: rund 1,9 Mrd. € im Jahr 2027."
        quellen: [bt-drs-21-6130, bmg-kv45-2025]
      - typ: wertung
        text: "Zuzahlungen treffen vor allem Kranke und Ältere, die viele Leistungen brauchen. Menschen mit wenig Geld schieben dann womöglich auch nötige Behandlungen auf, was später teurer werden kann."
      - typ: fakt
        text: "Zuzahlungen sind durch eine **Belastungsgrenze** gedeckelt: höchstens 2 % des Haushaltsbruttoeinkommens im Jahr, für chronisch Kranke 1 %. Gerade bei Menschen mit hohem Bedarf greift ein höherer Satz deshalb nur begrenzt."
        quellen: [bundesregierung-bstabg-2026]
      - typ: wertung
        text: Mit der Praxisgebühr gab es bis Ende 2012 schon einmal eine Gebühr für Arztbesuche. Ob sie unnötige Besuche wirklich verringert hat, ist umstritten.
    gewinnt: [Beitragszahlende, Möglicherweise weniger unnötige Leistungen]
    kostet: ["Patientinnen und Patienten, besonders solche mit wenig Einkommen", Chronisch Kranke]
    kurz_pro: Wer Leistungen nutzt, zahlt mit; das kann unnötige Arztbesuche senken.
    kurz_contra: Kranke und Menschen mit wenig Geld werden stärker belastet.

erklaerung:
  - typ: fakt
    text: "Fast jeder dritte Euro der gesetzlichen Krankenversicherung geht ins Krankenhaus, etwa jeder sechste in Arzneimittel. In beiden Bereichen stiegen die Kosten zuletzt besonders stark, weil Kliniken viel Personal brauchen und neue Medikamente teuer sind."
    genau: "2024: Ausgaben insgesamt 327,4 Mrd. €, davon Krankenhaus 102,2 Mrd. € (+8,5 %), Arzneimittel 55,2 Mrd. € (+9,6 %), ärztliche Behandlung 50,3 Mrd. €. Alle Ausgaben: +6,5 %."
    quellen: [bmg-kennzahlen-gkv-2025]
  - typ: fakt
    text: "Die Einnahmen hängen fast ganz an Löhnen und Renten. Seit 2005 haben sich die Leistungsausgaben je Mitglied etwa verdoppelt, die beitragspflichtigen Einnahmen je Mitglied sind aber nur um gut die Hälfte gewachsen. So öffnet sich eine Schere."
    genau: "Index 2005 = 100, Stand 2024: Leistungsausgaben je Mitglied 199,4; Bruttoinlandsprodukt 186,1; beitragspflichtige Einnahmen je Mitglied 158,9."
    quellen: [iaq-schere-2026]
  - typ: fakt
    text: "Die Lücke wird bisher vor allem über den **Zusatzbeitrag** geschlossen, den jede Kasse zusätzlich zum festen allgemeinen Satz erhebt. Deshalb ist der Gesamtbeitrag in nur drei Jahren um mehr als einen Prozentpunkt gestiegen."
    genau: "Allgemeiner Beitragssatz 14,6 %. Gesamtbeitrag mit dem festgelegten durchschnittlichen Zusatzbeitrag: 2023 16,2 %, 2026 17,5 %. Tatsächlich erheben die Kassen 2026 im Schnitt 3,13 % Zusatzbeitrag."
    quellen: [vdek-basisdaten-2026, gkv-sv-beitragsniveau-2026]
  - typ: schaetzung
    text: "Ohne Gegenmaßnahmen hätten 2027 rund drei Viertel eines Beitragssatzpunkts gefehlt. Bis 2030 würde sich die Lücke mehr als verdoppeln, weil die Ausgaben jedes Jahr schneller wachsen als die Einnahmen."
    genau: "Deckungslücke bei stabilem Zusatzbeitrag von 2,9 %: 2027 15,3 Mrd. €, 2028 21,5 Mrd. €, 2029 31,9 Mrd. €, 2030 40,4 Mrd. €."
    quellen: [finanzkommission-bericht-2026, bt-drs-21-6130]
    unsicherheit: Prognose, abhängig von Lohn- und Ausgabenentwicklung.
  - typ: fakt
    text: "Das Spargesetz von 2026 setzt an allen vier Hebeln zugleich an. Den größten Teil tragen aber Kliniken, Praxen und Hersteller: Etwa zwei von drei eingesparten Euro kommen von ihnen."
    genau: "GKV-Beitragssatzstabilisierungsgesetz, Entwurf: Entlastung 2027 rund 16,3 Mrd. €, davon 11,2 Mrd. € bei Leistungserbringern, Herstellern und Kassen, 2,5 Mrd. € bei Patienten, 4,3 Mrd. € Mehreinnahmen; der Bund senkt seinen Zuschuss. Beschlossen im Juli 2026."
    quellen: [bt-drs-21-6130, bmg-bstabg-2026]

zusammenhaenge:
  erklaerung:
    - typ: fakt
      text: "Zwei Faustformeln helfen, die Größenordnungen einzuordnen: Ein Prozentpunkt Beitragssatz bringt rund 19 Mrd. € im Jahr. Ein Prozent mehr Ausgaben kostet rund 3,4 Mrd. €. Jedes Prozent, um das die Ausgaben schneller wachsen als die Einnahmen, verlangt also knapp 0,2 Beitragssatzpunkte mehr."
      genau: "Faustformeln des BMG für 2025: 1 Beitragssatzpunkt = 18,9 Mrd. €; 1 % Ausgabenentwicklung = 3,4 Mrd. € (eigene Division: rund 0,18 Punkte)."
      quellen: [bmg-kennzahlen-gkv-2025]
    - typ: fakt
      text: "Die Einnahmen wachsen ungefähr mit den Löhnen, mittelfristig rund 3 % im Jahr. Die Ausgaben wachsen schneller: Steigende Preise und Honorare, mehr Behandlungen und eine ältere Bevölkerung wirken zusammen. Die Alterung schwächt zugleich die Einnahmen, weil weniger Menschen im Erwerbsalter Beiträge aus Löhnen zahlen. Hinzu kommt, dass die Beschäftigung stagniert."
      quellen: [bt-drs-21-6130]
    - typ: fakt
      text: "Jeder Weg, die Lücke zu schließen, belastet eine Gruppe: die Beitragszahler über den Beitragssatz, die Steuerzahler über den Bund, Kliniken, Praxen, Hersteller und ihre Beschäftigten über niedrigere Preise oder die Patienten über Zuzahlungen. Eine Lücke von 0,75 Beitragssatzpunkten hätte ein durchschnittliches Mitglied mit seinem Arbeitgeber 2027 rund 260 € im Jahr gekostet."
      quellen: [finanzkommission-bericht-2026]
  kette:
    - titel: Was die Ausgaben treibt
      punkte:
        - label: Preise und Honorare
          text: Vergütungen stiegen zuletzt schneller als die Einnahmen der Kassen. Nach Analyse der FinanzKommission ist das der wichtigste Treiber.
        - label: Personal
          text: Kliniken, Pflege und Praxen sind personalintensiv; steigende Löhne schlagen direkt auf die Ausgaben durch.
        - label: Medizinischer Fortschritt
          text: Neue Medikamente und Verfahren helfen oft, sind aber teuer.
        - label: Alterung und Menge
          text: Ältere Menschen brauchen mehr Behandlungen; dazu kommen Behandlungen, die medizinisch nicht immer nötig sind.
    - titel: Wohin das Geld geht
      punkte:
        - label: Krankenhaus
          text: Fast jeder dritte Euro.
        - label: Arzneimittel
          text: Etwa jeder sechste Euro.
        - label: Arztpraxen
          text: Etwa jeder siebte Euro.
        - label: Krankengeld, Heil- und Hilfsmittel, Zahnärzte
          text: Zusammen etwa jeder fünfte Euro.
        - label: Verwaltung der Kassen
          text: Knapp 4 von 100 Euro.
    - titel: Warum die Einnahmen nicht mithalten
      punkte:
        - label: Beiträge hängen an Löhnen
          text: Die Einnahmen wachsen ungefähr mit den Löhnen und damit langsamer als die Ausgaben.
        - label: Obergrenze
          text: Einkommen über der Beitragsbemessungsgrenze ist beitragsfrei.
        - label: Rentner und Mitversicherte
          text: Renten sind meist niedriger als Löhne; Kinder und viele Ehepartner sind beitragsfrei mitversichert.
        - label: Beschäftigung stagniert
          text: Wenn die Zahl der Beschäftigten nicht mehr wächst, fehlt ein Einnahmenzuwachs, den es früher gab.
    - titel: Stellschrauben
      punkte:
        - label: Beitragssatz und Grenzen
          text: Höherer Satz oder höhere Beitragsbemessungsgrenze. Es zahlen Beschäftigte, Rentner und Arbeitgeber.
        - label: Steuermittel
          text: Kostendeckende Pauschalen, Zuschüsse oder niedrigere Steuern auf Arzneimittel. Es zahlen die Steuerzahler.
        - label: Preise und Strukturen
          text: Deckel für Preise und Honorare, strengere Prüfungen. Die Last tragen Kliniken, Praxen, Hersteller und ihre Beschäftigten.
        - label: Eigenbeteiligung
          text: Höhere Zuzahlungen oder Gebühren. Es zahlen Patientinnen und Patienten.
  rechner:
    titel: Womit lässt sich die Lücke für 2027 schließen?
    einheit: Mrd. € pro Jahr
    ziel:
      label: Deckungslücke 2027 ohne Gegenmaßnahmen
      wert: 15.3
      stand: "2027 (Prognose vom März 2026)"
      quelle: finanzkommission-bericht-2026
      hinweis: Betrag, der nötig wäre, damit der durchschnittliche Zusatzbeitrag bei 2,9 % bleibt. Das Spargesetz von 2026 hat diese Lücke für 2027 weitgehend geschlossen. Bis 2030 könnte sie ohne weitere Schritte auf rund 40 Mrd. € wachsen.
    massnahmen:
      - id: beitragssatz
        titel: Beitragssatz anheben
        option: hoehere-beitraege
        wer_traegt: Beschäftigte und Arbeitgeber je zur Hälfte, ebenso Rentner und Rentenversicherung
        varianten:
          - label: "+0,1 Prozentpunkte"
            wirkung: 1.9
          - label: "+0,5 Prozentpunkte"
            wirkung: 9.5
          - label: "+1 Prozentpunkt"
            wirkung: 18.9
        typ: schaetzung
        quelle: bmg-kennzahlen-gkv-2025
        hinweis: Faustformel des Ministeriums (Stand 2025), anteilig umgerechnet. Für 2026 liegt der Wert eines Punkts bei rund 19,7 Mrd. €.
      - id: bemessungsgrenze
        titel: Beitragsbemessungsgrenze zusätzlich anheben
        option: hoehere-beitraege
        wer_traegt: Gutverdienende oberhalb der bisherigen Grenze und ihre Arbeitgeber
        varianten:
          - label: "+300 € im Monat (wie 2027 beschlossen)"
            wirkung: 2.5
        typ: schaetzung
        quelle: bt-drs-21-6130
        hinweis: "1,2 Mrd. € tragen die Mitglieder, 1,3 Mrd. € die Arbeitgeber. Betroffen sind rund 5,4 Mio. Mitglieder."
      - id: buergergeld-pauschalen
        titel: Kostendeckende Beiträge für Bürgergeldbeziehende
        option: mehr-steuermittel
        wer_traegt: Steuerzahlende über den Bundeshaushalt
        varianten:
          - label: Volle Finanzierung aus Steuermitteln
            wirkung: 12.0
        typ: schaetzung
        quelle: finanzkommission-bericht-2026
        hinweis: Empfehlung der FinanzKommission. Das Spargesetz erhöht die Zahlungen des Bundes nur schrittweise, auf 2,75 Mrd. € ab 2031.
      - id: mehrwertsteuer-arzneimittel
        titel: Mehrwertsteuer auf Arzneimittel von 19 auf 7 % senken
        option: mehr-steuermittel
        wer_traegt: Bund, Länder und Gemeinden durch geringere Steuereinnahmen
        varianten:
          - label: Ermäßigter Satz von 7 %
            wirkung: 5.6
