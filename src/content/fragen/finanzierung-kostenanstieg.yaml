bereich: finanzierung
reihenfolge: 2
status: entwurf
stand: "2026-11-25"
titel: Ausgaben wachsen schneller als Einnahmen – wie die Lücke schließen?
frage: Die Ausgaben der gesetzlichen Krankenversicherung steigen seit Jahren schneller als ihre Einnahmen. Wie soll die Lücke vor allem geschlossen werden?
optionen:
  - id: hoehere-beitraege
    titel: Höhere Beiträge
    kurz: Die Leistungen bleiben, wie sie sind; Versicherte und Arbeitgeber zahlen bei Bedarf höhere Beiträge.
    pro:
      - typ: wertung
        text: Der Leistungsumfang bleibt erhalten. Niemand muss auf Behandlungen verzichten oder mehr aus eigener Tasche zahlen.
      - typ: wertung
        text: Beiträge richten sich nach dem Einkommen. Wer mehr verdient, trägt mehr – das gilt als sozial ausgewogen.
      - typ: wertung
        text: Beitragserhöhungen wirken schnell und sind für Krankenkassen gut planbar.
    contra:
      - typ: wertung
        text: Höhere Beiträge verteuern Arbeit. Das kann Arbeitsplätze und Wettbewerbsfähigkeit belasten.
      - typ: wertung
        text: Beschäftigte haben weniger Netto vom Brutto. Einkommen oberhalb der Beitragsbemessungsgrenze und andere Einkommensarten bleiben außen vor.
      - typ: wertung
        text: Wer nur Beiträge erhöht, nimmt den Druck, Geld wirksamer einzusetzen.
    gewinnt: [Umfang des Leistungskatalogs, Patientinnen und Patienten mit hohem Behandlungsbedarf]
    kostet: [Beschäftigte, Arbeitgeber, Lohnnebenkosten]
  - id: mehr-steuermittel
    titel: Mehr Steuermittel
    kurz: Der Bund zahlt mehr in die Krankenversicherung, etwa kostendeckende Beiträge für Bürgergeldbeziehende.
    pro:
      - typ: position
        wer: GKV-Spitzenverband
        text: Der Bund zahle für die Gesundheitsversorgung von Bürgergeldbeziehenden zu wenig. Diese staatliche Aufgabe werde auf die Beitragszahler abgewälzt. Die Kassen klagen deshalb gegen den Bund.
        quellen: [gkv-sv-klage-2025, gkv-sv-buergergeld-2026]
      - typ: position
        wer: Bundesvereinigung der Deutschen Arbeitgeberverbände (BDA)
        text: Die Krankenversicherung von Bürgergeldbeziehenden sei eine „versicherungsfremde Leistung“, die vollständig aus Steuermitteln bezahlt werden müsse.
        quellen: [bda-finanzkommission-2026]
      - typ: wertung
        text: Steuern werden auf alle Einkommensarten erhoben, nicht nur auf Löhne. Die Last verteilt sich damit breiter.
    contra:
      - typ: wertung
        text: Der Bundeshaushalt ist ebenfalls angespannt. Mehr Geld für die Krankenversicherung fehlt an anderer Stelle oder erfordert höhere Steuern oder Schulden.
      - typ: wertung
        text: Je mehr die GKV von Steuermitteln abhängt, desto stärker hängt sie von der jeweiligen Haushaltslage und politischen Mehrheiten ab.
      - typ: wertung
        text: Steuergeld allein löst nicht das Problem, dass die Ausgaben schneller wachsen als die Wirtschaft.
    gewinnt: [Beitragszahlende, Arbeitgeber]
    kostet: [Bundeshaushalt, Steuerzahlende, Andere staatliche Aufgaben]
  - id: ausgaben-begrenzen
    titel: Ausgaben begrenzen
    kurz: Preise, Honorare und Strukturen werden so gesteuert, dass die Ausgaben nicht schneller wachsen als die Einnahmen.
    pro:
      - typ: position
        wer: Bundesvereinigung der Deutschen Arbeitgeberverbände (BDA)
        text: Die Ausgaben müssten „strikt an die tatsächlich vorhandenen Einnahmen gebunden werden“. Preis- und Honorarsteigerungen dürften nur so weit gehen, wie die Beitragseinnahmen sie decken.
        quellen: [bda-finanzkommission-2026]
      - typ: wertung
        text: Nicht jede Ausgabe verbessert die Gesundheit. Wer Doppeluntersuchungen, überhöhte Preise oder unnötige Klinikaufenthalte abbaut, spart, ohne die Versorgung zu verschlechtern.
      - typ: wertung
        text: Eine Ausgabengrenze zwingt alle Beteiligten, effizienter zu werden, und hält die Beiträge stabil.
    contra:
      - typ: wertung
        text: Wenn Preise und Honorare langsamer steigen als Löhne und Kosten, können Praxen, Kliniken und Pflegedienste in Schwierigkeiten geraten. Das kann Wartezeiten verlängern oder Angebote verkleinern.
      - typ: wertung
        text: Strukturreformen brauchen Jahre, bis sie Geld sparen. Kurzfristige Deckel treffen oft alle gleichermaßen, unabhängig von der Qualität.
      - typ: wertung
        text: Neue, teure Behandlungen können zum Nachteil von Patienten langsamer in die Versorgung kommen.
    gewinnt: [Beitragszahlende, Stabilität der Beiträge]
    kostet: [Einnahmen von Kliniken, Praxen und Herstellern, Möglicherweise Wartezeiten und Angebot]
  - id: mehr-eigenbeteiligung
    titel: Mehr Eigenbeteiligung
    kurz: Patientinnen und Patienten zahlen bei der Inanspruchnahme mehr selbst, etwa durch höhere Zuzahlungen oder eine Gebühr pro Arztbesuch.
    pro:
      - typ: position
        wer: Bundesvereinigung der Deutschen Arbeitgeberverbände (BDA)
        text: Eine Kontaktgebühr bei jedem Arztbesuch und eine höhere Belastungsgrenze (3 statt 2 % des Einkommens) sollen Anreize für kostenbewusstes Verhalten setzen.
        quellen: [bda-finanzkommission-2026]
      - typ: wertung
        text: Wer einen Teil selbst zahlt, überlegt eher, ob ein Arztbesuch oder ein Medikament nötig ist. Das kann unnötige Leistungen verringern.
      - typ: fakt
        text: Zuzahlungen sind durch eine **Belastungsgrenze** gedeckelt – 2 % des Haushaltsbruttoeinkommens im Jahr, für chronisch Kranke 1 %.
        quellen: [bundesregierung-bstabg-2026]
    contra:
      - typ: wertung
        text: Menschen mit wenig Geld könnten auch nötige Behandlungen aufschieben. Das kann später teurer werden.
      - typ: wertung
        text: Kranke zahlen mehr als Gesunde. Das schwächt den Solidarausgleich.
      - typ: wertung
        text: Mit der Praxisgebühr gab es bis Ende 2012 schon einmal eine Gebühr für Arztbesuche. Ob sie unnötige Besuche wirklich verringert hat, ist umstritten.
    gewinnt: [Beitragszahlende, Möglicherweise weniger unnötige Arztbesuche]
    kostet: [Patientinnen und Patienten, besonders mit wenig Einkommen, Chronisch Kranke]
erklaerung:
  - typ: fakt
    text: 2024 gab die GKV 327,4 Mrd. € aus, nahm aber nur 320,8 Mrd. € ein. Die Ausgaben stiegen um 6,5 %, die Einnahmen um 5,0 %.
    quellen: [bmg-kennzahlen-gkv-2025]
  - typ: fakt
    text: Im ersten Halbjahr 2026 stiegen die Leistungsausgaben um 7,4 %, die beitragspflichtigen Einnahmen nur um 4,1 %.
    quellen: [gkv-sv-kostenproblem-2026]
  - typ: fakt
    text: Der Beitrag besteht aus dem **allgemeinen Beitragssatz** von 14,6 % und einem **Zusatzbeitrag**, den jede Kasse selbst festlegt. Das Ministerium hat den durchschnittlichen Zusatzbeitrag für 2027 – wie für 2026 – auf 2,9 % festgelegt. Tatsächlich erheben die Kassen im Schnitt derzeit 3,13 %.
    quellen: [bmg-kennzahlen-gkv-2025, bmg-zusatzbeitrag-2027, gkv-sv-beitragsniveau-2026]
  - typ: schaetzung
    text: Die FinanzKommission Gesundheit bezifferte die Finanzlücke der GKV auf über 15 Mrd. € für 2027 und über 40 Mrd. € für 2030 – jeweils ohne Gegenmaßnahmen.
    quellen: [bmg-finanzkommission-2026]
    unsicherheit: Prognose, abhängig von Lohn- und Ausgabenentwicklung.
  - typ: fakt
    text: Mit dem **GKV-Beitragssatzstabilisierungsgesetz** (beschlossen im Juli 2026) setzt die Politik für 2027 auf alle vier Hebel zugleich. Es begrenzt Preis- und Honorarsteigerungen, erhöht Zuzahlungen einmalig um 50 % und hebt die Beitragsbemessungsgrenze an. Der Bund zahlt mehr für Bürgergeldbeziehende, senkt aber gleichzeitig seinen allgemeinen Zuschuss.
    quellen: [bmg-bstabg-2026, bundesregierung-bstabg-2026, bundesregierung-rechengroessen-2027]
zielkonflikte:
  - typ: wertung
    text: '**Stabile Beiträge gegen vollen Leistungsumfang:** Jeder Euro, der nicht über Beiträge kommt, muss aus Steuern, Einsparungen oder eigener Tasche kommen.'
  - typ: wertung
    text: '**Solidarität gegen Eigenverantwortung:** Mehr Eigenbeteiligung entlastet alle Beitragszahler, belastet aber vor allem Kranke.'
  - typ: wertung
    text: '**Kurzfristige Entlastung gegen langfristige Wirkung:** Ausgabendeckel und Zuschüsse wirken sofort, Strukturreformen erst nach Jahren.'
  - typ: wertung
    text: '**Arbeitskosten gegen Staatshaushalt:** Höhere Beiträge verteuern Arbeit, höhere Steuerzuschüsse belasten den Bundeshaushalt.'
