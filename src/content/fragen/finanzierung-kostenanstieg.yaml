  aussagen:
    - typ: schaetzung
      text: Laut einer Studie des IGES-Instituts für den GKV-Spitzenverband deckten die Beiträge des Bundes für Bürgergeldbeziehende 2022 nur 39 % der Kosten. Es fehlten rund 9,2 Mrd. €. Der Bund zahlte 108,48 € im Monat je Person; kostendeckend wären 311,45 € gewesen.
      quellen: [gkv-sv-iges-buergergeld-2024]
      unsicherheit: Studie im Auftrag eines Interessenträgers; Daten von 2022.
    - typ: fakt
      text: Ab 2027 erhöht der Bund seine Zahlungen für Grundsicherungsbeziehende schrittweise, von 1 Mrd. € (2027) auf 2,75 Mrd. € jährlich ab 2031.
      quellen: [bmg-bstabg-2026]
geschichte:
  ereignisse:
    - jahr: "2025"
      titel: FinanzKommission Gesundheit eingesetzt
      text: Die Bundesregierung setzt im September 2025 eine Kommission ein. Ihr erster Bericht im März 2026 enthält 66 Empfehlungen für alle Bereiche der GKV.
      quellen: [bmg-zusatzbeitrag-2027, bmg-finanzkommission-2026]
    - jahr: "2026"
      titel: GKV-Beitragssatzstabilisierungsgesetz
      text: Bundestag und Bundesrat beschließen im Juli 2026 ein Sparpaket von knapp 19 Mrd. € für 2027. Der durchschnittliche Zusatzbeitrag bleibt dadurch 2027 bei 2,9 %.
      quellen: [bmg-bstabg-2026, bmg-zusatzbeitrag-2027]
  bilanz:
    - typ: fakt
      text: Das Ministerium erwartet, dass 2027 erstmals seit drei Jahren der Ausgabenanstieg wieder durch Einnahmenzuwächse gedeckt ist. Strukturreformen sollen folgen.
      quellen: [bmg-zusatzbeitrag-2027]
verknuepft:
  - frage: finanzierung-versicherungssystem
    grund: Wer in die GKV einzahlt, bestimmt ihre Einnahmenbasis.
  - frage: arzneimittel-preise
    grund: Arzneimittel sind ein großer und schnell wachsender Ausgabenblock.
  - frage: krankenhaus-verguetung
    grund: Krankenhäuser sind der größte Ausgabenblock der GKV.
  - frage: ambulant-steuerung
    grund: Bessere Steuerung von Patienten gilt als möglicher Weg, Ausgaben zu begrenzen.
  - frage: praevention-anreize
    grund: Prävention soll langfristig Krankheitskosten vermeiden.
