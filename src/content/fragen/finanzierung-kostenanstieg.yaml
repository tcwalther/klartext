zielkonflikte:
  - typ: wertung
    text: "**Stabile Beiträge gegen vollen Leistungsumfang:** Jeder Euro, der nicht über Beiträge kommt, muss aus Steuern, durch Einsparungen oder aus eigener Tasche aufgebracht werden."
  - typ: wertung
    text: "**Solidarität gegen Eigenverantwortung:** Mehr Eigenbeteiligung entlastet alle Beitragszahler, belastet aber vor allem Kranke."
  - typ: wertung
    text: "**Kurzfristige Entlastung gegen langfristige Wirkung:** Ausgabendeckel und Zuschüsse wirken sofort, Strukturreformen erst nach Jahren."
  - typ: wertung
    text: "**Arbeitskosten gegen Staatshaushalt:** Höhere Beiträge verteuern Arbeit, höhere Steuerzuschüsse belasten den Bundeshaushalt."
  - typ: wertung
    text: "**Sparen gegen gute Arbeitsbedingungen:** Ein großer Teil der Ausgaben entfällt auf Löhne. Wer Preise begrenzt, begrenzt oft auch, wie viel Personal bezahlt werden kann."

