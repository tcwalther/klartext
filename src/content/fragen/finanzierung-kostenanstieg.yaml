        - label: Niederlande
          wert: 12.0
        - label: Dänemark
          wert: 14.0
        - label: Vereinigtes Königreich
          wert: 14.6
        - label: Österreich
          wert: 16.5
        - label: Schweiz
          wert: 22.0
  fazit:
    - typ: wertung
      text: "Kein Land hat das Problem steigender Gesundheitsausgaben gelöst. Die Länder unterscheiden sich vor allem darin, wo die Lücke sichtbar wird: als Beitragserhöhung, als Steuerlast, als Selbstbehalt oder als Wartezeit."
    - typ: fakt
      text: "Deutschland liegt beim Anteil der Selbstzahlungen im unteren Bereich vergleichbarer Länder. Die Schweiz zeigt, dass deutlich mehr Eigenbeteiligung möglich ist, allerdings mit entsprechend höherer Belastung für Menschen, die viel Behandlung brauchen."
      quellen: [oecd-hag-2025]

verknuepft:
  - frage: finanzierung-versicherungssystem
    grund: Wer in die GKV einzahlt, bestimmt ihre Einnahmenbasis.
  - frage: finanzierung-kassenvielfalt
    grund: Verwaltungskosten und Wettbewerb der Kassen sind ein kleiner, aber viel diskutierter Ausgabenposten.
  - frage: arzneimittel-preise
    grund: Arzneimittel sind ein großer und schnell wachsender Ausgabenblock.
  - frage: krankenhaus-verguetung
    grund: Krankenhäuser sind der größte Ausgabenblock der GKV.
  - frage: ambulant-steuerung
    grund: Bessere Steuerung von Patienten gilt als möglicher Weg, Ausgaben zu begrenzen.
  - frage: praevention-anreize
    grund: Prävention soll langfristig Krankheitskosten vermeiden.
  - frage: fachkraefte-pflege
    grund: Löhne im Gesundheitswesen sind ein großer Kostentreiber und zugleich eine Voraussetzung für genug Personal.

parteien:
  - partei: AfD
    option: mehr-steuermittel
    beleg: Weitere Beitragssatzerhöhungen sind vorprogrammiert. Das werden wir verhindern, indem die beitragsfreie Mitversicherung der Bürgergeldempfänger, die heute zu zwei Dritteln vom Beitragszahler finanziert wird, zukünftig vollständig aus dem Bundeshaushalt aufgebracht wird.
    seite: "21"
    quelle: wahlprogramm-2025-afd
  - partei: Grüne
    option: mehr-steuermittel
    beleg: Diesen Trend wollen wir umkehren und damit die Versicherten und die Arbeitgeber von versicherungsfremden Leistungen entlasten. Dazu gehört, dass wir die Finanzierung der Rentenbeiträge von pflegenden Angehörigen oder die Beiträge für Empfänger*innen von Bürgergeld angemessener über den Staat finanzieren.
    seite: "93"
    quelle: wahlprogramm-2025-gruene
  - partei: SPD
    option: mehr-steuermittel
    beleg: Versicherungsfremde Aufgaben im Gesundheitswesen wollen wir zukünftig ausreichend aus Steuermitteln finanzieren. So bleiben die Beiträge für Versicherte sowie Arbeitgeberinnen und Arbeitgeber stabil, und die Ungleichheiten zwischen verschiedenen Versichertengruppen werden beendet.
    seite: "29"
    quelle: wahlprogramm-2025-spd

