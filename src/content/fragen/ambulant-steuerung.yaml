  aussagen:
    - typ: position
      wer: Kassenärztliche Bundesvereinigung (Andreas Gassen)
      text: Schon heute gingen rund 70 Prozent der Versicherten zuerst zur Hausarztpraxis.
      quellen: [kbv-primaerversorgung-2026]

laender:
  beispiele:
    - land: Dänemark
      ansatz: Hausarzt als verbindlicher Lotse, mit Wahlmöglichkeit gegen Zuzahlung
      text: Fast alle Däninnen und Dänen sind in der „Gruppe 1“. Sie sind bei einer Hausarztpraxis eingeschrieben, die sie zu den meisten Fachärzten, zur Physiotherapie und ins Krankenhaus überweist. Augen- und HNO-Ärzte sind ohne Überweisung erreichbar. Wer in „Gruppe 2“ wechselt, darf frei zu Fachärzten gehen, zahlt aber zu. Das wählt nur etwa 1 Prozent.
      vergleichbarkeit: mittel
      vergleichbarkeit_text: Dänemark hat ein steuerfinanziertes, regional organisiertes System mit langer Hausarzt-Tradition. Deutschland hat dagegen viele niedergelassene Fachärzte und eine Kultur des Direktzugangs. Die Umstellung wäre hier größer.
      quellen: [observatory-daenemark-2024]

verknuepft:
  - frage: ambulant-land
    grund: Ob eine Hausarztpflicht funktioniert, hängt davon ab, ob es überall genug Hausarztpraxen gibt.
  - frage: digitalisierung-telemedizin
    grund: Die geplante Steuerung soll teils über telefonische und digitale Ersteinschätzung laufen.
  - frage: fachkraefte-aufgabenteilung
    grund: Wenn Pflegekräfte mehr übernehmen, können Hausarztpraxen mehr Patientinnen und Patienten lotsen.

