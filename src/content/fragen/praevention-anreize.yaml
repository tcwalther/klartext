verknuepft:
  - frage: praevention-ungesunde-produkte
    grund: Auch dort geht es darum, ob Prävention beim Einzelnen oder bei den Verhältnissen ansetzen soll.
  - frage: finanzierung-versicherungssystem
    grund: Ob Beiträge vom Verhalten abhängen dürfen, berührt die Grundfrage, wie die Versicherung organisiert ist.
  - frage: digitalisierung-gesundheitsdaten
    grund: Verhaltensbezogene Tarife setzen voraus, dass Gesundheitsdaten genutzt werden dürfen.

