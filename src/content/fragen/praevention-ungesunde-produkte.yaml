parteien:
  - partei: AfD
    option: freiwillig
    beleg: Die AfD unterstützt das Leitbild des mündigen Bürgers. Er soll in seinem Konsumverhalten nicht staatlich bevormundet werden. Deshalb lehnen wir jede Form der gesonderten Lebensmittelbesteuerung ab, wie z. B. eine Fleisch- oder Zuckersteuer.
    seite: "74"
    quelle: wahlprogramm-2025-afd
  - partei: CDU/CSU
    option: freiwillig
    beleg: Bei der Ernährung auf mündige Bürger setzen. Wir setzen auf Ernährungsbildung und gute Information, aber nicht auf unwirksame Werbeverbote oder Lenkungssteuern.
    seite: "35"
    quelle: wahlprogramm-2025-cdu-csu
  - partei: Grüne
    option: werbung
    beleg: Außerdem werden wir Kinder vor Werbung für ungesunde Lebensmittel schützen und Geschmacksaromen für E-Zigaretten, die besonders junge Menschen zum Konsum verleiten, vom Markt verbannen.
    seite: "60"
    quelle: wahlprogramm-2025-gruene
  - partei: Die Linke
    option: werbung
    beleg: Wir fordern ein Werbe- und Marketingverbot für ungesunde Lebensmittel, besonders für Kinder und Jugendliche. Der Zuckergehalt insbesondere in Softdrinks muss geregelt und begrenzt werden, ohne die Verbraucher*innen zu belasten.
    seite: "42"
    quelle: wahlprogramm-2025-die-linke
  - partei: SPD
    option: abgaben
    beleg: Um den Zucker-, Salz- und Fettgehalt in unseren Lebensmitteln zu reduzieren, legen wir verbindliche Ziele fest und setzen ökonomische Anreize für weniger gesundheitsschädliche Produkte – über eine Herstellerabgabe für zuckerhaltige Getränke.
    seite: "28"
    quelle: wahlprogramm-2025-spd
