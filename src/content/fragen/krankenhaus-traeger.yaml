bereich: krankenhaeuser
reihenfolge: 3
status: entwurf
stand: "2026-11-25"
titel: Wem sollen Krankenhäuser gehören?
frage: "Soll es beim Nebeneinander öffentlicher, gemeinnütziger und privater Krankenhäuser bleiben, sollen öffentliche Träger gestärkt und Gewinnausschüttungen begrenzt werden, oder soll es mehr Wettbewerb zwischen Trägern geben?"

optionen:
  - id: traegervielfalt
    titel: Trägervielfalt wie bisher
    kurz: "Öffentliche, gemeinnützige (etwa kirchliche) und private Krankenhäuser bestehen nebeneinander und arbeiten unter denselben Regeln für Planung, Bezahlung und Qualität."
    pro:
      - typ: fakt
        text: "Das Krankenhausfinanzierungsgesetz schreibt vor, dass die **Vielfalt der Krankenhausträger** zu beachten ist; die wirtschaftliche Sicherung gemeinnütziger und privater Häuser ist ausdrücklich zu gewährleisten."
        quellen: [khg-1]
      - typ: position
        wer: Bundesverband Deutscher Privatkliniken (BDPK)
        text: "Gute Versorgung sei auf leistungsfähige Kliniken „aller Größenordnungen und Trägerschaften“ angewiesen. Der BDPK tritt für ein System ein, das von „Wettbewerb, Trägerpluralität und Fairness“ getragen wird."
        quellen: [bdpk-2021]
      - typ: wertung
        text: "Unterschiedliche Träger bringen unterschiedliche Stärken mit: kommunale Verankerung, kirchliche Werte, Kapital und Managementerfahrung großer Klinikgruppen. Patientinnen und Patienten können oft zwischen Häusern wählen."
    contra:
      - typ: wertung
        text: "Gleiche Regeln bedeuten keine gleiche Ausgangslage. Kommunen gleichen Verluste ihrer Häuser teils aus Steuergeld aus, private Träger können Gewinne an Eigentümer ausschütten. Beide Seiten sehen darin einen Nachteil für sich."
      - typ: fakt
        text: "Der Bundesverband Deutscher Privatkliniken klagte gegen den Landkreis Calw, weil dieser die Verluste seiner Kreiskliniken ausglich. Der Bundesgerichtshof entschied 2016, dass solche Zahlungen unter bestimmten Voraussetzungen zulässig sind, etwa wenn der Kreis das Haus vorher förmlich mit der Versorgung betraut hat."
        quellen: [bgh-2016-calw]
      - typ: wertung
        text: "Der bisherige Zustand hat das Investitionsproblem nicht gelöst. Träger mit wenig eigenem Kapital können notwendige Erneuerungen oft nicht finanzieren."
    gewinnt: [Wahlfreiheit der Patienten, bestehende Träger aller Art, Planbarkeit für Beschäftigte]
    kostet: [klare Verantwortung bei Verlusten, kommunale Haushalte (Defizitausgleich)]

  - id: gemeinwohl-staerken
    titel: Öffentliche Träger stärken, Gewinne begrenzen
    kurz: "Krankenhäuser sollen stärker in öffentlicher oder gemeinnütziger Hand sein; Gewinne aus Kassengeldern sollen im System bleiben, statt an Eigentümer zu fließen."
    pro:
      - typ: position
        wer: Bündnis Klinikrettung
        text: "„Verbieten Sie Gewinne im Krankenhauswesen! Krankenhäuser müssen gemeinnützig sein.“ Der wirtschaftliche Druck gehe zulasten von Personal und Versorgungsqualität."
        quellen: [klinikrettung-petition-2026]
      - typ: schaetzung
        text: "Eine Übersichtsarbeit aus Oxford zu Studien aus acht reichen Ländern, darunter Deutschland, kam zu dem Ergebnis, dass mehr Privatisierung meist mit schlechterer Versorgungsqualität einherging. Häuser, die von öffentlicher in private Hand wechselten, erzielten höhere Gewinne, vor allem durch weniger Personal."
        quellen: [goodair-reeves-2024]
        unsicherheit: "Die Autoren betonen selbst, dass es nur wenige Studien gibt und viele Lücken bestehen. Die Ergebnisse stammen aus sehr unterschiedlichen Gesundheitssystemen."
      - typ: wertung
        text: "Krankenhäuser werden aus Pflichtbeiträgen und Steuern bezahlt. Deshalb sollten Überschüsse in die Versorgung zurückfließen, und gewählte Vertreter sollten über Standorte mitentscheiden."
    contra:
      - typ: position
        wer: Bundesverband Deutscher Privatkliniken (BDPK)
        text: "Eine Rekommunalisierung lehnt der BDPK ab. Private Häuser seien in der Mehrzahl ehemalige kommunale Krankenhäuser, die durch private Investoren „vor dem Aus gerettet“ worden seien; bei der Qualität lägen sie mindestens gleichauf mit anderen Trägern."
        quellen: [bdpk-2021]
      - typ: schaetzung
        text: "Eine RWI-Studie mit Daten von 2005 bis 2013 fand bei Wundinfektionen, Krankenhaussterblichkeit und Druckgeschwüren keine signifikanten Unterschiede zwischen den Trägern. 2013 galten 7 % der privaten, aber 62 % der kommunalen Häuser als nicht investitionsfähig."
        quellen: [rwi-2015]
        unsicherheit: "Die Studie wurde vom Bundesverband Deutscher Privatkliniken in Auftrag gegeben. Unterschiede bei Patientengruppen und Leistungsspektrum lassen sich nur teilweise herausrechnen."
      - typ: wertung
        text: "Kauf, Verlustausgleich und Investitionen müssten aus öffentlichen Haushalten kommen, die ohnehin knapp sind. Ein Gewinnverbot kann privates Kapital für Neubauten und Technik fernhalten."
    gewinnt: [demokratische Kontrolle über Standorte, Beschäftigte (weniger Renditedruck), Beitragszahler (keine Gewinnausschüttung)]
    kostet: [öffentliche Haushalte, privates Kapital für Investitionen, bestehende private Träger]

  - id: mehr-wettbewerb
    titel: Mehr Wettbewerb zwischen Trägern
    kurz: "Wer ein Haus betreibt, ist zweitrangig; es zählen Qualität und Wirtschaftlichkeit. Private Träger sollen leichter übernehmen können, Verlustausgleich aus Steuergeld soll die Ausnahme bleiben."
    pro:
      - typ: schaetzung
        text: "Nach einer Studie zu deutschen Krankenhäusern stieg die Effizienz nach dem Wechsel von öffentlicher zu privater, gewinnorientierter Trägerschaft um 2,9 bis 4,9 %, und der Effekt hielt an. Die Autoren sehen darin einen Weg, knappe Mittel besser zu nutzen."
        quellen: [tiemann-schreyoegg-2012]
        unsicherheit: "Effizienz bedeutet hier das Verhältnis von Personal und Mitteln zu Leistungen, nicht die Behandlungsqualität. Die Daten stammen überwiegend aus der Zeit um die Einführung der Fallpauschalen."
      - typ: position
        wer: Bundesverband Deutscher Privatkliniken (BDPK)
        text: "Nahezu alle privaten Kliniken arbeiteten heute im wirtschaftlichen Plus. Ohne die Privaten gäbe es keine Versorgungssicherheit, weil sie viele Häuser übernommen hätten, die sonst geschlossen worden wären."
        quellen: [bdpk-2021]
      - typ: wertung
        text: "Wo die Länder Investitionen nicht ausreichend bezahlen, können private Träger mit eigenem Kapital modernisieren. Wettbewerb zwingt alle Häuser, Abläufe zu verbessern."
    contra:
      - typ: schaetzung
        text: "Nach derselben Studie kamen die Effizienzgewinne vor allem aus einem deutlichen Personalabbau in fast allen Berufsgruppen. Ausgenommen waren Ärztinnen und Ärzte."
        quellen: [tiemann-schreyoegg-2012]
        unsicherheit: "Ob weniger Personal je Fall die Qualität senkt, misst die Studie nicht."
      - typ: wertung
        text: "Gewinnorientierte Träger haben einen Anreiz, sich auf lohnende Behandlungen zu konzentrieren und sich aus wenig rentablen Regionen oder Abteilungen zurückzuziehen. Die Grund- und Notfallversorgung bliebe dann bei der öffentlichen Hand."
      - typ: position
        wer: Bündnis Klinikrettung
        text: "Die defizitäre wohnortnahe Grund- und Notfallversorgung verbleibe bei der öffentlichen Hand, während lukrative private Fachkliniken entstünden."
        quellen: [klinikrettung-petition-2026]
    gewinnt: [Effizienz, Kapital für Investitionen, Steuerzahler (weniger Verlustausgleich)]
    kostet: [Personalausstattung je Fall, wenig rentable Standorte und Abteilungen, öffentlicher Einfluss auf Standorte]

erklaerung:
  - typ: fakt
    text: "Krankenhäuser gehören drei Arten von Trägern: öffentlichen (etwa Ländern, Kreisen und Städten), freigemeinnützigen (etwa Kirchen und Wohlfahrtsverbänden) und privaten Unternehmen."
    quellen: [destatis-grunddaten-2021]
    genau: "Öffentlich sind auch Häuser von Sozialversicherungen. Freigemeinnützig sind Häuser der kirchlichen und freien Wohlfahrtspflege, von Kirchengemeinden, Stiftungen und Vereinen. Private Träger sind gewerbliche Unternehmen."
  - typ: fakt
    text: "Seit 1991 wurden viele öffentliche Häuser verkauft oder geschlossen. Der Anteil privater Häuser hat sich in dieser Zeit fast verdreifacht."
    quellen: [destatis-grunddaten-2021, destatis-pm-2026-376]
    genau: "1991 waren 358 von 2.411 Krankenhäusern privat (rund 15 %), 2025 waren es 729 von 1.807 (rund 40 %). Die Zahl öffentlicher Häuser sank im selben Zeitraum von 1.110 auf 529."
  - typ: fakt
    text: "Private Häuser sind im Schnitt aber kleiner. Gemessen an den Betten stellen öffentliche Häuser weiterhin fast die Hälfte der Versorgung."
    quellen: [destatis-pm-2026-376]
    genau: "2025: 529 öffentliche, 549 freigemeinnützige und 729 private Krankenhäuser. Anteil an den Betten: öffentlich 47,4 %, freigemeinnützig 31,6 %, privat 21,0 %."
  - typ: schaetzung
    text: "Die Länder müssen die Investitionen aller Krankenhäuser bezahlen, decken aber seit Jahren nur etwa die Hälfte des Bedarfs. Diese Lücke trifft jeden Träger. Wer sie aus eigenem Geld schließen kann, ist im Vorteil."
    quellen: [khg-9, dkg-pm-2026-01-09, gemeinsame-pm-invest-2024]
    genau: "Für 2023 bezifferte die Deutsche Krankenhausgesellschaft den Investitionsbedarf auf 6,52 Mrd. €, die Fördermittel der Länder auf 3,89 Mrd. € (2024: rund 4,24 Mrd. €). GKV-Spitzenverband, PKV-Verband und Krankenhausgesellschaft nennen gemeinsam einen Bedarf von rund 6,5 Mrd. € pro Jahr."
    unsicherheit: Der „Bedarf“ ist eine Berechnung der Krankenhausgesellschaft, also eines Interessenverbands. Kassen- und PKV-Verband tragen die Größenordnung mit; eine amtliche Bedarfsrechnung gibt es nicht.
  - typ: fakt
    text: "Hier unterscheiden sich die Träger: Bei öffentlichen Häusern kann die Kommune Verluste aus Steuermitteln ausgleichen. Private Träger bringen eigenes Kapital mit und erwarten dafür eine Rendite. Die Investitionsförderung der Länder können dagegen alle Träger gleichermaßen beantragen."
    quellen: [khg-1, khg-9, bgh-2016-calw]
    genau: "Der Verlustausgleich ist zulässig, wenn die Kommune ihr Haus vorher förmlich mit der Versorgung betraut hat (Bundesgerichtshof 2016, Fall Landkreis Calw). Das Krankenhausfinanzierungsgesetz verlangt, die Vielfalt der Träger zu beachten."
  - typ: wertung
    text: "Ob die Trägerart die Qualität der Behandlung beeinflusst, ist wissenschaftlich nicht eindeutig geklärt, auch weil Häuser verschiedener Träger unterschiedliche Patienten und Leistungen haben. Im Streit geht es deshalb auch um Grundüberzeugungen: wie viel Markt die Gesundheitsversorgung verträgt und wer Gewinne und Verluste tragen soll."

zielkonflikte:
  - typ: wertung
    text: "**Kapital gegen Kontrolle.** Private Träger bringen Geld für Investitionen mit, erwarten aber eine Rendite. Öffentliche Träger können politisch gesteuert werden, sind aber auf knappe Haushalte angewiesen."
  - typ: wertung
    text: "**Effizienz gegen Personalausstattung.** Was als Effizienzgewinn gemessen wird, ist oft weniger Personal je Fall. Ob das Verschwendung abbaut oder die Versorgung verschlechtert, hängt vom Einzelfall ab."
  - typ: wertung
    text: "**Gleiche Regeln, ungleiche Rollen.** Offen ist, ob alle Träger gleich behandelt werden sollen oder ob Häuser, die unrentable Notfall- und Grundversorgung übernehmen, einen Ausgleich brauchen, den andere nicht bekommen."
  - typ: fakt
    text: "**Das Investitionsproblem betrifft alle.** Die Länder sind gesetzlich verpflichtet, die notwendigen Investitionskosten zu decken. Nach Angaben der Deutschen Krankenhausgesellschaft blieb 2023 aber eine Lücke von über 2,6 Milliarden Euro."
    quellen: [khg-9, dkg-pm-2026-01-09]

