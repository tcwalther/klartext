      quellen: [destatis-grunddaten-2021, destatis-pm-2026-376]
    - typ: wertung
      text: "Zur Frage, ob private, öffentliche oder gemeinnützige Häuser besser behandeln, gibt es nur wenige belastbare Studien. Sie kommen zu unterschiedlichen Ergebnissen, auch weil Häuser verschiedener Träger unterschiedliche Patienten und Leistungen haben. Ein klarer Befund zugunsten einer Trägerart lässt sich daraus nicht ableiten."
    - typ: position
      wer: GKV-Spitzenverband, PKV-Verband und Deutsche Krankenhausgesellschaft (gemeinsam)
      text: "Die Länder deckten seit Jahren nur etwa die Hälfte des Investitionsbedarfs von rund 6,5 Milliarden Euro pro Jahr. Anfang der 1970er-Jahre hätten die Investitionsmittel noch 25 % der GKV-Ausgaben entsprochen, heute seien es deutlich unter 4 %."
      quellen: [gemeinsame-pm-invest-2024]

geschichte:
  ereignisse:
    - jahr: "1991–2021"
      titel: Welle von Privatisierungen
      text: "Die Zahl privater Krankenhäuser verdoppelt sich von 358 auf 733, die der öffentlichen sinkt von 1.110 auf 547."
      quellen: [destatis-grunddaten-2021]
    - jahr: "2004"
      titel: Volksentscheid in Hamburg
      text: "Beim Volksentscheid „Gesundheit ist keine Ware“ stimmt eine Mehrheit gegen den Verkauf der städtischen Krankenhäuser. Die Bürgerschaft beschließt den Verkauf im Dezember 2004 trotzdem; das Hamburgische Verfassungsgericht hatte entschieden, dass Senat und Bürgerschaft an das Ergebnis nicht gebunden sind."
      quellen: [hamburg-volksabstimmungen, abgeordnetenwatch-lbk-2004]
    - jahr: "2006"
      titel: Erste private Uniklinik
      text: "Das Land Hessen verkauft 95 % der fusionierten Universitätskliniken Gießen und Marburg für 112 Millionen Euro an die Rhön-Klinikum AG. Es ist die erste Privatisierung einer Universitätsklinik in Deutschland."
      quellen: [iww-ukgm-2006]
    - jahr: "2016"
      titel: BGH-Urteil zum Verlustausgleich
      text: "Der Bundesgerichtshof entscheidet im Streit zwischen dem Privatklinikverband und dem Landkreis Calw: Kommunen dürfen Verluste ihrer Kliniken ausgleichen, wenn sie diese vorher förmlich mit der Versorgung betraut haben."
      quellen: [bgh-2016-calw]
    - jahr: "2026"
      titel: Forderung nach Gewinnverbot
      text: "Das Bündnis Klinikrettung startet eine Unterschriftensammlung mit der Forderung, Gewinne im Krankenhauswesen zu verbieten."
      quellen: [klinikrettung-petition-2026]
  bilanz:
    - typ: fakt
      text: "Seit 1991 ist der Anteil privater Häuser stark gestiegen; heute bilden private Träger die größte Gruppe, aber keine Mehrheit der Häuser. Gemessen an den Betten bleiben öffentliche Häuser aber die größte Gruppe."
      quellen: [destatis-grunddaten-2021, destatis-pm-2026-376]
    - typ: wertung
      text: "Die Erfahrungen mit Privatisierungen werden sehr unterschiedlich bewertet. Befürworter verweisen auf gerettete Standorte und Investitionen, Kritiker auf Personalabbau und Renditedruck. Eine eindeutige wissenschaftliche Bilanz gibt es nicht."

laender:
  beispiele:
    - land: Niederlande
      ansatz: "Nur gemeinnützige Krankenhäuser"
      text: "Krankenhäuser sind dort meist Stiftungen und dürfen nicht mit Gewinnabsicht betrieben werden. Ob Krankenhäuser Gewinne machen und Anteilseigner haben dürfen, ist politisch umstritten; ein Gesetzentwurf, der das unter Bedingungen erlauben sollte, wurde 2014 zurückgezogen."
      vergleichbarkeit: mittel
      vergleichbarkeit_text: "Die Niederlande finanzieren Krankenhäuser ähnlich wie Deutschland über Versicherungen, haben aber keinen gewinnorientierten Krankenhausmarkt. Ein Gewinnverbot in Deutschland würde dagegen bestehende private Eigentümer betreffen."
      quellen: [observatory-nl-2016]
    - land: Frankreich
      ansatz: "Gemischte Trägerschaft wie in Deutschland"
      text: "Ende 2023 gab es 1.330 öffentliche Krankenhäuser, 978 private Kliniken und 657 private gemeinnützige Einrichtungen. Die öffentlichen Häuser machten 2023 zusammen 2,4 Milliarden Euro Defizit, die gewinnorientierten Kliniken einen Überschuss von 362 Millionen Euro."
      vergleichbarkeit: hoch
      vergleichbarkeit_text: "Frankreich hat wie Deutschland ein Versicherungssystem, Fallpauschalen und ein Nebeneinander aller drei Trägerarten. Die Zahlen sind deshalb gut vergleichbar, auch wenn sich Planung und Finanzierung im Detail unterscheiden."
      quellen: [drees-2025]
    - land: Dänemark
      ansatz: "Krankenhäuser in öffentlicher Hand der Regionen"
      text: "Seit 2007 sind fünf Regionen politisch und organisatorisch für die Krankenhäuser zuständig; sie legen auch deren Budgets fest. Auf dieser Grundlage hat Dänemark seine Krankenhauslandschaft zentral umgebaut und bis 2021 18 Häuser geschlossen."
      vergleichbarkeit: gering
      vergleichbarkeit_text: "Ein System, in dem die Regionen ihre Krankenhäuser selbst führen, unterscheidet sich grundlegend vom deutschen. Es zeigt eher, was einheitliche Zuständigkeit für die Planung ermöglicht, als wie man dorthin käme."
      quellen: [dk-super-hospital-2021, observatory-dk-2024]
  fazit:
    - typ: wertung
      text: "Die Spannbreite in Europa ist groß: von Regionen, die ihre Krankenhäuser selbst führen (Dänemark), über ausschließlich gemeinnützige Häuser (Niederlande) bis zu gemischten Systemen wie in Frankreich und Deutschland. Ein Ländervergleich allein zeigt nicht, welches Modell besser versorgt, weil sich die Systeme auch in vielem anderen unterscheiden."
    - typ: wertung
      text: "Auch in Frankreich schreiben öffentliche Häuser insgesamt Verluste und gewinnorientierte Kliniken Gewinne. Ob das an Effizienz liegt oder an unterschiedlichen Aufgaben und Patienten, zeigen diese Zahlen allein nicht."

verknuepft:
  - frage: krankenhaus-standorte
    grund: "Ob ein kleines Haus erhalten bleibt, hängt auch davon ab, ob sein Träger Verluste tragen kann oder will."
  - frage: krankenhaus-verguetung
    grund: "Das Bezahlsystem entscheidet, welche Leistungen Gewinn bringen, und damit auch, für welche Träger sich ein Haus lohnt."
  - frage: fachkraefte-pflege
    grund: "Studien zu Privatisierungen drehen sich oft um die Personalausstattung."
  - frage: finanzierung-kostenanstieg
    grund: "Gewinne, Verlustausgleich und Investitionen betreffen Beitrags- und Steuerzahler."

parteien:
  - partei: Grüne
    option: gemeinwohl-staerken
    beleg: Wir wollen daher das Prinzip der Gemeinwohlorientierung stärker etablieren und öffentliche und gemeinnützige Träger fördern, denn eine Profitorientierung birgt Risiken für die Versorgungsqualität und -sicherheit.
    seite: "93"
    quelle: wahlprogramm-2025-gruene
  - partei: Die Linke
    option: gemeinwohl-staerken
    beleg: Private Konzerne sollen zwar weiterhin Krankenhäuser betreiben dürfen, aber ohne Gewinnmöglichkeit werden sie daran kein Interesse haben. Wir wollen Krankenhäuser, die von privaten Betreibern aufgegeben werden, in die öffentliche Hand überführen.
    seite: "18"
    quelle: wahlprogramm-2025-die-linke

