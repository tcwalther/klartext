bereich: finanzierung
reihenfolge: 3
status: entwurf
stand: "2026-11-25"
titel: Wie viele Krankenkassen braucht es – und wie viel Wettbewerb zwischen ihnen?
frage: Sollen die gesetzlichen Krankenkassen stärker miteinander konkurrieren, so vielfältig bleiben wie heute, deutlich weniger werden oder zu einer einzigen Kasse zusammengelegt werden?

optionen:
  - id: mehr-wettbewerb
    titel: Mehr Wettbewerb wagen
    kurz: Kassen bekommen mehr Freiheit, eigene Verträge mit Ärzten und Kliniken zu schließen, Tarife zu gestalten und Leistungen anzubieten.
    pro:
      - typ: position
        wer: Monopolkommission
        text: "Ein vom Versicherten wahrnehmbarer Wettbewerb bestehe bisher vor allem über Service und Zusatzleistungen. Auf der Einkaufsseite blieben dagegen „einheitliche und wettbewerbslose Vergütungs- und Versorgungsstrukturen“ erhalten. Die Kassen sollten mehr Freiheiten bekommen, um Qualität individuell umzusetzen."
        quellen: [monopolkommission-sg75-2017]
      - typ: wertung
        text: "Heute verhandeln die Kassen die meisten Preise und Honorare gemeinsam und einheitlich. Ob eine Praxis oder Klinik besonders gut oder besonders teuer arbeitet, ändert deshalb kaum etwas an ihrem Geld. Dürften Kassen gezielt mit besonders guten Anbietern Verträge schließen, könnte Wettbewerb um Qualität entstehen – nicht nur um den Preis."
      - typ: position
        wer: Techniker Krankenkasse
        text: "„Unser Gesundheitssystem benötigt vor allem mehr Wettbewerb – gesteuert durch die soziale Selbstverwaltung.“ Mehr Möglichkeiten brauche es beim Wettbewerb zwischen den Kassen und um gute Verträge mit Leistungserbringern und Industrie."
        quellen: [tk-mehr-wettbewerb-2026]
      - typ: position
        wer: GKV-Spitzenverband
        text: "Für eine nachhaltige Reform der Finanzierung brauche es „eine Rückbesinnung auf die Gestaltungsprinzipien der Selbstverwaltung und des Wettbewerbs“. Wettbewerb setze Anreize für mehr Wirtschaftlichkeit bei Kassen und Anbietern."
        quellen: [gkv-sv-stellungnahme-fk-2025]
    contra:
      - typ: wertung
        text: "Je mehr Kassen bei Leistungen und Tarifen selbst entscheiden dürfen, desto größer ist der Anreiz, Angebote so zu gestalten, dass vor allem Gesunde und Gutverdienende kommen. Der Finanzausgleich zwischen den Kassen müsste dann immer genauer werden – und bleibt doch unvollkommen."
      - typ: fakt
        text: "Selektivverträge sparen nicht automatisch Geld. Die FinanzKommission Gesundheit stellte gerade dort hohe Ausgabensteigerungen fest: Die sonstigen ambulanten Ausgaben, zu denen die hausarztzentrierte Versorgung gehört, wuchsen in zehn Jahren auf das Zweieinhalbfache."
        genau: "Sonstige Ausgaben (u. a. Hochschulambulanzen, hausarztzentrierte Versorgung, ambulante spezialfachärztliche Versorgung): +153 % von 2015 bis 2025."
        quellen: [finanzkommission-bericht-voll-2026]
      - typ: wertung
        text: "Wenn Leistungen und Arztnetze von der Kasse abhängen, hängt auch die Versorgung davon ab, bei welcher Kasse man ist. Für Versicherte wird es schwerer, Angebote zu vergleichen – und wer krank ist, kann nicht beliebig wechseln."
      - typ: position
        wer: Verbraucherzentrale Bundesverband (vzbv)
        text: "Bislang fehle ein unabhängiges, öffentlich zugängliches Vergleichsportal für Krankenkassen. Ohne Transparenz können Versicherte Unterschiede kaum erkennen."
        quellen: [vzbv-vergleichsportal-2025]
    gewinnt: [Kassen mit eigenen Versorgungsideen, Anbieter mit guter Qualität, Versicherte, die Angebote vergleichen]
    kostet: [Einheitlichkeit des Leistungsanspruchs, Übersichtlichkeit, möglicherweise chronisch Kranke]

  - id: vielfalt-wie-bisher
    titel: Vielfalt wie bisher
    kurz: Viele Kassen mit weitgehend gleichem Leistungskatalog konkurrieren vor allem über Zusatzbeitrag und Service; die Zahl ergibt sich aus freiwilligen Fusionen.
    pro:
      - typ: fakt
        text: "Größe allein macht Kassen nicht sparsamer. Die FinanzKommission Gesundheit fand keinen eindeutigen Zusammenhang zwischen der Größe einer Kasse und ihren Verwaltungsausgaben je Versicherten. Den stärksten Anreiz zum Sparen setze der Preiswettbewerb über den Zusatzbeitrag."
        quellen: [finanzkommission-bericht-voll-2026]
      - typ: fakt
        text: "Der Konzentrationsprozess läuft ohnehin: Die 20 größten Kassen versichern schon heute etwa fünf von sechs Mitgliedern. Die vielen kleinen Kassen sind vor allem Betriebskrankenkassen, die oft nur in einer Region oder für einen Betrieb offen sind."
        genau: "20 größte Kassen: 84 % der GKV-Mitglieder. Marktanteil der fünf größten Kassen je Bundesland: 68–85 % (1. Juli 2025)."
        quellen: [finanzkommission-bericht-voll-2026]
      - typ: position
        wer: AOK-Bundesverband
        text: Die Debatte um eine politisch verordnete Reduzierung der Kassenzahl sei eine „Scheindebatte“, die kaum Einsparungen bringe. „Wir sollten auf den Wettbewerb setzen.“
        quellen: [aok-reimann-2026]
      - typ: wertung
        text: "Wer mit Service oder Beitrag unzufrieden ist, kann wechseln. Diese Wahl übt Druck auf jede einzelne Kasse aus, ohne dass der Leistungsanspruch von der Kasse abhängt."
    contra:
      - typ: fakt
        text: "Jede Kasse braucht eigenen Vorstand, eigene Verwaltungsräte, eigene IT und eigenes Marketing. Bisher durften Kassen bis zu rund 6 € je Mitglied und Jahr für Werbung ausgeben – Geld, das Mitglieder nur zwischen den Kassen verschiebt. Das Spargesetz von 2026 halbiert diese Grenze."
        quellen: [bt-drs-21-6130]
      - typ: position
        wer: Hausärztinnen- und Hausärzteverband
        text: Die Kassen müssten den Rotstift bei sich selbst ansetzen und ihre Verwaltungskosten mittelfristig „dringend halbieren“.
        quellen: [aerzteblatt-kassenzahl-2026]
      - typ: wertung
        text: "Weil fast alle Leistungen gesetzlich vorgegeben sind, unterscheiden sich die Kassen für die meisten Versicherten nur im Beitrag. Ein Wettbewerb, der sich fast nur um den Preis dreht, verbessert die Versorgung kaum."
    gewinnt: [Wahlfreiheit der Versicherten, Selbstverwaltung der Kassen, Planbarkeit]
    kostet: [Verwaltungskosten mehrfacher Strukturen, Werbeausgaben]

  - id: weniger-kassen
    titel: Weniger Kassen
    kurz: Die Politik fördert Fusionen, etwa über eine Mindestgröße, und begrenzt die Verwaltungskosten stärker.
    pro:
      - typ: fakt
        text: "Für bestimmte Verwaltungsabläufe gibt es Größenvorteile. Selbst der GKV-Spitzenverband räumt ein, dass größere Fallzahlen „gewisse Größen- und damit Kostenvorteile“ bringen können."
        quellen: [gkv-sv-fokus-verwaltung]
      - typ: position
        wer: Bundesvereinigung der Deutschen Arbeitgeberverbände (BDA)
        text: "Die Verwaltungsausgaben seien in ihrer absoluten Höhe „erheblich“, und es bestünden „durchaus Effizienzpotenziale“. Die FinanzKommission solle weitere Vorschläge zur Begrenzung vorlegen."
        quellen: [bda-bstabg-2026]
      - typ: wertung
        text: "Kleine Kassen sind anfälliger: Wenige teure Behandlungsfälle können ihre Finanzen stärker durcheinanderbringen. Größere Kassen können solche Schwankungen besser abfedern und haben mehr Gewicht in Verhandlungen."
      - typ: wertung
        text: "Weniger Kassen bedeuten weniger parallele Vorstände, Rechenzentren und Werbebudgets. Der Wettbewerb über den Zusatzbeitrag bleibt erhalten, solange es mehrere Kassen gibt."
    contra:
      - typ: position
        wer: GKV-Spitzenverband
        text: "Bei Fusionen bleibe die Zahl der Versicherten und damit der Betreuungsbedarf gleich. Die Erfahrung zeige, dass sich die Verwaltungskosten dadurch nur in begrenztem Umfang senken ließen."
        quellen: [gkv-sv-fokus-verwaltung]
      - typ: fakt
        text: "Verwaltung ist ein kleiner Teil der Ausgaben: knapp 4 von 100 Euro. Selbst eine deutliche Senkung bringt wenig im Vergleich zur Lücke, die durch steigende Ausgaben für Behandlungen entsteht."
        genau: "Netto-Verwaltungskosten 2024: 12,63 Mrd. € = 3,86 % der Gesamtausgaben. Zwischen 2014 und 2024 stiegen die Verwaltungskosten um 26 %, die Leistungsausgaben um 61 %."
        quellen: [gkv-sv-fokus-verwaltung]
      - typ: position
        wer: Techniker Krankenkasse
        text: "Politisch initiierte Fusionen seien problematisch und teuer. „Es ist an den GKV-Mitgliedern zu entscheiden, wie viele Krankenkassen Deutschland braucht.“"
        quellen: [tk-mehr-wettbewerb-2026]
      - typ: wertung
        text: "Fusionen kosten zunächst Geld: Systeme müssen zusammengelegt, Personal umgesetzt, Verträge angeglichen werden. Die Einsparungen kommen – wenn überhaupt – erst Jahre später."
    gewinnt: [Beitragszahlende, falls Verwaltung sinkt, Verhandlungsmacht der Kassen]
    kostet: [Auswahl für Versicherte, kleine und betriebsnahe Kassen, Beschäftigte der Kassen]

  - id: einheitskasse
    titel: Eine Kasse für alle
    kurz: Alle gesetzlich Versicherten sind in einer einzigen Kasse, gegebenenfalls mit regionalen Untergliederungen; Wettbewerb zwischen Kassen gibt es nicht mehr.
    pro:
      - typ: position
        wer: Sozialverband VdK
        text: Die Beiträge sollten nicht Verwaltungsapparate in 93 Krankenkassen finanzieren. Ziel solle „eine gesetzliche Krankenkasse mit regionalen Untergliederungen“ sein. „Grundsätzlich sollte der Wettbewerb unter den gesetzlichen Krankenkassen abgeschafft werden.“
        quellen: [vdk-bstabg-2026]
      - typ: wertung
        text: "Mit nur einer Kasse gibt es keinen Anreiz mehr, um gesunde Versicherte zu werben. Der aufwendige Finanzausgleich zwischen den Kassen, Werbung und Wechselverwaltung würden überflüssig."
      - typ: wertung
        text: "Eine einzige Kasse verhandelt mit Ärzten, Kliniken und Herstellern aus einer Hand. Das stärkt ihre Verhandlungsmacht und sorgt dafür, dass überall dieselben Regeln gelten."
    contra:
      - typ: fakt
        text: "Das naheliegende Beispiel spricht bisher nicht für Einsparungen: Österreich hat 2020 neun Gebietskrankenkassen zur Österreichischen Gesundheitskasse zusammengelegt. Statt der angekündigten Einsparung von einer Milliarde Euro errechnete der Rechnungshof Mehrkosten."
        genau: "Rechnungshof Österreich: Mehraufwand von 214,95 Mio. € (2020–2023) gegenüber einem Szenario ohne Fusion; selbst bei vorsichtiger Rechnung 34,78 bis 134,10 Mio. €."
        quellen: [rechnungshof-at-2022]
      - typ: position
        wer: Techniker Krankenkasse
        text: Eine Einheitskasse käme „in die Behördenfalle“ – ohne Veränderungsdruck drohten mangelnde Digitalisierung, schlechte Prozesse und fehlende Kundenorientierung.
        quellen: [tk-mehr-wettbewerb-2026]
      - typ: position
        wer: Deutscher Gewerkschaftsbund (DGB)
        text: Die behaupteten Einsparungen seien „hypothetisch“; das Beispiel Österreich zeige, dass selbst die Zusammenlegung zu einer einzigen Kasse keine realen Kostenvorteile gebracht habe. Eine Zentralisierung würde vor allem die Selbstverwaltung schwächen.
        quellen: [dgb-bstabg-2026]
      - typ: wertung
        text: "Wer mit seiner Kasse unzufrieden ist, kann nicht mehr ausweichen. Fehler oder schlechter Service treffen dann alle gesetzlich Versicherten zugleich."
    gewinnt: [Einheitliche Regeln für alle, Verhandlungsmacht gegenüber Anbietern, Wegfall von Werbung und Risikoauswahl]
    kostet: [Wahlfreiheit, Wettbewerbsdruck auf die Kasse, Selbstverwaltung in heutiger Form]

erklaerung:
  - typ: fakt
    text: "Es gibt heute rund 90 gesetzliche Krankenkassen. Vor gut 50 Jahren waren es etwa zwanzigmal so viele – die meisten sind durch Fusionen verschwunden."
    genau: "1970: 1.815 Kassen. Oktober 2026: 93 Kassen (11 AOK, 68 Betriebskrankenkassen, 6 Innungskrankenkassen, 6 Ersatzkassen, je 1 Landwirtschaftliche Krankenkasse und Knappschaft)."
    quellen: [gkv-sv-kassen, bmg-km1-2026]
  - typ: fakt
    text: "Seit 1996 dürfen fast alle Versicherten ihre Kasse frei wählen. Vorher bestimmten vor allem Beruf und Arbeitgeber, wo man versichert war."
    quellen: [bpb-gegliedert-2017]
  - typ: fakt
    text: "Was eine Kasse zahlen muss, legen Gesetz und Gemeinsamer Bundesausschuss für alle gleich fest. Deshalb konkurrieren die Kassen vor allem über den Preis: Der teuerste Zusatzbeitrag ist etwa doppelt so hoch wie der günstigste."
    genau: "Spanne der Zusatzbeiträge Januar 2026: 2,18 % bis 4,39 % (92 Kassen ohne Landwirtschaftliche Krankenkasse); Durchschnitt 3,13 %."
    quellen: [vdek-basisdaten-2026, monopolkommission-sg75-2017]
  - typ: fakt
    text: "Damit Kassen nicht um Gesunde konkurrieren, bekommen sie aus dem Gesundheitsfonds mehr Geld für ältere und kranke Versicherte. Dieser **Risikostrukturausgleich** berücksichtigt seit 2009 Krankheiten und seit 2021 alle Krankheitsgruppen."
    quellen: [gkv-sv-gesundheitsfonds-rsa]
  - typ: fakt
    text: "Die Verwaltung der Kassen kostet knapp 4 von 100 Euro. Der Anteil sinkt seit Jahren, weil die Verwaltungskosten langsamer wachsen als die Ausgaben für Behandlungen."
    genau: "Netto-Verwaltungskosten 2024: 12,63 Mrd. € (3,86 % der Ausgaben), 169,54 € je Versicherten. 2014–2024: Verwaltung +26 %, Leistungsausgaben +61 %."
    quellen: [gkv-sv-fokus-verwaltung]

zusammenhaenge:
  erklaerung:
    - typ: fakt
      text: "Der Wettbewerb funktioniert über einen Umweg: Alle Kassen bekommen aus dem Gesundheitsfonds Geld je Versicherten, angepasst an Alter, Geschlecht, Krankheiten und Wohnort. Reicht das Geld nicht, muss die Kasse einen höheren Zusatzbeitrag nehmen – und riskiert, dass Mitglieder wechseln. Wer sparsam wirtschaftet, kann günstiger sein."
      quellen: [gkv-sv-gesundheitsfonds-rsa, finanzkommission-bericht-voll-2026]
    - typ: fakt
      text: "Auch die Verwaltung wird pauschal bezahlt: Kassen bekommen Zuweisungen für standardisierte Verwaltungsausgaben, die nur im Durchschnitt die tatsächlichen Kosten decken. Eine Kasse mit teurer Verwaltung muss den Rest über den Zusatzbeitrag hereinholen."
      quellen: [finanzkommission-bericht-voll-2026]
    - typ: fakt
      text: "Beim Einkauf von Versorgung ist der Spielraum klein. Satzungsleistungen erweitern den Leistungskatalog nur in geringem Maß, und die meisten Verträge mit Ärzten und Kliniken gelten für alle Kassen gemeinsam. Mehr Wettbewerb hieße vor allem, diesen Bereich zu öffnen."
      quellen: [monopolkommission-sg75-2017]
  kette:
    - titel: Was für alle Kassen gleich ist
      punkte:
        - label: Leistungskatalog
          text: Gesetz und Gemeinsamer Bundesausschuss legen fest, was bezahlt wird.
        - label: Gemeinsame Verträge
          text: Honorare für Praxen und Preise für Kliniken werden weitgehend einheitlich verhandelt.
        - label: Gesundheitsfonds
          text: Alle Beiträge fließen in einen Topf und werden nach Risiko verteilt.
    - titel: Wo Kassen sich unterscheiden dürfen
      punkte:
        - label: Zusatzbeitrag
          text: Der wichtigste Unterschied für Versicherte.
        - label: Service und Satzungsleistungen
          text: Erreichbarkeit, Apps, Extras wie zusätzliche Vorsorge oder Osteopathie.
        - label: Selektivverträge und Wahltarife
          text: Eigene Verträge mit Ärzten oder Netzen, Hausarzttarife, Selbstbehalt-Tarife.
    - titel: Welche Anreize entstehen
      punkte:
        - label: Sparsam wirtschaften
          text: Niedrige Kosten erlauben einen niedrigen Zusatzbeitrag.
        - label: Risikoauswahl
          text: Gesunde Versicherte sind attraktiver – der Finanzausgleich soll das neutralisieren.
        - label: Werbung
          text: Kassen werben um Mitglieder; das Geld verschiebt Versicherte, verbessert aber nicht die Versorgung.
    - titel: Stellschrauben
      punkte:
        - label: Mehr Vertragsfreiheit
          text: Kassen dürfen eigene Wege in der Versorgung gehen.
        - label: Finanzausgleich
          text: Je genauer er ist, desto weniger lohnt Risikoauswahl.
        - label: Mindestgröße und Fusionen
          text: Weniger, größere Kassen.
        - label: Eine Kasse
          text: Wettbewerb zwischen Kassen entfällt ganz.

zielkonflikte:
  - typ: wertung
    text: "**Wahlfreiheit gegen schlanke Verwaltung:** Viele Kassen bedeuten Auswahl, aber auch viele parallele Strukturen. Eine einzige Kasse spart Doppelstrukturen, nimmt aber jede Ausweichmöglichkeit."
  - typ: wertung
    text: "**Gestaltungsfreiheit gegen gleichen Anspruch:** Je mehr Kassen selbst entscheiden dürfen, desto mehr hängt die Versorgung davon ab, bei welcher Kasse man ist."
  - typ: wertung
    text: "**Wettbewerb gegen Solidarität:** Wettbewerb belohnt Effizienz, aber auch das Werben um gesunde Versicherte. Der Finanzausgleich soll beides trennen – vollständig gelingt das nie."
  - typ: wertung
    text: "**Verhandlungsmacht gegen Monopol:** Große Kassen oder eine Einheitskasse verhandeln stärker mit Anbietern. Ohne Konkurrenz fehlt aber der Druck, gut und sparsam zu arbeiten."

