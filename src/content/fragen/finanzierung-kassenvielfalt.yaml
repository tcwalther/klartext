geschichte:
  ereignisse:
    - jahr: "1883"
      titel: Gesetzliche Krankenversicherung entsteht
      text: Unter Reichskanzler Bismarck wird die Krankenversicherung für Arbeiter eingeführt. Rund jeder Zehnte ist anfangs pflichtversichert. Es entstehen viele Kassen nach Ort, Betrieb und Beruf.
      quellen: [bmg-geschichte-gkv]
    - jahr: "1970"
      titel: Über 1.800 Kassen
      text: In der Bundesrepublik gibt es 1.815 Krankenkassen. Wer wo versichert ist, hängt meist von Beruf, Betrieb oder Wohnort ab.
      quellen: [gkv-sv-kassen]
    - jahr: "1994"
      titel: Risikostrukturausgleich
      text: Ein Finanzausgleich zwischen den Kassen gleicht Unterschiede bei Alter, Geschlecht und Erwerbsminderung aus. Er soll einen fairen Wettbewerb ermöglichen.
      quellen: [gkv-sv-gesundheitsfonds-rsa, bas-rsa]
    - jahr: "1996"
      titel: Freie Kassenwahl
      text: Die meisten Versicherten dürfen ihre Kasse nun frei wählen. Die Zahl der Kassen sinkt danach besonders schnell, von rund 960 (1995) auf 420 (2000).
      quellen: [bpb-gegliedert-2017, vdek-basisdaten-2026]
    - jahr: "2009"
      titel: Gesundheitsfonds und Morbi-RSA
      text: Alle Beiträge fließen in einen gemeinsamen Fonds. Der Finanzausgleich berücksichtigt nun auch Krankheiten, zunächst 80 ausgewählte.
      quellen: [gkv-sv-gesundheitsfonds-rsa, bmg-rsa]
    - jahr: "2020"
      titel: Faire-Kassenwahl-Gesetz
      text: "Der Finanzausgleich wird umgebaut: Er erfasst alle Krankheiten, berücksichtigt den Wohnort, gleicht sehr teure Einzelfälle über einen Risikopool aus und erschwert Manipulationen bei Diagnosen."
      quellen: [bmg-rsa]
    - jahr: "2020"
      titel: Österreich legt Kassen zusammen
      text: Neun Gebietskrankenkassen werden zur Österreichischen Gesundheitskasse. Der Rechnungshof stellt später fest, dass die angekündigten Einsparungen nicht darstellbar sind.
      quellen: [rechnungshof-at-2022]
    - jahr: "2026"
      titel: Deckel für Verwaltung und Werbung
      text: "Das Spargesetz bindet den Anstieg der Verwaltungsausgaben jeder Kasse an die Einnahmenentwicklung und halbiert die Grenze für Werbeausgaben. Die FinanzKommission Gesundheit gibt keine Empfehlung zur Zahl der Kassen ab."
      quellen: [bt-drs-21-6130, bundesregierung-bstabg-2026, finanzkommission-bericht-voll-2026]
  bilanz:
    - typ: fakt
      text: "Die Zahl der Kassen ist seit 1970 um rund 95 % gesunken, und zwar überwiegend durch freiwillige Fusionen – vor allem in den Jahren nach Einführung der Kassenwahl."
      quellen: [vdek-basisdaten-2026]
    - typ: fakt
      text: "Die Ersparnis durch Begrenzung von Verwaltung und Werbung ist im Vergleich klein: Das Spargesetz rechnet mit rund 0,1 Mrd. € im ersten Jahr – bei einer Finanzlücke von rund 15 Mrd. €."
      quellen: [bt-drs-21-6130]
    - typ: wertung
      text: "Deutschland hat den Wettbewerb zwischen Kassen eingeführt, um Service und Wirtschaftlichkeit zu verbessern. Ob er auch die Versorgung verbessert hat, ist umstritten – und hängt davon ab, wie viel Spielraum die Kassen beim Einkauf von Leistungen tatsächlich haben."

laender:
  beispiele:
    - land: Österreich
      ansatz: Pflichtversicherung ohne Kassenwahl, 2020 zu einer großen Kasse fusioniert
      text: "Die Versicherten können ihre Kasse nicht wählen; sie wird nach Beruf und Bundesland zugewiesen. 2020 wurden 21 Sozialversicherungsträger auf fünf reduziert, die neun Gebietskrankenkassen bilden seitdem die Österreichische Gesundheitskasse. Angekündigt war eine „Patientenmilliarde“ durch geringere Verwaltungskosten. Der Rechnungshof fand stattdessen Mehrkosten, eine nur teilweise Angleichung der Leistungen und keinen bundesweit einheitlichen Ärztevertrag."
      vergleichbarkeit: hoch
      vergleichbarkeit_text: "Österreich hat wie Deutschland eine beitragsfinanzierte Sozialversicherung mit Selbstverwaltung. Allerdings gab es dort schon vorher keinen Wettbewerb zwischen den Kassen; die Fusion zeigt also vor allem, wie schwer eine Zusammenlegung ist, nicht, was der Verzicht auf Wettbewerb bewirkt."
      quellen: [rechnungshof-at-2022, observatory-at-2018]
    - land: Schweiz
      ansatz: Viele private Versicherer in der Grundversicherung, Einheitskasse per Volksabstimmung abgelehnt
      text: "Die Grundversicherung wird von privaten Versicherern angeboten, 1996 waren es 145, 2025 noch 37. Ihre Verwaltungskosten liegen bei knapp 5 % der Prämien. Eine öffentliche Einheitskasse lehnten die Stimmberechtigten zweimal ab: 2007 mit 71 % und 2014 mit knapp 62 % Nein-Stimmen."
      vergleichbarkeit: mittel
      vergleichbarkeit_text: "Die Schweiz hat wie Deutschland Wettbewerb zwischen Versicherern mit gleichem Leistungskatalog und Finanzausgleich. Finanziert wird aber über Kopfprämien, und die Versicherer sind privatrechtlich organisiert. Die Abstimmungen zeigen eine Präferenz der Bevölkerung, aber keinen Kostenvergleich."
      quellen: [bag-kennzahlen-versicherer-2025, fedlex-abstimmung-2014, swissvotes-2007]
    - land: Niederlande
      ansatz: Regulierter Wettbewerb privater Versicherer mit viel Vertragsfreiheit
      text: "Seit 2006 bieten private Versicherer die Pflichtversicherung an, müssen aber jeden aufnehmen. Sie dürfen frei mit Kliniken und Praxen verhandeln. Der Markt ist stark konzentriert: Zehn Konzerne, von denen die vier größten knapp 85 % der Versicherten haben. Jedes Jahr wechseln etwa 6 bis 9 % der Versicherten den Konzern. Das Observatory urteilt, die Verträge richteten sich noch stärker nach Menge und Preis als nach Qualität."
      vergleichbarkeit: mittel
      vergleichbarkeit_text: "Die Niederlande zeigen, wohin die Option „mehr Wettbewerb“ führen kann: mehr Vertragsfreiheit, aber auch wenige große Anbieter. Der Weg dorthin war ein großer Systemumbau mit Abschaffung der Trennung von gesetzlich und privat."
      quellen: [nza-zorgverzekeringen-2026, observatory-nl-2024]
    - land: Frankreich
      ansatz: Ein großer öffentlicher Träger plus private Zusatzversicherungen
      text: "Die gesetzliche Krankenversicherung ist weitgehend in einem allgemeinen System zusammengefasst; 2018 wurde auch die eigene Kasse der Selbstständigen in dieses System eingegliedert. Wettbewerb gibt es vor allem bei den Zusatzversicherungen, die fast alle Menschen haben und die gut jeden achten Euro der Behandlungskosten tragen."
      vergleichbarkeit: mittel
      vergleichbarkeit_text: "Frankreich kommt einer Einheitskasse nahe, verlagert den Wettbewerb aber in die Zusatzversicherung. Diese trägt in Frankreich Kosten, die in Deutschland die GKV übernimmt; ein direkter Vergleich der Verwaltungskosten ist deshalb schwierig."
      quellen: [assemblee-rsi-2017, drees-complementaire-2026, drees-financement-2025]
  diagramme:
    - titel: Anteil der Versicherten, die den Versicherer wechseln (Niederlande)
      einheit: Prozent der Versicherten
      stand: 2022–2026
      quelle: nza-zorgverzekeringen-2026
      hinweis: Nur Wechsel zwischen Versicherungskonzernen. Zum Vergleich gibt es in Deutschland keine amtliche Wechselstatistik.
      werte:
        - label: "2022"
          wert: 6.9
        - label: "2023"
          wert: 8.5
        - label: "2024"
          wert: 7.4
        - label: "2025"
          wert: 7.0
        - label: "2026"
          wert: 6.4
          hervorheben: true
  fazit:
    - typ: wertung
      text: "Die Beispiele zeigen keine eindeutige Richtung: Österreich hat mit der Zusammenlegung nicht gespart, die Schweiz hält am Wettbewerb fest, die Niederlande zeigen, dass viel Vertragsfreiheit zu wenigen großen Anbietern führen kann, und Frankreich verlagert den Wettbewerb in die Zusatzversicherung."
    - typ: wertung
      text: "Ob weniger oder mehr Kassen besser sind, hängt weniger von der Zahl ab als davon, was die Kassen gestalten dürfen."

verknuepft:
  - frage: finanzierung-kostenanstieg
    grund: Verwaltung und Wettbewerb der Kassen sind Teil der Debatte, wie die Finanzlücke geschlossen werden kann.
  - frage: finanzierung-versicherungssystem
    grund: Eine Einheitskasse für gesetzlich Versicherte ist etwas anderes als eine Bürgerversicherung für alle – beide Fragen hängen aber zusammen.
  - frage: ambulant-steuerung
    grund: Hausarzttarife und Selektivverträge sind Werkzeuge, mit denen Kassen die Versorgung unterschiedlich gestalten könnten.
  - frage: praevention-anreize
    grund: Bonusprogramme sind eine der wenigen Leistungen, mit denen sich Kassen voneinander unterscheiden.

parteien:
  - partei: CDU/CSU
    option: mehr-wettbewerb
    beleg: Finanzen der gesetzlichen Krankenversicherung zukunftsfest aufstellen. Dazu streben wir mehr Effizienz beim Einsatz von Beitragsgeldern an und stärken den Wettbewerb der Krankenkassen.
    seite: "68"
    quelle: wahlprogramm-2025-cdu-csu

