laender:
  beispiele:
    - land: Österreich
      ansatz: Primärversorgungseinheiten (PVE) mit gemischten Teams
      text: In einer PVE arbeiten Allgemein- oder Kinderärztinnen mit Pflege, Ordinationsassistenz, Therapie und Sozialarbeit zusammen, mit längeren Öffnungszeiten. Seit Juli 2025 gibt es 100 PVE, davon 13 für Kinder und Jugendliche. Österreich nutzte dafür 100 Millionen Euro aus dem EU-Aufbauplan.
      vergleichbarkeit: hoch
      vergleichbarkeit_text: Ähnliches Sozialversicherungssystem mit niedergelassenen Ärzten. Belastbare Daten zur Wirkung auf die Versorgung auf dem Land fehlen in den genutzten Quellen allerdings noch.
      quellen: [sozialministerium-at-pve-2025]

verknuepft:
  - frage: ambulant-steuerung
    grund: Eine Hausarztpflicht setzt voraus, dass es überall genug Hausarztpraxen gibt.
  - frage: digitalisierung-telemedizin
    grund: Videosprechstunden und digitale Ersteinschätzung können weite Wege ersetzen.
  - frage: fachkraefte-aufgabenteilung
    grund: Wenn Pflegekräfte mehr dürfen, können sie Lücken auf dem Land füllen.
  - frage: krankenhaus-standorte
    grund: Wo Kliniken schließen oder sich spezialisieren, wird die ambulante Versorgung vor Ort wichtiger.

