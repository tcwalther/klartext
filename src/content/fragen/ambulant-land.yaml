parteien:
  - partei: AfD
    option: anreize
    beleg: Die freiberuflich geführte Inhaberpraxis soll weiterhin das Rückgrat der ambulanten Versorgung bilden. Zur Förderung der Niederlassung von Ärzten im ländlichen Räumen sind finanzielle und organisatorische Niederlassungshilfen zu etablieren.
    seite: "27"
    quelle: wahlprogramm-2025-afd
  - partei: Die Linke
    option: kommunale-zentren
    beleg: Wir wollen kommunale Versorgungszentren als Rückgrat der wohnortnahen Gesundheitsversorgung fördern! Sie sollen zentrale Anlaufstelle für Patient*innen sein und die ambulante Versorgung mit akutstationären, notfallmedizinischen, psychotherapeutischen, (gemeinde-)pflegerischen und weiteren therapeutischen Behandlungen verbinden.
    seite: "19"
    quelle: wahlprogramm-2025-die-linke
