bereich: ambulant
reihenfolge: 2
status: entwurf
stand: "2026-11-25"
titel: Arztpraxen auf dem Land
frage: Wie soll die ärztliche Grundversorgung in Regionen gesichert werden, in denen Hausarztpraxen keine Nachfolge finden?

optionen:
  - id: anreize
    titel: Anreize und Landarztquote
    kurz: Mehr Geld, Förderprogramme und Studienplätze mit Landverpflichtung sollen Ärztinnen und Ärzte aufs Land holen.
    pro:
      - typ: wertung
        text: Das bewährte Modell der eigenen Praxis bleibt erhalten. Ärztinnen und Ärzte entscheiden selbst, wo sie arbeiten – nur mit besseren Bedingungen.
      - typ: fakt
        text: Beispiel **Landarztquote** in NRW (seit 2019) – wer darüber einen Medizin-Studienplatz bekommt, verpflichtet sich, später zehn Jahre hausärztlich in einer unterversorgten Region zu arbeiten. Inzwischen sind so mehr als 1.100 künftige Hausärztinnen und Hausärzte gebunden.
        quellen: [nrw-landarztquote-2026]
    contra:
      - typ: wertung
        text: Die Landarztquote wirkt sehr spät. Zwischen Studienbeginn und eigener Praxis liegen oft mehr als zehn Jahre.
      - typ: wertung
        text: Geld allein löst nicht alles. Viele junge Ärztinnen und Ärzte wollen angestellt und in Teilzeit arbeiten statt eine eigene Praxis zu führen.
    gewinnt: [Ärztinnen und Ärzte, die aufs Land gehen, Kontinuität des Praxismodells]
    kostet: [Beitrags- und Steuerzahler (Förderung), Wahlfreiheit von Studierenden mit Landverpflichtung]

  - id: kommunale-zentren
    titel: Kommunen betreiben Versorgungszentren
    kurz: Gemeinden, Kreise oder das Land gründen selbst Gesundheitszentren und stellen Ärztinnen und Ärzte an, wo sich keine Praxis findet.
    pro:
      - typ: wertung
        text: Angestellte Ärztinnen und Ärzte müssen kein Unternehmen führen und kein Risiko tragen. Das kommt dem Wunsch vieler Jüngerer nach geregelten Arbeitszeiten entgegen.
      - typ: fakt
        text: Kommunen dürfen nach dem Sozialgesetzbuch selbst **Medizinische Versorgungszentren (MVZ)** gründen. Ein MVZ ist eine Einrichtung, in der mehrere, oft angestellte Ärztinnen und Ärzte zusammenarbeiten.
        quellen: [sgb5-95]
    contra:
      - typ: wertung
        text: Kommunen tragen dann Kosten und Verwaltungsaufwand, für die sie nicht gemacht sind. Ärmere Gemeinden können sich das weniger leisten.
      - typ: wertung
        text: Ein Zentrum ist nur so gut wie sein Personal. Fehlen Ärztinnen und Ärzte insgesamt, verschiebt eine neue Trägerschaft sie nur von einem Ort an einen anderen.
    gewinnt: [Orte ohne Praxisnachfolge, Ärztinnen und Ärzte, die angestellt arbeiten wollen]
    kostet: [kommunale Haushalte, unternehmerische Freiheit der Praxisinhaber]

  - id: neu-organisieren
    titel: Versorgung neu organisieren
    kurz: Weniger Arztkontakte pro Patient – stattdessen Telemedizin, mobile Teams und mehr Aufgaben für Pflegekräfte und Praxisassistenz.
    pro:
      - typ: wertung
        text: Die vorhandenen Ärztinnen und Ärzte können sich auf das konzentrieren, wofür es sie wirklich braucht. Routineaufgaben übernehmen andere Berufe.
      - typ: schaetzung
        text: Eine Studie im Auftrag des Bosch Health Campus rechnet vor, dass Prävention, Telemedizin und nichtärztliche Berufe zusammen die erwartete hausärztliche Versorgungslücke schließen könnten.
        quellen: [aerzteblatt-iges-2026]
        unsicherheit: Modellrechnung mit Annahmen, etwa zum Anteil telemedizinischer Fälle; Ergebnisse beispielhaft für Baden-Württemberg berechnet.
    contra:
      - typ: wertung
        text: Ältere und weniger technikaffine Menschen kommen mit Video und App schlechter zurecht – gerade sie leben häufig auf dem Land.
      - typ: wertung
        text: Mehr Beteiligte bedeuten mehr Schnittstellen. Wenn Zuständigkeiten unklar sind, kann Wichtiges untergehen.
    gewinnt: [Patienten in Regionen mit wenigen Praxen, Pflege- und Assistenzberufe]
    kostet: [persönlicher Arztkontakt, Menschen ohne digitale Zugänge]

erklaerung:
  - typ: fakt
    text: Die Zahl der Hausärztinnen und Hausärzte steigt sogar leicht. Weil aber mehr von ihnen in Teilzeit arbeiten, sinkt die Zahl der voll besetzten Hausarztsitze. Mehr Köpfe heißt also nicht mehr Arztzeit.
    genau: 2025 gab es 55.778 Hausärztinnen und Hausärzte, etwas mehr als im Vorjahr. Die Zahl der voll besetzten Hausarztsitze sank im selben Zeitraum leicht.
    quellen: [kbv-arztzahlen-2026]
  - typ: wertung
    text: Ob ein Ort versorgt ist, hängt bisher vor allem daran, dass jemand eine Praxis übernimmt und als eigenes Unternehmen führt. Viele jüngere Ärztinnen und Ärzte wollen lieber angestellt und in Teilzeit arbeiten. Wo Wege weit und Praxen klein sind, fällt die Nachfolge deshalb besonders schwer.
  - typ: schaetzung
    text: Eine Modellrechnung erwartet, dass bis 2040 etwa jeder fünfte Hausarztsitz unbesetzt ist. Betroffen wären vor allem ländliche Kreise.
    genau: Die IGES-Studie im Auftrag des Bosch Health Campus rechnet für 2040 mit rund 12.000 unbesetzten Hausarztsitzen, gegenüber rund 4.400 im Vorjahr der Studie. Knapp ein Fünftel der Kreise wäre dann hausärztlich unterversorgt.
    quellen: [aerzteblatt-iges-2026]
    unsicherheit: Simulation auf Basis von Nachwuchs- und Altersannahmen; frühere Studien kamen zu höheren Werten.
  - typ: fakt
    text: Ein Hebel ist das Geld. Hausärztliche Leistungen werden seit Herbst 2025 ohne Mengengrenze bezahlt, damit lohnen sich zusätzliche Patienten für die Praxis voll. Neue Versorgungsformen wie Gesundheitskioske wurden dagegen aus dem Gesetz gestrichen.
    genau: Die „Entbudgetierung“ gilt seit Oktober 2025 (Gesundheitsversorgungsstärkungsgesetz). Gestrichen wurden die geplanten Gesundheitskioske und Primärversorgungszentren.
    quellen: [vdek-gvsg-2025]
  - typ: fakt
    text: Weitere Werkzeuge gibt es schon. Über die **Landarztquote** verpflichten sich Studierende, später auf dem Land als Hausärztin oder Hausarzt zu arbeiten. Kommunen dürfen eigene **Medizinische Versorgungszentren (MVZ)** gründen und Ärzte anstellen. Gestritten wird darüber, was davon reicht und wie schnell es wirkt – denn zwischen Studienbeginn und eigener Praxis vergehen viele Jahre.
    genau: In NRW gibt es die Landarztquote seit 2019. Im Studienjahr 2026/27 sind es 227 Plätze (8,8 % der Medizinstudienplätze); mehr als 1.100 künftige Hausärztinnen und Hausärzte sind so bereits gebunden, jeweils für zehn Jahre in einer unterversorgten Region. Grundlage für kommunale MVZ ist § 95 SGB V.
    quellen: [nrw-landarztquote-2026, sgb5-95]

zielkonflikte:
  - typ: wertung
    text: Wohnortnahe Versorgung steht gegen Effizienz. Eine Praxis in jedem Dorf ist kaum zu besetzen, größere Zentren bedeuten längere Wege.
  - typ: wertung
    text: Freiheit der Berufswahl steht gegen planbare Versorgung. Je stärker man Ärztinnen und Ärzte bindet, desto sicherer ist die Versorgung – desto unattraktiver aber vielleicht der Beruf.
  - typ: wertung
    text: Neue Versorgungsformen sparen Arztzeit, verändern aber die gewohnte Beziehung zwischen Patient und Hausärztin.

