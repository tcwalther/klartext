  fazit:
    - typ: fakt
      text: "Unter den Vergleichsländern gibt nur Deutschland Gutverdienenden, Beamten und Selbstständigen die Wahl, die Sozialversicherung ganz durch eine private Vollversicherung zu ersetzen. Die anderen Länder versichern alle in einem System – mit sehr unterschiedlicher Finanzierung."
      quellen: [observatory-nl-2024, bag-praemienverbilligung-2025, sozialministerium-at-2025, drees-financement-2025]
    - typ: wertung
      text: "Ein „System für alle“ kann sehr Verschiedenes heißen: private Versicherer mit Einheitsprämie wie in den Niederlanden, Kopfprämien wie in der Schweiz oder eine Sozialversicherung mit Zusatzversicherung wie in Frankreich. Die Frage ist also nicht nur, ob es ein System gibt, sondern wie es finanziert wird."

verknuepft:
  - frage: finanzierung-kostenanstieg
    grund: Wer wie versichert ist, bestimmt mit, wie viel Geld der GKV zur Verfügung steht.
  - frage: finanzierung-kassenvielfalt
    grund: Eine Einheitskasse für gesetzlich Versicherte und eine Bürgerversicherung für alle sind verschiedene Ideen, die oft vermischt werden.
  - frage: pflege-eigenanteile
    grund: Auch in der Pflegeversicherung gibt es ein gesetzliches und ein privates System.
parteien:
  - partei: CDU/CSU
    option: dual-beibehalten
    beleg: Wir stehen dabei zu den Grundpfeilern des deutschen Gesundheitssystems mit seiner bewährten Selbstverwaltung, zur Dualität von gesetzlicher und privater Krankenversicherung, zu unserem Bekenntnis zum Grundsatz der Freiberuflichkeit und zur solidarischen Beitragsfinanzierung.
    seite: "67"
    quelle: wahlprogramm-2025-cdu-csu
  - partei: Grüne
    option: buergerversicherung
    beleg: Unser Ziel ist die Bürgerversicherung, die neben den gesetzlich Krankenversicherten auch die Privatversicherten in den solidarischen Finanzausgleich des Gesundheitssystems einbezieht.
    seite: "93"
    quelle: wahlprogramm-2025-gruene
  - partei: Die Linke
    option: buergerversicherung
    beleg: Die Beitragsbemessungsgrenze fällt weg. Auch für Einkommen aus Kapitalerträgen und andere Einkommensarten müssen Beiträge gezahlt werden. Privatversicherte werden in die gesetzliche Krankenversicherung übernommen.
    seite: "18"
    quelle: wahlprogramm-2025-die-linke
  - partei: SPD
    option: buergerversicherung
    beleg: Wir setzen auf ein solidarisches System einer Bürgerversicherung, das allen Menschen gleichen Zugang zu Gesundheitsleistungen in gleicher Qualität ermöglicht.
    seite: "28"
    quelle: wahlprogramm-2025-spd
