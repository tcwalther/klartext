geschichte:
  ereignisse:
    - jahr: "2020"
      titel: Modellrechnung zur einheitlichen Versicherung
      text: Eine Studie des IGES-Instituts im Auftrag der Bertelsmann Stiftung berechnet, wie sich die GKV-Finanzen ändern würden, wenn alle Privatversicherten einbezogen wären.
      quellen: [bertelsmann-iges-2020]
    - jahr: "2026"
      titel: Außerordentliche Anhebung der Einkommensgrenzen
      text: Mit dem GKV-Beitragssatzstabilisierungsgesetz steigen Versicherungspflicht- und Beitragsbemessungsgrenze 2027 zusätzlich um 300 € im Monat.
      quellen: [bundesregierung-rechengroessen-2027]
laender:
  beispiele:
    - land: Niederlande
      ansatz: Eine Pflichtversicherung für alle bei privaten Versicherern
      text: Seit 2006 müssen alle Einwohner eine Basisversicherung bei einem privatrechtlichen Versicherer abschließen. Die Trennung zwischen gesetzlicher und privater Versicherung wurde aufgehoben. Versicherer müssen jeden aufnehmen und dürfen Prämien nicht nach Gesundheit staffeln. Eine erste Auswertung bewertete die Reform als „per Saldo positiv“, sah aber auch deutliche Probleme, etwa beim Einkauf von Leistungen durch die Versicherer.
      vergleichbarkeit: mittel
      vergleichbarkeit_text: Die Niederlande haben wie Deutschland Versicherungen und Wettbewerb zwischen Kassen. Der Weg dorthin war aber ein anderer, und die Finanzierung (Prämie an den Versicherer, staatlicher Zuschuss für Haushalte mit geringem Einkommen) unterscheidet sich vom deutschen Beitragssystem.
      quellen: [observatory-nl-2016, zvw-evaluation-2010]
verknuepft:
  - frage: finanzierung-kostenanstieg
    grund: Wer wie versichert ist, bestimmt mit, wie viel Geld der GKV zur Verfügung steht.
  - frage: pflege-eigenanteile
    grund: Auch in der Pflegeversicherung gibt es ein gesetzliches und ein privates System.
