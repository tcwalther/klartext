geschichte:
  ereignisse:
    - jahr: "1883"
      titel: Krankenversicherung für Arbeiter
      text: Die gesetzliche Krankenversicherung beginnt mit Pflichtversicherung für Industriearbeiter und Beschäftigte in Handwerk und Gewerbe. Anfangs ist nur etwa jeder Zehnte pflichtversichert; heute sind es rund neun von zehn.
      quellen: [bmg-geschichte-gkv]
    - jahr: "2003"
      titel: Wechselgrenze wird eigenständig
      text: Die Versicherungspflichtgrenze, ab der Angestellte in die PKV wechseln dürfen, wird erstmals höher angesetzt als die Beitragsbemessungsgrenze. Der Wechsel wird damit schwerer.
      quellen: [vdek-basisdaten-2026]
    - jahr: "2007/2009"
      titel: Versicherungspflicht für alle und Basistarif
      text: Seit 2007 bzw. 2009 muss jeder in Deutschland krankenversichert sein. Private Versicherer müssen einen Basistarif anbieten, der im Umfang der GKV entspricht, und dürfen dort niemanden ablehnen.
      quellen: [bmg-basistarif]
    - jahr: "2012–2024"
      titel: Wechselströme kehren sich zweimal um
      text: Ab 2012 wechseln einige Jahre lang mehr Menschen von der PKV in die GKV als umgekehrt. Seit 2019 gewinnt die PKV wieder Versicherte, 2024 per Saldo knapp 81.000 – deutlich weniger als in den 1990er- und 2000er-Jahren.
      quellen: [iaq-wechsel-gkv-pkv]
    - jahr: "2020"
      titel: Modellrechnung zur einheitlichen Versicherung
      text: Eine Studie des IGES-Instituts im Auftrag der Bertelsmann Stiftung berechnet, wie sich die GKV-Finanzen ändern würden, wenn alle Privatversicherten einbezogen wären.
      quellen: [bertelsmann-iges-2020]
    - jahr: "2026"
      titel: Außerordentliche Anhebung der Einkommensgrenzen
      text: Mit dem GKV-Beitragssatzstabilisierungsgesetz steigen Versicherungspflicht- und Beitragsbemessungsgrenze 2027 zusätzlich um 300 € im Monat. Das betrifft rund 5,4 Mio. Mitglieder.
      quellen: [bundesregierung-rechengroessen-2027, bt-drs-21-6130]
  bilanz:
    - typ: fakt
      text: Die Zahl der Privatversicherten bleibt seit Jahren bei knapp 9 Mio. Das duale System wurde mehrfach verändert, an seiner Grundstruktur aber nie gerüttelt.
      quellen: [pkv-branchenzahlen-2025]
    - typ: wertung
      text: "Die Politik hat eher an den Grenzen gedreht als am System: höhere Wechselgrenze, Pflicht zur Versicherung, Basistarif, Anhebung der Bemessungsgrenze. Eine Bürgerversicherung wurde oft gefordert, aber nie umgesetzt."

laender:
  beispiele:
    - land: Niederlande
      ansatz: Eine Pflichtversicherung für alle bei privaten Versicherern
      text: "Seit 2006 müssen alle Einwohner eine Basisversicherung bei einem privatrechtlichen Versicherer abschließen; die Trennung zwischen gesetzlicher und privater Versicherung wurde aufgehoben. Versicherer müssen jeden aufnehmen. Etwa die Hälfte der Finanzierung kommt aus einer für alle gleichen Prämie, die andere Hälfte aus einem einkommensabhängigen Beitrag; Haushalte mit wenig Einkommen erhalten einen Zuschuss aus Steuern. Eine erste Auswertung bewertete die Reform als „per Saldo positiv“, sah aber auch Probleme, etwa beim Einkauf von Leistungen."
      vergleichbarkeit: mittel
      vergleichbarkeit_text: Die Niederlande haben wie Deutschland Versicherungen und Wettbewerb zwischen Kassen. Der Weg dorthin war aber ein anderer, und die Finanzierung (Prämie an den Versicherer, Zuschuss für Haushalte mit geringem Einkommen) unterscheidet sich vom deutschen Beitragssystem.
      quellen: [observatory-nl-2016, observatory-nl-2024, zvw-evaluation-2010]
    - land: Schweiz
      ansatz: Pflichtversicherung für alle mit Kopfprämien und Prämienverbilligung
      text: "Jede Person mit Wohnsitz in der Schweiz muss grundversichert sein. Die Prämie ist pro Person gleich, unabhängig von Einkommen und Gesundheit; sie hängt nur von Region und Tarifmodell ab. Wer wenig verdient, bekommt eine Prämienverbilligung aus Steuern – 2024 insgesamt rund 6,6 Mrd. Franken. Private Versicherungen gibt es nur als Zusatz."
      vergleichbarkeit: mittel
      vergleichbarkeit_text: "Die Schweiz kennt keine Trennung in gesetzlich und privat, aber auch keine einkommensabhängigen Beiträge. Der soziale Ausgleich läuft über Steuern statt über die Versicherung selbst – ein Modell, das in Deutschland unter dem Stichwort „Gesundheitsprämie“ diskutiert wurde."
      quellen: [bag-praemienverbilligung-2025]
    - land: Österreich
      ansatz: Pflichtversicherung für fast alle, private Versicherung als Zusatz
      text: "Fast die gesamte Bevölkerung ist gesetzlich pflichtversichert; die Kasse richtet sich nach dem Beruf. Eine Möglichkeit, sich stattdessen privat voll zu versichern, gibt es nicht. Trotzdem hat gut jeder Dritte eine private Zusatzversicherung, etwa für Wahlärzte oder ein Einzelzimmer im Krankenhaus."
      vergleichbarkeit: hoch
      vergleichbarkeit_text: "Österreich hat ein sehr ähnliches Sozialversicherungssystem wie Deutschland. Es zeigt, wie eine Pflichtversicherung für alle aussehen kann – und dass private Angebote dann als Zusatz weiterbestehen. Die Zahl zur Zusatzversicherung ist allerdings von 2016."
      quellen: [sozialministerium-at-2025, observatory-at-2018]
    - land: Frankreich
      ansatz: Sozialversicherung für alle plus fast flächendeckende Zusatzversicherung
      text: "Alle sind in der staatlichen Sozialversicherung versichert, die etwa vier von fünf Euro der Behandlungskosten trägt. Fast alle haben zusätzlich eine private oder genossenschaftliche Zusatzversicherung, die Zuzahlungen und Lücken abdeckt; für Menschen mit wenig Geld gibt es eine kostenlose oder günstige Variante."
      vergleichbarkeit: mittel
      vergleichbarkeit_text: "Frankreich hat eine Versicherung für alle, verlagert aber einen größeren Teil der Kosten als Deutschland in Zusatzversicherungen. Eine Bürgerversicherung nach französischem Muster wäre also nicht automatisch eine Vollversicherung."
      quellen: [drees-financement-2025, drees-complementaire-2026]
