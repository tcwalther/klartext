bereich: finanzierung
reihenfolge: 1
status: entwurf
stand: "2026-11-25"
titel: Gesetzlich und privat – soll das duale System bleiben?
frage: Sollen gesetzliche und private Krankenversicherung weiter nebeneinander bestehen, oder soll es eine gemeinsame Versicherung für alle geben?
optionen:
  - id: dual-beibehalten
    titel: Duales System beibehalten
    kurz: Gesetzliche und private Krankenversicherung bleiben in ihrer heutigen Form nebeneinander bestehen.
    pro:
      - typ: wertung
        text: Wer gut verdient, selbstständig oder verbeamtet ist, kann zwischen zwei Systemen wählen. Diese Wahlfreiheit ist für viele ein Wert an sich.
      - typ: wertung
        text: Die private Krankenversicherung bildet für jeden Versicherten Rücklagen für das Alter (**Alterungsrückstellungen**). Das gilt als Vorsorge für eine alternde Gesellschaft, die nicht allein auf die nächste Generation verschoben wird.
      - typ: position
        wer: PKV-Verband
        text: Privatversicherte bringen Arztpraxen, Kliniken und anderen Anbietern zusätzliches Geld, weil für sie höhere Gebühren gelten. Dieses Geld komme der Versorgung aller zugute und würde ohne die PKV fehlen.
        quellen: [pkv-mehrumsatz-2026]
      - typ: wertung
        text: Der Wettbewerb zwischen zwei Systemen kann beide unter Druck setzen, Leistungen und Service zu verbessern.
    contra:
      - typ: fakt
        text: "Wer in die PKV wechselt, verdient im Schnitt mehr und ist im Schnitt gesünder als gesetzlich Versicherte. Ihr Beitrag zum Ausgleich zwischen Gesunden und Kranken, Gut- und Geringverdienenden fehlt der GKV. Eine Modellrechnung beziffert das auf bis zu 145 € je GKV-Mitglied im Jahr."
        quellen: [bertelsmann-iges-2020]
      - typ: wertung
        text: Unterschiedliche Honorare für gesetzlich und privat Versicherte können zu unterschiedlich schnellen Terminen führen. Viele empfinden das als ungerecht.
      - typ: fakt
        text: "Der Weg in die PKV ist für viele eine Einbahnstraße: Zurück in die GKV kommt nur, wer wieder versicherungspflichtig wird, und ab 55 Jahren ist auch das praktisch ausgeschlossen. Wer im Alter hohe Prämien zahlt, kann deshalb kaum ausweichen."
        quellen: [iaq-wechsel-gkv-pkv]
    gewinnt: [Wahlfreiheit für Gutverdienende, Selbstständige und Beamte, Kapitalgedeckte Altersvorsorge in der PKV, Einnahmen von Arztpraxen]
    kostet: [Breite der Finanzierungsbasis der GKV, Gleichbehandlung beim Zugang]
  - id: annaehern
    titel: Schrittweise annähern
    kurz: Beide Systeme bleiben, werden aber stärker verbunden – etwa durch höhere Einkommensgrenzen oder einen gemeinsamen Finanzausgleich.
    pro:
      - typ: wertung
        text: Eine höhere **Versicherungspflichtgrenze** (bis zu diesem Einkommen muss man gesetzlich versichert sein) hält mehr Gutverdienende in der GKV und verbreitert so ihre Einnahmen.
      - typ: wertung
        text: Eine höhere **Beitragsbemessungsgrenze** (Einkommen darüber ist beitragsfrei) lässt Menschen mit hohem Einkommen mehr zur Finanzierung beitragen.
      - typ: wertung
        text: Ein Finanzausgleich zwischen den Systemen könnte Unterschiede bei Einkommen und Krankheitsrisiken ausgleichen, ohne bestehende Verträge aufzulösen.
      - typ: wertung
        text: Schrittweise Änderungen lassen sich besser steuern und notfalls korrigieren als ein großer Systemwechsel.
      - typ: schaetzung
        text: "Wie viel eine Anhebung bringt, zeigt der Schritt für 2027: 300 € mehr Beitragsbemessungs- und Versicherungspflichtgrenze im Monat bringen der GKV rund 2,5 Mrd. € im Jahr. Betroffen sind rund 5,4 Mio. Mitglieder mit hohem Einkommen."
        genau: "1,2 Mrd. € tragen die Mitglieder, 1,3 Mrd. € die Arbeitgeber (Schätzung im Gesetzentwurf)."
        quellen: [bt-drs-21-6130]
    contra:
      - typ: position
        wer: PKV-Verband
        text: Höhere Beitragsbemessungs- und Versicherungspflichtgrenzen seien „faktisch Sondersteuern für qualifizierte Fachkräfte und deren Arbeitgeber“ und erschwerten die Wahlfreiheit stark.
        quellen: [pkv-stellungnahme-bstabg-2026]
      - typ: fakt
        text: "Höhere Grenzen verteuern gezielt gut bezahlte Arbeit. Bei 300 € mehr Bemessungsgrenze und einem Beitragssatz von rund 17,5 % zahlen Betroffene bis zu gut 26 € im Monat mehr, ihr Arbeitgeber ebenso. Eine höhere Versicherungspflichtgrenze verschiebt außerdem den Zeitpunkt, ab dem ein Wechsel in die PKV möglich ist."
        genau: "300 € × 17,5 % = 52,50 € im Monat, je zur Hälfte von Beschäftigten und Arbeitgebern getragen (eigene Berechnung)."
        quellen: [bt-drs-21-6130, vdek-basisdaten-2026]
      - typ: wertung
        text: Für Befürworter einer einheitlichen Versicherung bleibt die Annäherung auf halbem Weg stehen; für Befürworter des dualen Systems ist sie ein schleichender Umbau.
    gewinnt: [Finanzierungsbasis der GKV, Planbarkeit durch kleine Schritte]
    kostet: [Beschäftigte mit hohem Einkommen und ihre Arbeitgeber, Neugeschäft der PKV]
  - id: buergerversicherung
    titel: Eine Versicherung für alle
    kurz: Alle Menschen werden in einem gemeinsamen System versichert, oft „Bürgerversicherung“ genannt.
    pro:
      - typ: wertung
        text: Alle tragen nach ihrer wirtschaftlichen Leistungsfähigkeit zur Finanzierung bei, Gesunde und Kranke teilen das Risiko gemeinsam.
      - typ: schaetzung
        text: Eine Modellrechnung des IGES-Instituts kam 2020 zu dem Ergebnis, dass der Beitragssatz um 0,2 bis 0,6 Prozentpunkte sinken könnte, wenn alle Privatversicherten in die GKV einbezogen würden.
        quellen: [bertelsmann-iges-2020]
        unsicherheit: Datenstand 2020. Das Ergebnis hängt stark davon ab, ob Arztpraxen ihre bisherigen Mehreinnahmen aus der PKV ersetzt bekommen. Kritiker wenden ein, dass Privatversicherte künftig älter werden.
      - typ: position
        wer: Deutscher Gewerkschaftsbund (DGB)
        text: Eine einheitliche Bürgerversicherung schaffe eine bedarfsgerechte Versorgung für alle, unabhängig von Alter, Wohnort oder Einkommen. Auch weitere Einkommensarten oberhalb eines Freibetrags sollten Beiträge tragen.
        quellen: [dgb-buergerversicherung-2024]
      - typ: wertung
        text: Gleiche Honorare für alle Patienten nehmen Praxen den Anreiz, bestimmte Versicherte zu bevorzugen.
    contra:
      - typ: wertung
        text: Ein Systemwechsel ist rechtlich und praktisch schwierig. Bestehende private Verträge und Alterungsrückstellungen genießen Vertrauensschutz.
      - typ: schaetzung
        text: "Privatversicherte bringen Praxen und Kliniken deutlich mehr Geld, als sie nach GKV-Regeln bekämen – nach Berechnung eines PKV-Instituts mehr als 15 Mrd. € im Jahr. Fällt das weg, fehlt es den Anbietern. Wird es ausgeglichen, schrumpft die Entlastung der Beitragszahler."
        genau: "Mehrumsatz durch Privatversicherte 2024: rund 15,5 Mrd. € (Wissenschaftliches Institut der PKV)."
        quellen: [pkv-mehrumsatz-2026]
        unsicherheit: Berechnung eines Instituts der PKV, also eines Interessenträgers.
      - typ: wertung
        text: Ein einziges umlagefinanziertes System trägt die Kosten der Alterung allein über laufende Beiträge – ohne kapitalgedeckten Puffer.
      - typ: wertung
        text: Wer bisher privat versichert ist, verliert eine Wahlmöglichkeit.
    gewinnt: [Solidarausgleich zwischen allen Einkommen, Gleichbehandlung beim Zugang, Gesetzlich Versicherte mit mittlerem Einkommen]
    kostet: [Wahlfreiheit, Privatversicherte und ihre Versicherer, Einnahmen von Arztpraxen]
erklaerung:
  - typ: fakt
    text: "Etwa neun von zehn Menschen sind gesetzlich versichert, gut jeder zehnte privat."
    genau: "Gesetzlich Versicherte: 74,4 Mio. (Oktober 2026). Private Vollversicherte: 8,79 Mio. (2025)."
    quellen: [bmg-km1-2026, pkv-branchenzahlen-2025]
  - typ: fakt
    text: "In der **gesetzlichen Krankenversicherung (GKV)** richtet sich der Beitrag nach dem Einkommen, Gesunde und Kranke zahlen gleich viel. In der **privaten Krankenversicherung (PKV)** hängt er vom Tarif und vom Gesundheitszustand beim Eintritt ab. Deshalb ist die PKV vor allem für junge, gesunde und gut verdienende Menschen günstig."
    quellen: [bundesregierung-rechengroessen-2026, bertelsmann-iges-2020]
  - typ: fakt
    text: "Angestellte dürfen erst wechseln, wenn sie mehr als rund 6.500 € brutto im Monat verdienen. Beamte und Selbstständige dürfen unabhängig vom Einkommen wählen."
    genau: "Versicherungspflichtgrenze 2026: 77.400 € im Jahr (6.450 € im Monat), 2027: 84.150 €."
    quellen: [bundesregierung-rechengroessen-2026, bundesregierung-rechengroessen-2027]
  - typ: fakt
    text: "Auch in der GKV wird nicht das ganze Einkommen belastet: Oberhalb der **Beitragsbemessungsgrenze** von rund 5.800 € im Monat ist jeder weitere Euro beitragsfrei. Wer viel verdient, zahlt deshalb anteilig weniger."
    genau: "Beitragsbemessungsgrenze 2026: 69.750 € im Jahr, 2027: 76.500 €. Für 2027 steigen beide Grenzen zusätzlich zur üblichen Anpassung um 300 € im Monat."
    quellen: [bundesregierung-rechengroessen-2026, bundesregierung-rechengroessen-2027]
  - typ: fakt
    text: "Gemessen an den Ausgaben ist die PKV klein: Sie trägt etwa jeden zwölften Euro der Gesundheitsausgaben, die GKV mehr als jeden zweiten."
    genau: "2024: GKV 300,8 Mrd. €, PKV 44,8 Mrd. € (8,3 %) von insgesamt 538,2 Mrd. €."
    quellen: [destatis-gesundheitsausgaben-2024]

zusammenhaenge:
  erklaerung:
    - typ: wertung
      text: "Die beiden Systeme rechnen grundverschieden. Die GKV verteilt um: Die Beiträge eines Jahres bezahlen die Behandlungen desselben Jahres, Junge und Gesunde zahlen für Alte und Kranke mit. Die PKV kalkuliert für jeden Versicherten über das ganze Leben und legt in jungen Jahren Geld für das Alter zurück (Alterungsrückstellungen)."
    - typ: fakt
      text: "Weil nur bestimmte Gruppen wählen dürfen und vor allem Junge, Gesunde und Gutverdienende von der PKV profitieren, entmischt sich das Risiko. Seit 2019 wechseln wieder deutlich mehr Menschen von der GKV in die PKV als umgekehrt."
      genau: "Wanderungssaldo zugunsten der PKV 2024: knapp 81.000 Personen. Zwischen 2012 und 2017 wechselten mehr Menschen von der PKV in die GKV als umgekehrt."
      quellen: [iaq-wechsel-gkv-pkv]
    - typ: schaetzung
      text: "Der Ausgleich wirkt in beide Richtungen: Bezöge man alle Privatversicherten ein, könnte der GKV-Beitragssatz um einige Zehntelpunkte sinken. Zugleich verlören Praxen und Kliniken höhere Honorare, die ihnen Privatversicherte heute bringen."
      genau: "IGES-Modellrechnung 2020: Beitragssatz minus 0,2 bis 0,6 Prozentpunkte. PKV-Mehrumsatz 2024 laut WIP: rund 15,5 Mrd. €."
      quellen: [bertelsmann-iges-2020, pkv-mehrumsatz-2026]
      unsicherheit: Beide Zahlen stammen von Akteuren mit eigenen Interessen bzw. aus Modellrechnungen mit älterem Datenstand.
  kette:
    - titel: Wer wo versichert ist
      punkte:
        - label: Pflichtversicherte
          text: Angestellte unter der Versicherungspflichtgrenze, Rentner, Arbeitslose, Studierende – automatisch in der GKV.
        - label: Wahlberechtigte
          text: Gutverdienende Angestellte, Selbstständige, Beamte – sie können in die PKV.
        - label: Beamte
          text: Der Dienstherr erstattet einen Teil der Kosten (Beihilfe); deshalb ist die PKV für sie meist günstiger.
    - titel: Wie der Beitrag entsteht
      punkte:
        - label: GKV
          text: Prozentsatz vom Einkommen bis zur Beitragsbemessungsgrenze; Kinder und Partner ohne Einkommen oft beitragsfrei.
        - label: PKV
          text: Prämie nach Alter, Gesundheit und Tarif bei Eintritt; jede Person zahlt einzeln.
    - titel: Was daraus folgt
      punkte:
        - label: Risikoentmischung
          text: Gute Risiken können die GKV verlassen, schlechte bleiben.
        - label: Unterschiedliche Honorare
          text: Für Privatversicherte gelten höhere Gebühren – das bringt Praxen Geld und kann Termine beeinflussen.
        - label: Kaum Rückweg
          text: Wer privat versichert ist, kommt nur unter engen Bedingungen zurück.
    - titel: Stellschrauben
      punkte:
        - label: Grenzen anheben
          text: Höhere Versicherungspflicht- und Bemessungsgrenze.
        - label: Finanzausgleich
          text: Ausgleich zwischen GKV und PKV ohne Systemwechsel.
        - label: Eine Versicherung für alle
          text: Alle zahlen in ein System ein.

zielkonflikte:
  - typ: wertung
    text: '**Wahlfreiheit gegen Solidarausgleich:** Je mehr Menschen wählen dürfen, desto eher verlassen gut verdienende und gesunde Versicherte die gemeinsame Kasse.'
  - typ: wertung
    text: '**Entlastung der Beitragszahler gegen Einnahmen der Praxen:** Was GKV-Versicherte durch eine Einbeziehung der PKV sparen könnten, fehlt zum Teil Ärztinnen und Ärzten – oder muss anders ausgeglichen werden.'
  - typ: wertung
    text: '**Vorsorge gegen Umlage:** Kapitalgedeckte Rücklagen der PKV bereiten auf die Alterung vor, binden aber Geld. Das Umlageverfahren der GKV verteilt Lasten sofort, ist aber abhängig von der Zahl der Beitragszahler.'
  - typ: wertung
    text: '**Stabilität gegen Veränderung:** Ein großer Umbau kann Ungleichheiten schneller beseitigen, bringt aber rechtliche Risiken und Übergangsprobleme.'

