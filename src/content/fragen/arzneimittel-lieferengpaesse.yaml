verknuepft:
  - frage: arzneimittel-preise
    grund: Preisregeln für neue und alte Medikamente beeinflussen, wo produziert wird.
  - frage: finanzierung-kostenanstieg
    grund: Höhere Preise für mehr Versorgungssicherheit erhöhen die Ausgaben.
parteien:
  - partei: Grüne
    option: produktion-europa
    beleg: Angesichts instabiler Lieferketten wollen wir, dass wichtige Arzneimittelwirkstoffe wieder stärker in Deutschland oder Europa produziert werden. Bei unverzichtbaren Medikamenten der Grund- und Notfallversorgung ist es unser Ziel, bessere Vergütungsregelungen zu etablieren.
    seite: "89"
    quelle: wahlprogramm-2025-gruene
  - partei: SPD
    option: produktion-europa
    beleg: "Außerdem wollen wir für eine stärkere Produktion von Arzneimitteln in Deutschland und Europa sorgen: Krankenkassen sollen zusammen mit anderen nationalen und europäischen Akteuren größere Mengen an Therapien über längere Zeiträume einkaufen dürfen, wenn diese bei uns hergestellt werden."
    seite: "30"
    quelle: wahlprogramm-2025-spd
