bereich: arzneimittel
reihenfolge: 2
status: entwurf
stand: "2026-11-25"
titel: Was tun gegen Lieferengpässe bei Medikamenten?
frage: Immer wieder fehlen in Apotheken gängige Medikamente wie Antibiotika oder Psychopharmaka. Was soll vor allem dagegen helfen?
optionen:
  - id: produktion-europa
    titel: Produktion nach Europa holen
    kurz: Herstellung wichtiger Wirkstoffe in Europa wird gezielt gefördert – auch wenn Medikamente dadurch teurer werden.
    pro:
      - typ: position
        wer: Zentralinstitut für die kassenärztliche Versorgung (Zi)
        text: Ein zentraler Grund für Engpässe sei die starke Konzentration der Wirkstoffproduktion auf wenige Hersteller, vor allem in China und Indien. Probleme dort machten sich schnell in deutschen Apotheken bemerkbar.
        quellen: [zi-lieferengpaesse-2026]
      - typ: wertung
        text: Mehr Hersteller an mehr Orten machen die Versorgung unabhängiger von einzelnen Fabriken, Ländern und Handelskonflikten.
      - typ: fakt
        text: Die EU hat sich im Mai 2026 vorläufig auf einen **Critical Medicines Act** geeinigt. Er verbindet Regeln mit Industriepolitik, etwa staatlichen Beihilfen und gemeinsamer Beschaffung, für über 200 kritische Wirkstoffe.
        quellen: [ema-cma-2026]
    contra:
      - typ: wertung
        text: Produktion in Europa ist teurer. Das erhöht die Ausgaben der Krankenkassen oder erfordert Subventionen.
      - typ: wertung
        text: Neue Fabriken brauchen Jahre. Kurzfristig ändert sich an der Versorgung wenig.
      - typ: wertung
        text: Auch europäische Hersteller sind auf Vorprodukte aus aller Welt angewiesen. Vollständige Unabhängigkeit ist kaum erreichbar.
    gewinnt: [Versorgungssicherheit, Industriestandort Europa]
    kostet: [Beitragszahlende, Steuerzahlende, Günstige Preise]
  - id: vorraete-meldepflichten
    titel: Vorräte und Frühwarnung ausbauen
    kurz: Hersteller, Großhandel und Apotheken müssen mehr vorrätig halten; Engpässe sollen über Meldepflichten früher erkannt werden.
    pro:
      - typ: wertung
        text: Vorräte überbrücken kurzfristige Ausfälle, bis andere Hersteller einspringen.
      - typ: position
        wer: Zentralinstitut für die kassenärztliche Versorgung (Zi)
        text: Ein Frühwarnsystem solle sicherstellen, dass Informationen über Produktionsausfälle in Asien die Verantwortlichen in Deutschland erreichen, bevor Hersteller nicht mehr liefern können.
        quellen: [zi-lieferengpaesse-2026]
      - typ: wertung
        text: Vorräte und Meldepflichten lassen sich vergleichsweise schnell umsetzen.
    contra:
      - typ: wertung
        text: Lagerhaltung kostet Geld, und Medikamente können verfallen.
      - typ: wertung
        text: Vorräte helfen bei kurzen Engpässen, nicht aber, wenn ein Wirkstoff über Monate weltweit knapp ist.
      - typ: position
        wer: Zentralinstitut für die kassenärztliche Versorgung (Zi)
        text: Das Gesetz gegen Lieferengpässe von 2023 habe nach Auskunft der Krankenkassen außer höheren Kosten keine spürbaren Verbesserungen gebracht.
        quellen: [zi-lieferengpaesse-2026]
    gewinnt: [Kurzfristige Versorgungssicherheit, Transparenz]
    kostet: [Hersteller und Großhandel, Lagerkosten]
  - id: markt-rabattvertraege
    titel: Markt und Rabattverträge im Kern belassen
    kurz: Krankenkassen schließen weiter Rabattverträge mit Herstellern; staatliche Eingriffe bleiben auf einzelne Problemfälle beschränkt.
    pro:
      - typ: fakt
        text: Generika (Nachahmerpräparate) decken über 80 % der verordneten Medikamente ab, kosten die GKV nach Rabatten aber nur rund 6 Cent pro Tagesdosis.
        quellen: [progenerika-zahlen-2025]
      - typ: schaetzung
        text: Ohne Generika müsste die GKV für das gleiche Versorgungsniveau nach einer Modellrechnung über 16 Mrd. € im Jahr mehr aufwenden. Dieses Geld steht für andere Leistungen zur Verfügung.
        quellen: [progenerika-zahlen-2025]
        unsicherheit: Modellrechnung des Herstellerverbands.
      - typ: wertung
        text: Engpässe haben viele Ursachen, etwa schwankende Nachfrage oder Qualitätsprobleme. Höhere Preise allein garantieren keine Lieferfähigkeit.
    contra:
      - typ: position
        wer: Pro Generika (Verband der Generikahersteller)
        text: Rabattverträge, Festbeträge und Preismoratorium hielten die Preise dauerhaft niedrig. Bei zentralen Wirkstoffen wie Amoxicillin, Metformin oder Tamoxifen konzentriere sich die Versorgung deshalb auf wenige Anbieter.
        quellen: [progenerika-zahlen-2025]
      - typ: wertung
        text: Wenn ein Rabattvertrag nur an einen oder wenige Anbieter geht, fehlt bei deren Ausfall schnell der Ersatz.
      - typ: wertung
        text: Engpässe belasten Patienten, Ärzte und Apotheken, die nach Alternativen suchen müssen.
    gewinnt: [Beitragszahlende, Niedrige Arzneimittelpreise]
    kostet: [Vielfalt der Anbieter, Möglicherweise Versorgungssicherheit]
erklaerung:
  - typ: fakt
    text: Ein **Lieferengpass** liegt vor, wenn ein Medikament länger als zwei Wochen nicht oder nur eingeschränkt lieferbar ist. Das ist kein Einzelfall – 2025 wurden rund tausend Engpässe gemeldet.
    quellen: [zi-lieferengpaesse-2026]
    genau: 2025 gingen beim Bundesinstitut für Arzneimittel und Medizinprodukte (BfArM) 1.514 Meldungen zu 1.041 Lieferengpässen ein.
  - typ: fakt
    text: Betroffen sind auch weit verbreitete Mittel wie Antibiotika, Cholesterinsenker, das Asthmamittel Salbutamol und Psychopharmaka. Manche Engpässe dauern Monate, bei Antipsychotika im Schnitt mehr als ein halbes Jahr.
    quellen: [zi-lieferengpaesse-2026]
    genau: 'Durchschnittliche Dauer 2025: Antipsychotika 230 Tage, Cholesterinsenker 156 Tage, Antibiotika 122 Tage, Antidepressiva 107 Tage.'
  - typ: fakt
    text: Den Großteil der Versorgung tragen **Generika**, also Nachahmerprodukte ohne Patentschutz. Sie machen mehr als vier von fünf Verordnungen aus, aber nur einen kleinen Bruchteil der Ausgaben.
    quellen: [progenerika-zahlen-2025]
    genau: 'Generika 2025: über 80 % der Verordnungen, rund 6 % der Arzneimittelausgaben der GKV. Eine Tagesdosis kostet nach Rabatten im Schnitt rund 6 Cent (Angabe des Herstellerverbands Pro Generika).'
  - typ: fakt
    text: 'Dahinter stehen unter anderem **Rabattverträge**: Krankenkassen schreiben Generika aus, und der Preis ist dabei oft entscheidend. Geht ein Vertrag nur an einen oder wenige Anbieter, fehlt bei deren Ausfall schnell der Ersatz.'
    quellen: [progenerika-zahlen-2025]
  - typ: fakt
    text: Das Lieferengpassgesetz von 2023 setzt an mehreren Stellen an – bei Vorräten, bei den Preisregeln für Kinderarzneimittel und bei europäischer Produktion von Antibiotika.
    quellen: [bmg-albvvg-2023]
    genau: 'ALBVVG: Hersteller müssen bei Rabattarzneimitteln sechs Monate Vorrat halten. Für Kinderarzneimittel entfielen Festbeträge und Rabattverträge. Bei Antibiotika müssen Ausschreibungen Produktion in der EU zusätzlich berücksichtigen.'
  - typ: wertung
    text: 'Niedrige Preise sparen Beitragsgeld. Sie machen es für Hersteller aber weniger attraktiv, Vorräte, zusätzliche Kapazitäten oder Produktion in Europa vorzuhalten. Umstritten ist, wie viel der Engpässe sich so erklärt und ob höhere Preise, strengere Vorgaben oder europäische Lösungen am meisten helfen.'
zielkonflikte:
  - typ: wertung
    text: '**Niedrige Preise gegen sichere Versorgung:** Günstige Generika entlasten die Beitragszahler, machen die Produktion in Europa aber oft unwirtschaftlich.'
  - typ: wertung
    text: '**Schnelle gegen dauerhafte Lösungen:** Vorräte helfen sofort, neue Produktion erst nach Jahren.'
  - typ: wertung
    text: '**National gegen europäisch:** Deutschland allein hat wenig Marktmacht; europäische Lösungen brauchen Abstimmung und Zeit.'
