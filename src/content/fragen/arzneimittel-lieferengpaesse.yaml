      text: Lagerpflichten, Lockerung der Preisregeln für Kinderarzneimittel, Berücksichtigung europäischer Produktion bei Antibiotika und ein Frühwarnsystem beim BfArM.
      quellen: [bmg-albvvg-2023]
    - jahr: "2026"
      titel: Einigung auf den Critical Medicines Act
      text: Europäisches Parlament und Rat einigen sich vorläufig auf ein Gesetz, das die Versorgung mit kritischen Arzneimitteln in der EU stärken soll.
      quellen: [ema-cma-2026]
  bilanz:
    - typ: position
