geschichte:
  ereignisse:
    - jahr: "2019"
      titel: Konzept „Sockel-Spitze-Tausch“
      text: Ein Gutachten im Auftrag der Initiative Pro-Pflegereform stellt die Idee ausführlich vor, die Rollen von Versicherung und Eigenanteil umzukehren. 2025 wird sie zu einem Konzept mit begrenztem Sockel und Höchstbetrag weiterentwickelt.
      quellen: [rothgang-aapv-2025]
    - jahr: "2023"
      titel: Vorschlag einer Pflichtzusatzversicherung
      text: Ein vom PKV-Verband initiierter Expertenrat schlägt eine verpflichtende, kapitalgedeckte „Pflege+ Versicherung“ vor.
      quellen: [expertenrat-pflegefinanzen-2023]
    - jahr: "2026"
      titel: Pflegeneuordnungsgesetz im Kabinett
      text: Die Bundesregierung beschließt einen Gesetzentwurf ohne Deckel. Die Länder sollen Investitionskosten übernehmen; eine Kommission soll weitere Vorschläge erarbeiten, auch zu einem Deckel.
      quellen: [bundesregierung-pnog-2026, aok-pnog-kabinett-2026]
verknuepft:
  - frage: pflege-zuhause
    grund: Was das Heim kostet, beeinflusst, ob Familien zu Hause pflegen.
  - frage: fachkraefte-pflege
    grund: Höhere Löhne für Pflegekräfte schlagen sich direkt in den Eigenanteilen nieder.
  - frage: finanzierung-versicherungssystem
    grund: Auch in der Pflege gibt es ein gesetzliches und ein privates System.
parteien:
  - partei: Die Linke
    option: vollversicherung
    beleg: Unsere solidarische Pflegevollversicherung soll alle pflegerischen Leistungen abdecken. Menschen mit Pflegebedarf und ihre Familien zahlen häufig mehr als 3.000 Euro im Monat für einen Heimplatz – das würde dann entfallen.
    seite: "18"
    quelle: wahlprogramm-2025-die-linke
  - partei: SPD
    option: eigenanteil-deckeln
    beleg: Die hohen Eigenanteile bei den Pflegekosten in der stationären Langzeitpflege wollen wir durch eine Begrenzung auf 1.000 Euro pro Monat (sogenannter Pflegekosten-Deckel) maßgeblich reduzieren.
    seite: "31"
    quelle: wahlprogramm-2025-spd
