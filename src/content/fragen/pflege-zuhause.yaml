bereich: pflege
reihenfolge: 2
status: entwurf
stand: "2026-11-25"
titel: Was soll in der Pflege zu Hause gestärkt werden?
frage: Die meisten Pflegebedürftigen werden zu Hause versorgt, oft von Angehörigen. Wo soll zusätzliches Geld vor allem hinfließen?
kurzfrage: Die meisten Pflegebedürftigen leben zu Hause. Wo soll mehr Geld hin?
kurz_erklaert:
  - typ: fakt
    text: Mehr als vier von fünf Pflegebedürftigen leben zu Hause, die meisten werden von der eigenen Familie versorgt.
    quellen: [destatis-pflegestatistik-2023]
  - typ: fakt
    text: Wer im Beruf kürzertritt, um zu pflegen, verliert Einkommen. Einen Lohnersatz wie das Elterngeld gibt es dafür nicht.
    quellen: [beirat-familienpflegegeld-2022]
  - typ: wertung
    text: "Streit gibt es darüber, wo zusätzliches Geld am meisten hilft: bei den Angehörigen, bei Pflegediensten oder als freies Budget für Familien."
optionen:
  - id: angehoerige-lohnersatz
    titel: Lohnersatz für pflegende Angehörige
    kurz: Wer für die Pflege eines Angehörigen im Beruf kürzertritt, bekommt einen Lohnersatz, ähnlich dem Elterngeld.
    pro:
      - typ: position
        wer: Unabhängiger Beirat für die Vereinbarkeit von Pflege und Beruf
        text: Empfohlen werden eine Entgeltersatzleistung „analog dem Elterngeld“ und eine Freistellung von bis zu 36 Monaten. Bisher gibt es für längere Freistellungen nur ein zinsloses Darlehen.
        quellen: [beirat-familienpflegegeld-2022]
      - typ: wertung
        text: Angehörige leisten den größten Teil der Pflege. Ein Lohnersatz würdigt diese Arbeit und verringert das Risiko, später im Alter arm zu sein.
      - typ: wertung
        text: Wer nicht ganz aus dem Beruf aussteigen muss, bleibt dem Arbeitsmarkt erhalten.
    contra:
      - typ: wertung
        text: Ein Lohnersatz kostet viel Geld. Offen ist, ob die Pflegeversicherung, der Bund oder die Arbeitgeber ihn bezahlen sollen.
      - typ: wertung
        text: Er kann den Anreiz verstärken, dass vor allem Frauen ihre Arbeitszeit verringern. Das hat Folgen für ihre Karriere und ihre Rente.
      - typ: wertung
        text: Arbeitgeber, besonders kleine Betriebe, müssen längere Ausfälle überbrücken, obwohl Fachkräfte ohnehin knapp sind.
    gewinnt: [pflegende Angehörige, Vereinbarkeit von Pflege und Beruf]
    kostet: [Beitrags- oder Steuerzahlende, Arbeitgeber, kleine Betriebe]
    kurz_pro: Pflegende verlieren weniger Einkommen und bleiben im Beruf.
    kurz_contra: Kostet viel; vor allem Frauen könnten ihre Arbeitszeit länger verringern.
  - id: profis-ausbauen
    titel: Mehr Pflegedienste und Tagespflege
    kurz: Ambulante Pflegedienste sowie Tages- und Kurzzeitpflege werden ausgebaut, damit Angehörige entlastet werden und weiter arbeiten können.
    pro:
      - typ: wertung
        text: Fachkräfte sichern die Qualität der Pflege, gerade bei komplexen Pflegesituationen.
      - typ: wertung
        text: Tages- und Kurzzeitpflege entlasten Angehörige, ohne dass sie ihren Beruf aufgeben müssen.
      - typ: wertung
        text: Viele Pflegebedürftige haben keine Angehörigen in der Nähe. Für sie sind professionelle Angebote die einzige Alternative zum Heim.
    contra:
      - typ: wertung
        text: Es fehlen schon heute Pflegekräfte. Mehr Geld allein schafft nicht automatisch mehr Angebote, besonders auf dem Land.
      - typ: wertung
        text: Professionelle Pflege ist teurer als Pflege durch Angehörige. Die Ausgaben der Pflegeversicherung steigen dadurch.
      - typ: wertung
        text: Viele Pflegebedürftige möchten lieber von vertrauten Menschen gepflegt werden.
    gewinnt: [Pflegebedürftige ohne Angehörige, erwerbstätige Angehörige, Pflegequalität]
    kostet: [Beitragszahlende, ohnehin knappe Pflegekräfte]
    kurz_pro: Fachkräfte sichern die Qualität und entlasten berufstätige Angehörige.
    kurz_contra: Pflegekräfte fehlen schon heute; mehr Geld schafft nicht automatisch Angebote.
  - id: budget-flexibel
    titel: Flexibles Budget für Familien
    kurz: Die verschiedenen Leistungen werden zu einem Budget zusammengefasst, das Familien nach eigenem Bedarf einsetzen können.
    pro:
      - typ: wertung
        text: Familien wissen selbst am besten, welche Hilfe sie brauchen. Ein Budget gibt ihnen mehr Wahlfreiheit.
      - typ: wertung
        text: Heute gibt es viele einzelne Töpfe mit eigenen Regeln. Ein Budget ist einfacher und weniger bürokratisch.
      - typ: fakt
        text: Verhinderungs- und Kurzzeitpflege sind bereits in einem gemeinsamen Jahresbetrag von bis zu 3.539 € zusammengefasst, den Familien flexibel nutzen können.
        quellen: [bmg-leistungsbetraege-2026]
    contra:
      - typ: wertung
        text: Ohne Beratung und Kontrolle ist schwer zu prüfen, ob das Geld wirklich in gute Pflege fließt.
      - typ: wertung
        text: Mehr Geldleistungen können Angebote von Fachkräften verdrängen, wenn Familien das Geld anders einsetzen.
      - typ: wertung
        text: Ein Budget verteilt das vorhandene Geld nur neu. Es löst nicht das Problem steigender Kosten.
    gewinnt: [Wahlfreiheit der Familien, weniger Bürokratie]
    kostet: [Kontrolle über die Mittelverwendung, möglicherweise professionelle Anbieter]
    kurz_pro: Familien wählen selbst, welche Hilfe sie brauchen; weniger Bürokratie.
    kurz_contra: Schwer zu prüfen, ob das Geld in gute Pflege fließt.
erklaerung:
  - typ: fakt
    text: Pflege findet vor allem zu Hause statt. Mehr als vier von fünf Pflegebedürftigen leben nicht im Heim.
    quellen: [destatis-pflegestatistik-2023]
    genau: Ende 2023 waren rund 5,7 Millionen Menschen pflegebedürftig. 4,9 Millionen (86 %) wurden zu Hause versorgt.
  - typ: fakt
    text: Die größte Last tragen Angehörige. Mehr als die Hälfte aller Pflegebedürftigen bekommt nur Pflegegeld und wird meist ohne Pflegedienst von der Familie versorgt.
    quellen: [destatis-pflegestatistik-2023]
    genau: 3,1 Millionen bekamen Ende 2023 nur Pflegegeld. 1,1 Millionen wurden ganz oder teilweise von ambulanten Diensten versorgt.
  - typ: fakt
    text: Die Pflegeversicherung zahlt entweder Geld an die Pflegebedürftigen, das meist an die pflegende Familie weitergeht (Pflegegeld), oder sie bezahlt den Einsatz eines Pflegedienstes (Pflegesachleistung). Für den Pflegedienst stellt sie mehr als doppelt so viel Geld bereit.
    quellen: [bmg-leistungsbetraege-2026]
    genau: '2026: Pflegegeld je nach Pflegegrad 347 € bis 990 € im Monat (Pflegegrad 3: 599 €), Pflegesachleistungen je nach Pflegegrad mit Höchstbeträgen von 796 € bis 2.299 € (Pflegegrad 3: bis zu 1.497 €). Dazu kommen ein Entlastungsbetrag von 131 € im Monat und Leistungen für Tagespflege.'
  - typ: fakt
    text: Wer im Beruf kürzertritt, um zu pflegen, verliert Einkommen. Einen Lohnersatz wie beim Elterngeld gibt es dafür nicht, nur ein zinsloses Darlehen.
    quellen: [beirat-familienpflegegeld-2022]
  - typ: fakt
    text: Das Pflegeneuordnungsgesetz der Bundesregierung setzt vor allem auf Angebote vor Ort, mit einem neuen **Sozialraumbudget** und fachlicher Pflegebegleitung. Es ist noch nicht in Kraft.
    quellen: [bundesregierung-pnog-2026]
    genau: Kabinettsbeschluss im September 2026.
  - typ: wertung
    text: 'Der Streit dreht sich darum, wo zusätzliches Geld am meisten bewirkt: direkt bei den pflegenden Angehörigen, bei professionellen Diensten oder bei Angeboten vor Ort, die beide entlasten. Weil Familien den größten Teil der Pflege leisten, geht es dabei auch um Beruf und Einkommen der Pflegenden.'
zielkonflikte:
  - typ: wertung
    text: '**Familie gegen Fachkraft:** Geld für Angehörige stärkt die familiäre Pflege, Geld für Dienste stärkt die professionelle Pflege. Beides gleichzeitig voll auszubauen, ist teuer.'
  - typ: wertung
    text: '**Wahlfreiheit gegen Qualitätssicherung:** Je freier Familien über Geld verfügen, desto schwerer ist zu sichern, dass es in gute Pflege fließt.'
  - typ: wertung
    text: '**Vereinbarkeit gegen Gleichstellung:** Lohnersatz erleichtert die Pflege, kann aber alte Rollenmuster verfestigen.'
