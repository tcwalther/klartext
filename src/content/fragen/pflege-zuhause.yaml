geschichte:
  ereignisse:
    - jahr: "2022"
      titel: Empfehlung für ein Familienpflegegeld
      text: Der Unabhängige Beirat für die Vereinbarkeit von Pflege und Beruf empfiehlt eine Lohnersatzleistung nach dem Vorbild des Elterngeldes.
      quellen: [beirat-familienpflegegeld-2022]
    - jahr: "2026"
      titel: Pflegeneuordnungsgesetz im Kabinett
      text: Der Entwurf setzt auf neue Budgets und Pflegebegleitung. Kürzungen bei der Rente pflegender Angehöriger, die in einem früheren Entwurf vorgesehen waren, sind nicht mehr enthalten.
      quellen: [bundesregierung-pnog-2026, aok-pnog-kabinett-2026]
verknuepft:
  - frage: pflege-eigenanteile
    grund: Steigende Heimkosten machen die Pflege zu Hause für viele Familien wichtiger.
  - frage: fachkraefte-pflege
    grund: Ambulante Dienste brauchen Pflegekräfte, die knapp sind.
  - frage: digitalisierung-telemedizin
    grund: Digitale Angebote könnten Pflege zu Hause unterstützen.
parteien:
  - partei: CDU/CSU
    option: budget-flexibel
    beleg: Wir stellen die häusliche Pflegesituation in den Mittelpunkt und wollen die Vereinbarkeit von Pflege und Beruf stärken. Wir wollen mehr Vereinfachung mit einem Pflegebudget erreichen, das flexibel für pflegerische Leistungen eingesetzt werden kann.
    seite: "69"
    quelle: wahlprogramm-2025-cdu-csu
  - partei: Die Linke
    option: profis-ausbauen
    beleg: Die größte Entlastung sowohl für Menschen mit Pflegebedarf als auch für ihre pflegenden Angehörigen sind Angebote einer wohnortnahen, nichtkommerziellen und von einer solidarischen Pflegevollversicherung abgedeckten professionellen Tages- und Kurzzeitpflege sowie andere unbürokratisch zugängliche Hilfen.
    seite: "20"
    quelle: wahlprogramm-2025-die-linke
  - partei: SPD
    option: angehoerige-lohnersatz
    beleg: Wir werden uns für mehr Zeitsouveränität für alle pflegenden Angehörigen und nahestehenden Personen durch die Familienpflegezeit und das Familienpflegegeld – analog zum Elterngeld – einsetzen.
    seite: "31"
    quelle: wahlprogramm-2025-spd
