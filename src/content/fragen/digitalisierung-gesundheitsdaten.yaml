bereich: digitalisierung
reihenfolge: 1
status: entwurf
stand: "2026-11-25"
titel: Elektronische Patientenakte und Forschungsdaten
frage: Sollen Gesundheitsdaten in der elektronischen Patientenakte automatisch gespeichert und für Forschung genutzt werden, solange man nicht widerspricht – oder nur mit ausdrücklicher Zustimmung?

optionen:
  - id: opt-out
    titel: Widerspruchslösung wie heute
    kurz: Jede und jeder gesetzlich Versicherte hat eine ePA, und pseudonymisierte Daten gehen an die Forschung – außer man widerspricht.
    pro:
      - typ: wertung
        text: Eine Akte nützt nur, wenn fast alle sie haben. Dann sehen Ärztinnen, Kliniken und Apotheken wichtige Befunde und Medikamente auf einen Blick.
      - typ: wertung
        text: Forschung mit Daten fast aller Versicherten ist aussagekräftiger. Seltene Nebenwirkungen oder Versorgungslücken fallen eher auf.
      - typ: fakt
        text: In einer Befragung im Auftrag der Bundesdatenschutzbeauftragten wollten bis zu neun von zehn Versicherten ihre ePA behalten. Mehr als zwei Drittel würden pseudonymisierte Daten für die Forschung bereitstellen.
        quellen: [aerzteblatt-datenbarometer-2026]
    contra:
      - typ: wertung
        text: Wer sich nicht aktiv kümmert, gibt Daten frei, ohne bewusst entschieden zu haben. Gerade bei sehr sensiblen Daten ist das aus Sicht vieler zu wenig.
      - typ: fakt
        text: Sicherheitsforscher des Chaos Computer Clubs zeigten Ende 2024 Lücken, über die sich Unbefugte Zugriff auf Akten verschaffen konnten. Die gematik nannte die Angriffe technisch möglich, aber in der Praxis unwahrscheinlich.
        quellen: [heise-ccc-2024]
    gewinnt: [Behandlungssicherheit, Forschung, Menschen mit vielen Ärzten und Medikamenten]
    kostet: [ausdrückliche Selbstbestimmung, Datenschutz (Restrisiko)]

  - id: opt-in
    titel: Nur mit Zustimmung
    kurz: Eine ePA wird nur angelegt und Daten fließen nur in die Forschung, wenn Versicherte ausdrücklich zustimmen.
    pro:
      - typ: wertung
        text: Gesundheitsdaten gehören zu den sensibelsten Informationen überhaupt. Wer sie teilt, sollte das bewusst tun.
      - typ: wertung
        text: Eine echte Zustimmung schafft Vertrauen. Wer zustimmt, nutzt die Akte vermutlich auch aktiv.
    contra:
      - typ: wertung
        text: Ohne Automatik melden sich erfahrungsgemäß nur wenige aktiv an – auch heute haben sich nur rund 8 Prozent in der Kassen-App registriert. Eine Akte, die kaum jemand hat, hilft Ärztinnen und Ärzten wenig.
      - typ: wertung
        text: Forschung mit Daten nur von Freiwilligen kann verzerrt sein, weil bestimmte Gruppen seltener zustimmen.
    gewinnt: [informationelle Selbstbestimmung, Vertrauen der Skeptischen]
    kostet: [Verbreitung der ePA, Aussagekraft der Forschung]

  - id: breiter-nutzen
    titel: Daten breiter nutzbar machen
    kurz: Pseudonymisierte Daten stehen nach festen Regeln auch Unternehmen offen, etwa für die Entwicklung von Medikamenten oder KI – mit Widerspruchsrecht wie im europäischen Gesundheitsdatenraum.
    pro:
      - typ: position
        wer: Verband Forschender Arzneimittelhersteller (vfa)
        text: Zugang zu Gesundheitsdaten sei ein Standortfaktor. Gewerbliche Forschung solle gleichberechtigt Anträge stellen können.
        quellen: [vfa-gesundheitsdaten]
      - typ: wertung
        text: Neue Medikamente und Diagnosehilfen entstehen oft in Unternehmen. Gute Daten können sie schneller und sicherer machen.
    contra:
      - typ: wertung
        text: Daten, die Versicherte für das Gemeinwohl teilen, würden auch für Gewinnzwecke genutzt. Viele empfinden das als Vertrauensbruch.
      - typ: wertung
        text: Je mehr Stellen Zugriff haben, desto größer ist das Risiko von Missbrauch oder einer Rückverfolgung zu Einzelnen.
    gewinnt: [Unternehmen und Forschungsstandort, medizinische Innovation]
    kostet: [Vertrauen in die Zweckbindung, Datenschutz]

erklaerung:
  - typ: fakt
    text: Die **elektronische Patientenakte (ePA)** ist eine digitale Akte mit Befunden, Arztbriefen und Medikamenten. Seit dem 15. Januar 2025 bekommen alle gesetzlich Versicherten eine, sofern sie nicht widersprechen. Widersprechen geht jederzeit.
    quellen: [bmg-digig-faq]
  - typ: fakt
    text: Bis Ende September 2025 wurden rund 70 Millionen Akten angelegt. Vor dem Start hatten laut GKV-Spitzenverband durchschnittlich gut fünf Prozent widersprochen.
    quellen: [gematik-epa-zahlen-2025, aok-widerspruch-2025]
  - typ: fakt
    text: Aktiv genutzt wird die Akte über die Kassen-App von wenigen. Laut gematik haben sich rund 8 Prozent der Versicherten registriert (etwa 5,85 Millionen).
    quellen: [aerzteblatt-datenbarometer-2026]
  - typ: fakt
    text: Ab Oktober 2026 werden ePA-Daten pseudonymisiert an das **Forschungsdatenzentrum Gesundheit** beim BfArM weitergeleitet, wenn man nicht widerspricht. Pseudonymisiert heißt, der Name wird durch einen Code ersetzt. Forschende – auch aus Unternehmen – können die Daten ab 2027 für festgelegte Gemeinwohl-Zwecke beantragen, nicht für Marketing.
    quellen: [bmg-fdz-faq]
  - typ: fakt
    text: Der **Europäische Gesundheitsdatenraum (EHDS)** ist seit März 2025 in Kraft und gilt schrittweise. Er sieht für die Forschungsnutzung ein verpflichtendes Widerspruchsrecht vor, mit möglichen Ausnahmen.
    quellen: [bmg-ehds]

zielkonflikte:
  - typ: wertung
    text: Nutzen für alle steht gegen Kontrolle durch den Einzelnen. Je mehr Daten fließen, desto größer der Nutzen – und desto schwerer zu überblicken, wer was sieht.
  - typ: wertung
    text: Hohe Hürden schützen die Privatsphäre, können aber dazu führen, dass Forschung und Versorgung im Ausland schneller vorankommen.
  - typ: wertung
    text: Wer Unternehmen ausschließt, schützt die Zweckbindung, verzichtet aber womöglich auf Innovationen, die gerade dort entstehen.

