geschichte:
  ereignisse:
    - jahr: "2023"
      titel: Wechsel zur Widerspruchslösung beschlossen
      text: Der Bundestag beschloss das Digital-Gesetz und das Gesundheitsdatennutzungsgesetz. Damit wurde die ePA von der Zustimmungs- auf die Widerspruchslösung umgestellt.
      quellen: [bmg-digitalgesetze-2023]
    - jahr: "2025"
      titel: ePA für alle
      text: Seit dem 15. Januar 2025 legen die Kassen für alle Versicherten ohne Widerspruch eine ePA an.
      quellen: [bmg-digig-faq]
    - jahr: "2026"
      titel: Daten für die Forschung
      text: Im Oktober 2026 startete die Weiterleitung von ePA-Daten an das Forschungsdatenzentrum, nach einer sechswöchigen Widerspruchsfrist stufenweise ab Mitte Dezember.
      quellen: [bmg-fdz-faq]

laender:
  beispiele:
    - land: Finnland
      ansatz: Zentrale Genehmigungsstelle Findata für Gesundheits- und Sozialdaten (Gesetz seit 2019)
      text: Findata erteilt Genehmigungen für Forschung, Statistik, Behördenaufgaben und auch Entwicklung und Innovation. Für Entwicklung ohne wissenschaftliche Forschung gibt es nur zusammengefasste Daten, aus denen niemand erkennbar ist. Marketing und die Berechnung von Versicherungsprämien sind ausgeschlossen. Registerforschung läuft ohne gesonderte Einwilligung.
      vergleichbarkeit: mittel
      vergleichbarkeit_text: Finnland hat seit Langem zentrale Register und eine einheitliche Patientenakte. Deutschland baut beides erst auf, und das Vertrauen in staatliche Datennutzung ist hier anders verteilt.
      quellen: [stm-findata]

verknuepft:
  - frage: digitalisierung-telemedizin
    grund: Digitale Ersteinschätzung und Terminvermittlung sollen künftig in die ePA eingebunden werden.
  - frage: praevention-anreize
    grund: Verhaltensbezogene Tarife würden Gesundheitsdaten voraussetzen.
  - frage: arzneimittel-preise
    grund: Versorgungsdaten spielen eine Rolle bei der Bewertung des Nutzens neuer Medikamente.

