bereich: fachkraefte
reihenfolge: 1
status: entwurf
stand: "2026-11-25"
titel: Wie gewinnt man genug Pflegekräfte?
frage: Worauf soll die Politik vor allem setzen, damit es in Krankenhäusern, Heimen und zu Hause genug Pflegekräfte gibt?
kurzfrage: Es fehlen Pflegekräfte. Was hilft am meisten?
kurz_erklaert:
  - typ: fakt
    text: In der Pflege arbeiten heute gut ein Fünftel mehr Menschen als vor zehn Jahren. Viele Neue kommen aus dem Ausland.
    quellen: [ba-pflege-2025]
  - typ: schaetzung
    text: Trotzdem dürfte es nicht reichen. Der Pflegebedarf steigt um rund ein Drittel, und viele Pflegekräfte gehen selbst in Rente.
    quellen: [destatis-pflegekraefte-2024]
    unsicherheit: Modellrechnung („Wenn-dann-Aussage“); die Spanne hängt davon ab, ob sich der Zuwachs der 2010er-Jahre fortsetzt.
  - typ: wertung
    text: "Gestritten wird darüber, was mehr hilft: zusätzliche Köpfe durch Anwerbung und Ausbildung oder bessere Bedingungen, damit Pflegekräfte bleiben."

optionen:
  - id: bezahlung
    titel: Bessere Löhne und Arbeitsbedingungen
    kurz: Höhere Löhne, verlässliche Dienstpläne und weniger Überlastung sollen mehr Menschen in den Beruf holen und dort halten.
    pro:
      - typ: wertung
        text: Viele ausgebildete Pflegekräfte arbeiten in Teilzeit oder haben den Beruf verlassen. Bessere Bedingungen könnten einen Teil von ihnen zurückholen. Das wirkt schneller als eine neue Ausbildung.
      - typ: wertung
        text: Ein attraktiver Beruf zieht auch mehr junge Menschen an. Das sichert den Nachwuchs langfristig.
    contra:
      - typ: wertung
        text: Höhere Löhne kosten Geld, das über Krankenkassenbeiträge, die Pflegeversicherung oder Eigenanteile im Heim aufgebracht wird.
      - typ: fakt
        text: Die Löhne sind bereits deutlich gestiegen. Fachkräfte in der Altenpflege verdienten im April 2024 im Mittel 4.228 Euro brutto im Monat (Vollzeit), 1.612 Euro mehr als zehn Jahre zuvor. Das liegt über dem Mittel aller Vollzeitbeschäftigten (3.978 Euro).
        quellen: [destatis-verdienste-pflege-2025]
      - typ: wertung
        text: Wenn die Löhne schon über dem mittleren Verdienst aller Beschäftigten liegen, löst noch mehr Geld allein den Mangel womöglich nicht.
    gewinnt: [Pflegekräfte, Pflegequalität]
    kostet: [Beitragszahler, Pflegebedürftige (Eigenanteile)]
    kurz_pro: Kann Ausgestiegene zurückholen; das wirkt schneller als Ausbildung.
    kurz_contra: Kostet Beitragszahler und Heimbewohner; die Löhne sind schon stark gestiegen.

  - id: anwerbung
    titel: Pflegekräfte aus dem Ausland
    kurz: Pflegekräfte aus anderen Ländern werden aktiv angeworben und beim Ankommen unterstützt; ihre Abschlüsse werden schneller anerkannt.
    pro:
      - typ: fakt
        text: Die Zahl der Anerkennungen wächst bereits stark. 2025 wurden 32.000 ausländische Pflegeabschlüsse als gleichwertig anerkannt, so viele wie in keinem anderen Beruf.
        quellen: [destatis-anerkennung-2026]
      - typ: wertung
        text: Anwerbung wirkt schneller als eine dreijährige Ausbildung im Inland.
    contra:
      - typ: wertung
        text: Herkunftsländer verlieren Fachkräfte, die sie selbst brauchen.
      - typ: wertung
        text: Sprache, Anerkennung und Einarbeitung kosten Zeit. Wer sich nicht willkommen fühlt, zieht weiter oder kehrt zurück.
    gewinnt: [Krankenhäuser und Heime mit offenen Stellen, zugewanderte Fachkräfte]
    kostet: [Herkunftsländer, Einarbeitungsaufwand in den Teams]
    kurz_pro: Wirkt schneller als eine dreijährige Ausbildung im Inland.
    kurz_contra: Herkunftsländer verlieren Fachkräfte; Sprache und Einarbeitung brauchen Zeit.

  - id: personalbemessung
    titel: Mindestzahl an Pflegekräften
    kurz: Eine Vorgabe legt fest, wie viele Pflegekräfte für eine bestimmte Zahl und Schwere von Patienten mindestens im Dienst sein müssen.
    pro:
      - typ: position
        wer: Deutscher Berufsverband für Pflegeberufe (DBfK)
        text: Die Personalbemessung mache sichtbar, wie viel Pflege tatsächlich gebraucht werde. Ohne sie würden Engpässe „unsichtbar“, die Arbeit verdichte sich und der Beruf werde unattraktiver.
        quellen: [dbfk-ppr-2026]
      - typ: wertung
        text: Feste Vorgaben schützen Patientinnen und Pflegekräfte vor Überlastung. Das kann auch Menschen in den Beruf zurückholen.
    contra:
      - typ: wertung
        text: Personalbemessung bringt Dokumentations- und Nachweispflichten mit sich. Diese Zeit fehlt dann am Bett.
      - typ: wertung
        text: Vorgaben schaffen keine Pflegekräfte. Wo sie fehlen, müssen Kliniken Betten sperren oder Stationen schließen.
    gewinnt: [Patientensicherheit, Pflegekräfte im Dienst]
    kostet: [Flexibilität der Kliniken, Bettenkapazität bei Personalmangel, Bürokratie]
    kurz_pro: Schützt Patienten und Pflegekräfte vor Überlastung.
    kurz_contra: Schafft keine Pflegekräfte; fehlen sie, werden Betten gesperrt.

  - id: entlastung
    titel: Weniger Bürokratie, mehr Technik
    kurz: Digitale Dokumentation, Hilfsmittel und weniger Papierarbeit sollen Pflegekräften mehr Zeit für Menschen geben.
    pro:
      - typ: wertung
        text: Jede Stunde weniger Dokumentation ist eine Stunde mehr Pflege, ohne dass zusätzliches Personal nötig ist.
      - typ: fakt
        text: Das Gesetz zur Befugniserweiterung und Entbürokratisierung in der Pflege, seit dem 1. Januar 2026 in Kraft, soll Pflegeeinrichtungen von Bürokratie entlasten.
        quellen: [bundesregierung-beep-2026]
    contra:
      - typ: wertung
        text: Technik muss erst angeschafft und eingeführt werden. Das kostet anfangs Zeit und Geld.
      - typ: wertung
        text: Pflege ist Beziehungsarbeit. Den Großteil der Arbeit am Menschen kann Technik nicht ersetzen.
    gewinnt: [Pflegekräfte, Pflegebedürftige (mehr Zeit)]
    kostet: [Investitionen der Einrichtungen, Kontrolldichte]
    kurz_pro: Mehr Zeit für Pflege, ohne zusätzliches Personal.
    kurz_contra: Kostet anfangs Geld; die Arbeit am Menschen ersetzt Technik nicht.

erklaerung:
  - typ: fakt
    text: In der Pflege arbeiten heute gut ein Fünftel mehr Menschen als vor zehn Jahren. Neue Pflegekräfte kommen inzwischen vor allem aus dem Ausland.
    genau: 2024 arbeiteten rund 1,72 Millionen Menschen in Pflegeberufen, 22 Prozent mehr als zehn Jahre zuvor. Der Anteil ausländischer Beschäftigter liegt bei 18 Prozent.
    quellen: [ba-pflege-2025]
  - typ: schaetzung
    text: Trotzdem dürfte es absehbar nicht reichen, weil zwei Entwicklungen zusammenkommen. Mit der Alterung steigt der Bedarf an Pflege um rund ein Drittel. Gleichzeitig gehen viele Pflegekräfte selbst in Rente.
    genau: Das Statistische Bundesamt rechnet damit, dass 2049 zwischen 280.000 und 690.000 Pflegekräfte fehlen.
    quellen: [destatis-pflegekraefte-2024]
    unsicherheit: Modellrechnung („Wenn-dann-Aussage“); die Spanne hängt davon ab, ob sich der Zuwachs der 2010er-Jahre fortsetzt.
  - typ: fakt
    text: Die Löhne sind in den vergangenen zehn Jahren stark gestiegen. Pflegefachkräfte verdienen inzwischen mehr, als Vollzeitbeschäftigte im Mittel verdienen.
    genau: Im April 2024 verdienten Fachkräfte in der Altenpflege im Mittel (Median, Vollzeit, ohne Sonderzahlungen) 4.228 Euro brutto im Monat, 1.612 Euro mehr als zehn Jahre zuvor. In der Gesundheits- und Krankenpflege waren es 4.310 Euro, über alle Vollzeitbeschäftigten 3.978 Euro.
    quellen: [destatis-verdienste-pflege-2025]
  - typ: wertung
    text: Neben der Zahl der Köpfe zählt, wie viele Stunden Pflegekräfte arbeiten und wie lange sie im Beruf bleiben. Dort setzen Arbeitsbedingungen, Personalvorgaben und Entlastung durch Technik an. Ausbildung und Anwerbung erhöhen dagegen die Zahl der Köpfe, brauchen aber Zeit.
  - typ: fakt
    text: Der Nachwuchs wächst wieder. Die Zahl neuer Auszubildender in der Pflege ist drei Jahre in Folge gestiegen.
    genau: 2025 begannen 63.900 Menschen eine Ausbildung zur Pflegefachfrau oder zum Pflegefachmann, 8 Prozent mehr als im Vorjahr.
    quellen: [destatis-pflegeausbildung-2026]
  - typ: fakt
    text: Wie viel Personal eine Krankenhausstation haben muss, wird immer wieder neu geregelt. Eine verbindliche Personalbemessung (**PPR 2.0**) wurde eingeführt und zwei Jahre später wieder abgeschafft. Mindestbesetzungen für bestimmte Stationen gelten weiter.
    genau: Die PPR 2.0 trat im Juli 2024 in Kraft, zunächst ohne Sanktionen. Im Juli 2026 entfiel die Pflicht mit dem GKV-Beitragssatzstabilisierungsgesetz; stattdessen gilt eine allgemeine Pflicht zu einer guten Personalbesetzung. Die Pflegepersonaluntergrenzen bleiben.
    quellen: [bmg-ppbv, bmg-gkv-bstabg-2026]

zielkonflikte:
  - typ: wertung
    text: Bessere Bedingungen kosten Geld, das Versicherte und Pflegebedürftige aufbringen müssen.
  - typ: wertung
    text: Strenge Personalvorgaben schützen die Qualität, können bei Mangel aber dazu führen, dass weniger Menschen versorgt werden.
  - typ: wertung
    text: Anwerbung schließt Lücken in Deutschland, kann aber Lücken in den Herkunftsländern vergrößern.

