geschichte:
  ereignisse:
    - jahr: "1996/97"
      titel: Erste Personalregelung ausgesetzt
      text: Die damalige Pflege-Personalregelung wurde 1996 ausgesetzt und 1997 abgeschafft. Der Berufsverband DBfK sieht darin den Beginn eines starken Personalabbaus in der Krankenhauspflege.
      quellen: [dbfk-ppr-2026]
    - jahr: "2024"
      titel: PPR 2.0 eingeführt
      text: Die Pflegepersonalbemessungsverordnung trat im Juli 2024 in Kraft, zunächst ohne Sanktionen bei Unterschreitung.
      quellen: [bmg-ppbv]
    - jahr: "2026"
      titel: PPR 2.0 wieder abgeschafft
      text: Mit dem Gesetz zur Stabilisierung der Krankenkassenbeiträge entfiel die Pflicht zur Anwendung der PPR 2.0.
      quellen: [bmg-gkv-bstabg-2026, dkg-ppr-2026]

laender:
  beispiele:
    - land: Kalifornien (USA)
      ansatz: Gesetzliche Mindestbesetzung je Patient (seit 2004)
      text: Kalifornien schreibt feste Verhältnisse von Pflegekräften zu Patienten vor. Eine Auswertung zeigt, dass Kliniken, die die Werte vorher nicht erreichten, ihre Besetzung verbesserten. Messbare Verbesserungen der Patientensicherheit fand diese Studie aber nicht.
      vergleichbarkeit: gering
      vergleichbarkeit_text: Andere Ausbildung, andere Aufgabenteilung und ein anderes Krankenhaus-Finanzierungssystem. Andere Studien kommen zu günstigeren Ergebnissen; die Wirkung ist umstritten.
      quellen: [cook-staffing-2012]

verknuepft:
  - frage: fachkraefte-aufgabenteilung
    grund: Wenn Pflegekräfte mehr Aufgaben übernehmen, kann das den Bedarf an Pflegekräften weiter erhöhen oder den Beruf attraktiver machen.
  - frage: pflege-eigenanteile
    grund: Höhere Löhne in der Altenpflege schlagen auf die Eigenanteile im Heim durch.
  - frage: krankenhaus-verguetung
    grund: Wie Kliniken bezahlt werden, beeinflusst, wie viel Pflegepersonal sie einstellen.

