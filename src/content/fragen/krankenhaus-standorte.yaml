      quellen: [bbsr-erreichbarkeit-2020]
    - typ: schaetzung
      text: "Für die Region Köln/Leverkusen simulierte das IGES-Institut im Auftrag der Bertelsmann Stiftung eine Versorgung mit 14 statt 38 Akutkrankenhäusern. Die Stiftung folgerte daraus, für eine bessere Versorgung reichten bundesweit deutlich unter 600 statt knapp 1.400 Kliniken aus."
      quellen: [bertelsmann-2019]
      unsicherheit: "Modellrechnung für eine einzelne, dicht besiedelte Region. Die Übertragung auf ganz Deutschland ist eine Hochrechnung und war stark umstritten."

geschichte:
  ereignisse:
    - jahr: "1972"
      titel: Krankenhausfinanzierungsgesetz
      text: "Das Krankenhausfinanzierungsgesetz teilt die Finanzierung auf: Die Länder bezahlen die Investitionen der Krankenhäuser, die Krankenkassen die laufenden Kosten. Die Länder stellen zudem Krankenhauspläne auf."
      quellen: [gkv-sv-fokus-finanzierung, regkom-3-2022]
    - jahr: "1991–2021"
      titel: Stetiger Rückgang
      text: "Die Zahl der Häuser sinkt von 2.411 auf 1.887, die der Betten von 665.565 auf 483.606. Der Abbau geschieht meist schrittweise: durch Fusionen und durch die Schließung einzelner Abteilungen oder ganzer Häuser."
      quellen: [destatis-grunddaten-2021]
    - jahr: "2016"
      titel: Strukturfonds
      text: "Ein Fonds mit 500 Millionen Euro aus der Reserve des Gesundheitsfonds soll die Länder beim Abbau von Überkapazitäten, bei der Konzentration von Standorten und bei der Umwandlung von Krankenhäusern in nicht-stationäre Einrichtungen unterstützen."
      quellen: [khg-12]
    - jahr: "2019"
      titel: Streit um Bertelsmann-Studie
      text: "Eine Studie im Auftrag der Bertelsmann Stiftung hält deutlich unter 600 Kliniken für ausreichend. Die These löst eine heftige öffentliche Debatte über Klinikschließungen aus."
      quellen: [bertelsmann-2019]
    - jahr: "2022"
      titel: Vorschläge der Regierungskommission
      text: "Eine Expertenkommission der Bundesregierung empfiehlt bundesweit einheitliche Versorgungsstufen und genau definierte Leistungsgruppen. Nordrhein-Westfalen plant bereits mit 60 Leistungsgruppen."
      quellen: [regkom-3-2022]
    - jahr: "2024"
      titel: Krankenhausreform (KHVVG)
      text: "Das Krankenhausversorgungsverbesserungsgesetz tritt am 12. Dezember 2024 in Kraft. Es führt bundesweite Leistungsgruppen mit Qualitätskriterien, die sektorenübergreifenden Versorgungseinrichtungen und einen Transformationsfonds ein."
      quellen: [bt-drs-21-2512]
    - jahr: "2026"
      titel: Anpassung der Reform (KHAG)
      text: "Das Krankenhausreformanpassungsgesetz tritt am 15. April 2026 in Kraft. Es reduziert die Leistungsgruppen auf 61, gibt den Ländern mehr Spielraum für Ausnahmen und finanziert den Bundesanteil des Transformationsfonds aus dem Sondervermögen Infrastruktur statt aus Krankenkassengeld."
      quellen: [bmg-khag-verfahren, bmg-pm-khag-2026, bt-drs-21-2512]
  bilanz:
    - typ: fakt
      text: "Seit 1991 ist rund ein Viertel der Krankenhäuser weggefallen. Trotzdem liegt Deutschland bei der Bettendichte weiterhin weit über dem EU-Schnitt."
      quellen: [destatis-pm-2026-376, eurostat-betten-2024]
    - typ: wertung
      text: "Bisher geschah der Abbau meist ungeplant, etwa durch Insolvenzen oder Entscheidungen einzelner Träger. Die Reform von 2024/2026 ist der erste Versuch, Standorte bundesweit nach einheitlichen Qualitätskriterien zu ordnen. Wie stark sie die Landschaft tatsächlich verändert, lässt sich Ende 2026 noch nicht sagen."

laender:
  beispiele:
    - land: Dänemark
      ansatz: "Geplante Zentralisierung mit Neubau von Großkliniken"
      text: "Mit einer Verwaltungsreform 2007 übernahmen fünf Regionen die Krankenhäuser von 13 Kreisen. Ziel war, die Zahl der Krankenhäuser mit Notaufnahme von 40 auf 21 zu senken. Bis 2021 wurden 18 Krankenhäuser geschlossen, weitere neun sollten folgen. Ein Neubauprogramm mit 16 Projekten ist mit rund 6,6 Milliarden Euro ausgestattet. Nach einer Studie, die zehn Jahre nach der Reform erschien, stieg die Produktivität der Kliniken um mehr als 2 % pro Jahr, während die Kosten stabil blieben. Zugleich berichtet die Studie, dass sich Menschen in abgelegenen Gegenden abgehängt fühlen und das Personal stärker belastet ist."
      vergleichbarkeit: mittel
      vergleichbarkeit_text: "Dänemark ist klein, und dort sind die Regionen zugleich für Planung, Betrieb und Budgets der Kliniken zuständig. In Deutschland sind diese Rollen auf Länder, Kassen und viele verschiedene Träger verteilt, was einen zentral geplanten Umbau schwieriger macht."
      quellen: [dk-super-hospital-2021, christiansen-vrangbaek-2018]
    - land: Niederlande
      ansatz: "Wenige, gemeinnützige Allgemeinkrankenhäuser"
      text: "2014 gab es 85 allgemeine Krankenhäuser, 8 Universitätskliniken und 65 Fachkliniken. Mit rund 221 Krankenhausbetten je 100.000 Einwohner (2024) liegen die Niederlande bei weniger als einem Drittel des deutschen Werts."
      vergleichbarkeit: mittel
      vergleichbarkeit_text: "Die Niederlande sind dicht besiedelt, was kurze Wege auch bei wenigen Standorten erleichtert. Hausärzte steuern dort stärker, wer überhaupt ins Krankenhaus kommt, und Pflegeheime übernehmen mehr Langzeitversorgung."
      quellen: [observatory-nl-2016, eurostat-hlth-rs-bds1]
    - land: Schweiz
      ansatz: "Planung über fein definierte Leistungsgruppen"
      text: "Die Schweiz plant ihre Spitäler mit einem Modell aus über 100 Leistungsgruppen, für die jeweils Vorgaben an Personal und Technik gelten. Die Regierungskommission nannte es 2022 ausdrücklich als Beispiel für die deutschen Leistungsgruppen; Nordrhein-Westfalen arbeitet mit einer gröberen Einteilung in 60 Gruppen."
      vergleichbarkeit: hoch
      vergleichbarkeit_text: "Wie in Deutschland liegt die Planung bei den Gliedstaaten (Kantonen), und das Instrument diente als Vorlage. Die Schweiz ist aber deutlich kleiner, und ihre Spitalfinanzierung unterscheidet sich. Die Kommission betonte, das Schweizer Modell bedürfe einer grundlegenden Neubewertung für Deutschland."
      quellen: [regkom-3-2022]
