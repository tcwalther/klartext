bereich: krankenhaeuser
reihenfolge: 1
status: entwurf
stand: "2026-11-25"
titel: Wie viele Krankenhäuser und an welchen Standorten?
frage: "Soll Deutschland seine Krankenhausversorgung stärker auf weniger, spezialisierte Standorte bündeln, möglichst viele wohnortnahe Häuser erhalten oder kleine Häuser in ambulant-stationäre Versorgungszentren umwandeln?"

optionen:
  - id: buendeln
    titel: Stärker bündeln und spezialisieren
    kurz: "Komplexe und planbare Behandlungen sollen in weniger, größeren Kliniken mit viel Erfahrung stattfinden; die Grundversorgung bleibt in der Fläche."
    pro:
      - typ: schaetzung
        text: "Eine große Studie mit Daten von AOK-Versicherten und Krebsregistern ergab, dass Menschen, die bei der ersten Krebsbehandlung in einem zertifizierten Zentrum behandelt wurden, im Schnitt länger lebten. Das galt für alle elf untersuchten Krebsarten. Zertifizierte Zentren müssen unter anderem Mindestfallzahlen und feste Abläufe nachweisen."
        quellen: [wizen-2023]
        unsicherheit: "Beobachtungsstudie mit Daten von 2009 bis 2017. Sie zeigt einen Zusammenhang, keinen sicheren Ursache-Wirkungs-Beleg. Der Überlebensvorteil schwankt je nach Krebsart stark."
      - typ: position
        wer: GKV-Spitzenverband
        text: "Es gebe „zu viele Krankenhäuser mit Gelegenheitsversorgung“. Wenn Kliniken Operationen nur gelegentlich durchführten, gehe das zulasten der Qualität. Ziel müsse sein, Spezialisierung zu fördern und zugleich eine gute Grundversorgung flächendeckend zu sichern."
        quellen: [gkv-sv-pm-2025-10-08]
      - typ: wertung
        text: "Ärztinnen, Ärzte und Pflegekräfte sind knapp. Wenn sich dieselben Fachkräfte auf weniger Standorte verteilen, lassen sich Dienstpläne rund um die Uhr leichter besetzen, und die Teams gewinnen mehr Routine."
    contra:
      - typ: fakt
        text: "Schon heute sind spezialisierte Einrichtungen nicht überall schnell erreichbar: 2020 lebten rund 9 Millionen Menschen (11 %) dort, wo eine Schlaganfall-Station (Stroke Unit) mit dem Rettungsdienst nicht innerhalb von 30 Minuten erreichbar war. Das betraf vor allem den ländlichen Nordosten."
        quellen: [bbsr-erreichbarkeit-2020]
      - typ: position
        wer: Deutscher Landkreistag
        text: "Ausnahmen bei der Zuweisung von Leistungsgruppen seien gerade für Flächenländer ein wesentliches Instrument, um die stationäre Versorgung in ländlichen Regionen zu sichern. Die Reform müsse den regionalen Versorgungsrealitäten Rechnung tragen."
        quellen: [dlt-khag-2025]
      - typ: wertung
        text: "Längere Wege treffen Patientinnen und Patienten ebenso wie Angehörige, die sie besuchen. Für Menschen ohne Auto kann eine Klinik in 40 Kilometern Entfernung praktisch unerreichbar sein."
    gewinnt: [Behandlungsqualität bei komplexen Eingriffen, Fachkräfte in größeren Teams, Beitragszahler (weniger doppelte Vorhaltung)]
    kostet: [Wohnortnähe, Patienten und Angehörige in dünn besiedelten Regionen, Beschäftigte und Gemeinden an aufgegebenen Standorten]

  - id: wohnortnah-erhalten
    titel: Wohnortnahe Häuser erhalten
    kurz: "Möglichst viele Krankenhäuser mit Notaufnahme und Grundversorgung sollen bestehen bleiben; Länder sollen dafür von bundesweiten Vorgaben abweichen dürfen."
    pro:
      - typ: wertung
        text: "Bei Herzinfarkt, Schlaganfall oder Unfall zählt jede Minute. Ein Krankenhaus in der Nähe kann die Erstversorgung übernehmen und Patienten stabilisieren, bevor sie in ein Zentrum verlegt werden."
      - typ: position
        wer: Deutscher Landkreistag
        text: "Die Länder sollten bei der Krankenhausplanung eine zentrale Rolle behalten, ihre Kompetenzen seien dauerhaft zu stärken. Ausnahmen von Qualitätsvorgaben müssten in besonderen Fällen auch länger als sechs Jahre möglich sein, wenn die Versorgungsqualität nicht leidet."
        quellen: [dlt-khag-2025]
      - typ: wertung
        text: "In vielen Kleinstädten ist das Krankenhaus einer der größten Arbeitgeber und ein Ankerpunkt für Praxen, Rettungsdienst und Pflege. Fällt es weg, kann das die ganze Region schwächen."
      - typ: wertung
        text: "Mehr Standorte bedeuten mehr Reserven für Krisen wie eine Pandemie oder einen Großschadensfall."
    contra:
      - typ: fakt
        text: "Kleine Häuser sind deutlich weniger ausgelastet: 2025 waren in Krankenhäusern mit bis zu 49 Betten im Schnitt 55,2 % der Betten belegt, in Häusern mit mehr als 800 Betten 75,3 %."
        quellen: [destatis-pm-2026-376]
      - typ: position
        wer: GKV-Spitzenverband
        text: "Die Behandlungsqualität dürfe nicht davon abhängen, in welchem Bundesland jemand ins Krankenhaus kommt. Ausnahmen von Qualitäts- und Personalanforderungen dürften nicht die Regel werden."
        quellen: [gkv-sv-pm-2025-10-08, gkv-sv-pm-2026-02-27]
      - typ: wertung
        text: "Jeder Standort braucht rund um die Uhr Personal, auch wenn nachts wenige Patienten kommen. Bei Fachkräftemangel kann das an anderer Stelle fehlen."
    gewinnt: [Patienten und Angehörige auf dem Land, Gemeinden mit Krankenhausstandort, Beschäftigte vor Ort]
    kostet: [Beitragszahler (Vorhaltung vieler Standorte), Spezialisierung, knappe Fachkräfte]

  - id: umwandeln
    titel: Kleine Häuser umwandeln
    kurz: "Kleine Krankenhäuser werden zu Gesundheitszentren, die einfache stationäre Fälle, ambulante Behandlung und Pflege unter einem Dach anbieten; komplexe Fälle gehen an größere Kliniken."
    pro:
      - typ: fakt
        text: "Seit der Krankenhausreform 2024 können die Länder Standorte als **sektorenübergreifende Versorgungseinrichtung** bestimmen. Diese Einrichtungen erbringen stationäre Grundleistungen, etwa in der Inneren Medizin und der Geriatrie (Altersmedizin). Zusätzlich können sie ambulant behandeln sowie Kurzzeit-, Tages- und Nachtpflege anbieten."
        quellen: [sgb5-115g, khg-6c]
      - typ: position
        wer: Deutsche Krankenhausgesellschaft (DKG)
        text: "Diese Einrichtungen seien „regionale Gesundheitszentren“. Nötig sei ein breiter „Instrumentenkasten“, mit dem die Verantwortlichen vor Ort Lösungen für eine wohnortnahe, sektorenübergreifende Versorgung entwickeln könnten."
        quellen: [dkg-khvvg-2024]
      - typ: wertung
        text: "Der Ort behält eine Anlaufstelle mit Ärztinnen, Ärzten und Pflege. Personal und Gebäude werden weiter genutzt, statt zu verschwinden."
    contra:
      - typ: wertung
        text: "Eine Notaufnahme mit voller Ausstattung gibt es dort meist nicht mehr. Viele Menschen erleben die Umwandlung deshalb als Schließung ihres Krankenhauses."
      - typ: position
        wer: Deutsche Krankenhausgesellschaft (DKG)
        text: "Die Finanzierung der sektorenübergreifenden Versorger sei unzureichend. Wegen befristeter Versorgungsaufgaben fehle den Häusern Planungssicherheit."
        quellen: [dkg-khvvg-2024]
      - typ: wertung
        text: "Das Modell ist neu. Wie gut die Zusammenarbeit mit Arztpraxen, Pflegediensten und großen Kliniken im Alltag funktioniert, muss sich erst zeigen."
    gewinnt: [Grundversorgung vor Ort, ältere und chronisch kranke Menschen, Zusammenarbeit von Klinik, Praxen und Pflege]
    kostet: [Notfallversorgung rund um die Uhr am Ort, Planungssicherheit in der Übergangszeit]

erklaerung:
  - typ: fakt
    text: "Deutschland hat im europäischen Vergleich sehr viele Krankenhausbetten: rund anderthalbmal so viele je Einwohner wie im EU-Schnitt."
    quellen: [eurostat-betten-2024]
    genau: "2024: 759 Betten je 100.000 Einwohner, EU-Schnitt 507. Nur Bulgarien lag höher. Eurostat zählt für Deutschland auch Betten in Vorsorge- und Rehabilitationseinrichtungen mit."
  - typ: fakt
    text: "Häuser und Betten werden seit Jahrzehnten weniger. Noch stärker gesunken ist die Verweildauer: Patientinnen und Patienten bleiben im Schnitt nur noch halb so lange wie 1991. Für dieselbe Zahl an Fällen werden deshalb weniger Betten gebraucht."
    quellen: [destatis-grunddaten-2021, destatis-pm-2026-376]
    genau: "1991: 2.411 Krankenhäuser mit 665.565 Betten, durchschnittliche Verweildauer 14,0 Tage. 2025: 1.807 Krankenhäuser mit durchschnittlich 468.803 Betten, Verweildauer 7,0 Tage."
  - typ: fakt
    text: "Entsprechend steht ein Teil der Betten leer, vor allem in kleinen Häusern. Dort ist im Schnitt nur gut jedes zweite Bett belegt."
    quellen: [destatis-pm-2026-376]
    genau: "Bettenauslastung 2025: 72,6 % über alle Häuser, 55,2 % in Häusern mit 1–49 Betten, 75,3 % in Häusern mit über 800 Betten."
  - typ: fakt
    text: "Wo welches Krankenhaus steht, planen die Bundesländer. Seit der Reform von 2024 teilen sie den Kliniken **Leistungsgruppen** zu, etwa Herzchirurgie oder Geburtshilfe. Eine Leistung darf nur anbieten, wer die Mindestanforderungen an Personal und Ausstattung erfüllt. So entscheiden Qualitätsregeln mit darüber, welches Haus welche Leistungen behält."
    quellen: [sgb5-135e, bmg-pm-khag-2026]
    genau: "Krankenhausversorgungsverbesserungsgesetz (KHVVG), in Kraft seit 12. Dezember 2024, angepasst 2026 durch das Krankenhausreformanpassungsgesetz (KHAG). Die Anforderungen je Leistungsgruppe regelt § 135e SGB V."
  - typ: wertung
    text: "Abzuwägen sind Nähe und Routine. Viele Standorte bedeuten kurze Wege. Jedes Haus braucht aber rund um die Uhr Personal, die knappen Fachkräfte verteilen sich auf mehr Häuser, und jedes Haus macht einen bestimmten Eingriff seltener. Weniger Standorte bündeln Erfahrung und Personal, verlängern aber für manche die Wege."

zielkonflikte:
  - typ: wertung
    text: "**Nähe gegen Routine.** Je mehr Standorte es gibt, desto kürzer sind die Wege, aber desto seltener macht jedes Haus einen bestimmten Eingriff."
  - typ: wertung
    text: "**Personal setzt die Grenze.** Wer alle Häuser erhalten will, muss sie rund um die Uhr besetzen. Wer bündeln will, braucht genug Fachkräfte in den Zentren und im Rettungsdienst."
  - typ: wertung
    text: "**Einheitliche Regeln gegen regionale Spielräume.** Bundesweit gleiche Qualitätsregeln sorgen für Vergleichbarkeit. Spielräume der Länder erlauben Lösungen für besondere Lagen wie dünn besiedelte Regionen. Sie führen aber zu Unterschieden zwischen den Ländern."
  - typ: fakt
    text: "**Umbau kostet Geld.** Für den Umbau der Krankenhauslandschaft steht von 2026 bis 2035 ein Transformationsfonds mit insgesamt rund 50 Milliarden Euro bereit. Davon trägt der Bund 29 Milliarden Euro, den Rest tragen die Länder."
    quellen: [bt-drs-21-2512, khg-12b]

