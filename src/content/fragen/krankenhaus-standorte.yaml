  fazit:
    - typ: wertung
      text: "Viele Nachbarländer kommen mit deutlich weniger Betten aus. Ob das an weniger Krankenhäusern liegt oder an anderen Faktoren wie mehr ambulanter Behandlung, stärkerer Steuerung durch Hausärzte oder einer anderen Siedlungsstruktur, lässt sich aus dem Vergleich allein nicht ablesen."
    - typ: wertung
      text: "Dänemark zeigt, dass eine geplante Zentralisierung möglich ist. Sie braucht aber Zeit, viel Geld für Neubauten und eine einheitliche Steuerung."

verknuepft:
  - frage: krankenhaus-verguetung
    grund: "Wie Kliniken bezahlt werden, entscheidet mit darüber, ob sich kleine Häuser wirtschaftlich halten können."
  - frage: krankenhaus-traeger
    grund: "Ob ein Standort bleibt, hängt auch davon ab, ob ein öffentlicher, kirchlicher oder privater Träger Verluste tragen kann oder will."
  - frage: ambulant-land
    grund: "Wo Krankenhäuser wegfallen oder umgewandelt werden, müssen Arztpraxen auf dem Land mehr leisten."
  - frage: fachkraefte-pflege
    grund: "Wie viele Standorte sich besetzen lassen, hängt am verfügbaren Pflegepersonal."
  - frage: finanzierung-kostenanstieg
    grund: "Krankenhäuser sind der größte Ausgabenposten der gesetzlichen Krankenversicherung."

parteien:
  - partei: Grüne
    option: buendeln
    beleg: Oberste Priorität hat für uns dabei, dass sich Menschen in unserem Land darauf verlassen können, eine gute Grund- und Notfallversorgung überall erreichen zu können und in spezialisierten Zentren in bester Qualität versorgt zu werden.
    seite: "89"
    quelle: wahlprogramm-2025-gruene
  - partei: Die Linke
    option: wohnortnah-erhalten
    beleg: Das Sterben insbesondere von kleinen Krankenhäusern ist eingeplant und soll zur Hälfte auch noch mit Beiträgen der gesetzlichen Kassen finanziert werden. Eine bedarfsgerechte wohnortnahe Krankenhausplanung ist nicht vorgesehen.
    seite: "18"
    quelle: wahlprogramm-2025-die-linke

