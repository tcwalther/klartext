bereich: digitalisierung
reihenfolge: 2
status: entwurf
stand: "2026-11-25"
titel: Telemedizin und digitale Ersteinschätzung
frage: "Welche Rolle sollen Videosprechstunde, Telefon und digitale Ersteinschätzung künftig spielen: als erster Kontakt, als Ergänzung oder als Ausnahme?"
kurzfrage: Sollen Arztgespräche per Video oder Telefon zum Normalfall werden?
kurz_erklaert:
  - typ: fakt
    text: Videosprechstunden sind noch selten. Auf gut 200 Behandlungen in Arztpraxen kommt etwa eine per Video.
    quellen: [zi-trendreport-2024]
  - typ: fakt
    text: Über die Nummer 116117 lässt sich vorab klären, wie dringend ein Anliegen ist. Neue Gesetze bauen das aus.
    quellen: [aerzteblatt-ersteinschaetzung-2026, bmg-notfallreform-2026]
  - typ: wertung
    text: Digital spart Wege und Praxiszeit. Aber nicht alles lässt sich per Video untersuchen, und nicht jeder hat gutes Internet.

optionen:
  - id: digital-zuerst
    titel: Zuerst digital melden
    kurz: Wer krank ist, meldet sich zuerst per App, Telefon oder Video. Eine strukturierte Ersteinschätzung entscheidet, ob und wohin es weitergeht.
    pro:
      - typ: wertung
        text: Viele Anliegen lassen sich ohne Wartezimmer klären. Das erspart Wege und Ansteckungen und lässt in der Praxis mehr Zeit für Menschen, die wirklich vor Ort untersucht werden müssen.
      - typ: wertung
        text: Eine einheitliche Ersteinschätzung verteilt nach Dringlichkeit und nicht danach, wer zufällig zuerst anruft.
    contra:
      - typ: wertung
        text: Ältere Menschen und Menschen ohne gutes Internet oder mit Sprachbarrieren könnten benachteiligt werden.
      - typ: wertung
        text: Manche Erkrankungen zeigen sich erst bei der körperlichen Untersuchung. Ein Fehler in der Ersteinschätzung kann eine Behandlung verzögern.
    gewinnt: [Menschen mit wenig Zeit oder weiten Wegen, Praxen mit vollem Wartezimmer, Steuerung nach Dringlichkeit]
    kostet: [Menschen ohne digitale Zugänge, persönlicher Erstkontakt]
    kurz_pro: Spart Wege und Wartezimmer; Dringendes kommt zuerst dran.
    kurz_contra: Ältere und Menschen ohne gutes Internet könnten benachteiligt werden.

  - id: ergaenzung
    titel: Digital als Ergänzung
    kurz: Telemedizin wird weiter ausgebaut, bleibt aber Ergänzung. Grenzen, etwa beim Anteil reiner Videofälle je Praxis, sichern den Praxisbetrieb.
    pro:
      - typ: wertung
        text: Die Mischung nutzt Vorteile beider Wege. Folgetermine und Besprechungen gehen per Video, Untersuchungen in der Praxis.
      - typ: fakt
        text: Heute darf eine Praxis bis zu 50 Prozent ihrer Behandlungsfälle ausschließlich per Video versorgen. Darauf haben sich Kassenärztliche Bundesvereinigung und GKV-Spitzenverband 2025 geeinigt.
        quellen: [kbv-video-obergrenze-2025]
    contra:
      - typ: wertung
        text: Feste Quoten sind willkürlich. Für manche Fächer wie die Psychotherapie passt ein hoher Video-Anteil, für andere nicht.
      - typ: wertung
        text: Solange Telemedizin nur ergänzt, bleibt ihr Effekt auf Wartezeiten und Wege eher klein.
    gewinnt: [Praxen mit gemischtem Angebot, Patienten mit Folgeterminen]
    kostet: [Tempo der Digitalisierung, Anbieter rein digitaler Versorgung]
    kurz_pro: Gespräche per Video, Untersuchungen in der Praxis.
    kurz_contra: Feste Grenzen sind willkürlich; Wartezeiten sinken nur wenig.

  - id: persoenlich
    titel: Zuerst in die Praxis
    kurz: Der Erstkontakt findet in der Regel persönlich statt. Telemedizin bleibt die Ausnahme für bekannte Patientinnen und einfache Anliegen.
    pro:
      - typ: wertung
        text: Vertrauen, Gespräch und körperliche Untersuchung sind der Kern ärztlicher Arbeit. Gerade beim ersten Kontakt sieht man im Raum mehr als auf dem Bildschirm.
      - typ: wertung
        text: Eine Behandlung „aus der Ferne“ durch wechselnde Anbieter kann die feste Beziehung zur Hausarztpraxis schwächen.
    contra:
      - typ: wertung
        text: Wege und Wartezeiten bleiben, auch für Anliegen, die sich per Video schnell klären ließen.
      - typ: wertung
        text: Gerade dort, wo Praxen fehlen, verzichtet man so auf ein Mittel, das Versorgung überhaupt erst möglich machen kann.
    gewinnt: [persönliche Arzt-Patienten-Beziehung, Menschen ohne digitale Zugänge]
    kostet: [Menschen mit weiten Wegen, Praxiszeit]
    kurz_pro: Beim ersten Kontakt sieht man im Raum mehr als am Bildschirm.
    kurz_contra: Wege und Wartezeiten bleiben, gerade wo Praxen fehlen.

erklaerung:
  - typ: fakt
    text: Videosprechstunden nehmen zu, sind aber noch selten. Auf gut 200 Behandlungsfälle in Arztpraxen kommt etwa eine Videosprechstunde.
    genau: 2024 gab es rund 2,7 Millionen Videosprechstunden, 24,8 Prozent mehr als 2023, bei insgesamt 579 Millionen Behandlungsfällen. Die Hälfte entfiel auf Hausarztpraxen, ein Drittel auf die Psychotherapie. Dazu kamen 8,4 Millionen telefonische Beratungen.
    quellen: [zi-trendreport-2024]
  - typ: fakt
    text: Wie gut Video passt, hängt vom Anliegen ab. Für Gespräche wie in der Psychotherapie eignet es sich gut, für körperliche Untersuchungen nicht. Telemedizin bleibt deshalb bisher an Praxen gebunden. Eine Praxis darf höchstens die Hälfte ihrer Fälle nur per Video behandeln.
    genau: Die Obergrenze von 50 Prozent reiner Videofälle je Praxis haben Kassenärztliche Bundesvereinigung und GKV-Spitzenverband 2025 vereinbart. Sie gilt einheitlich, auch für Patientinnen und Patienten, die die Praxis noch nicht kennt.
    quellen: [kbv-video-obergrenze-2025, zi-trendreport-2024]
  - typ: fakt
    text: Die zweite Idee ist die **Ersteinschätzung**. Bevor jemand in eine Praxis oder Notaufnahme geht, klärt ein strukturiertes Gespräch am Telefon oder online, wie dringend das Anliegen ist und wo es am besten aufgehoben ist. Das gibt es schon über die Nummer 116117.
    genau: Im ersten Halbjahr 2026 gab es rund 1,85 Millionen Ersteinschätzungen über die 116117 und das Online-Patientennavi, davon rund 440.000 online.
    quellen: [aerzteblatt-ersteinschaetzung-2026]
  - typ: fakt
    text: Zwei Gesetze bauen das aus. Die Notfallreform macht aus der 116117 auch eine Akutleitstelle, die per Telefon oder Video behandeln soll. Ein geplantes Digitalgesetz soll Ersteinschätzung, Terminvermittlung und Überweisung mit der ePA verbinden.
    genau: Die Notfallreform hat der Bundestag im Oktober 2026 beschlossen; die 116117 wird in eine Terminservice- und eine Akutleitstelle geteilt. Das Digitalgesetz (GeDIG) hat das Kabinett im Juli 2026 beschlossen.
    quellen: [bmg-notfallreform-2026, zm-gedig-2026]
  - typ: wertung
    text: Offen ist, ob der digitale Weg zum normalen ersten Kontakt wird oder die Praxis ergänzt. Je mehr er zum Standard wird, desto mehr Praxiszeit kann er sparen. Umso wichtiger wird dann aber, dass Menschen ohne gutes Internet oder mit Sprachbarrieren nicht benachteiligt werden.

zielkonflikte:
  - typ: wertung
    text: Bequemlichkeit und Tempo stehen gegen Gründlichkeit. Nicht jedes Anliegen lässt sich am Bildschirm sicher einschätzen.
  - typ: wertung
    text: Digitale Wege entlasten die einen und schließen andere aus. Je mehr „digital zuerst“ gilt, desto wichtiger sind gute Alternativen.
  - typ: wertung
    text: Steuerung durch eine zentrale Ersteinschätzung kann Praxen entlasten, nimmt Patientinnen aber einen Teil der Entscheidung ab.

