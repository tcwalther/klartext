laender:
  beispiele:
    - land: Dänemark (Region Hauptstadt)
      ansatz: Telefonische Ersteinschätzung vor Notaufnahme und Bereitschaftsdienst („Akuttelefon 1813“)
      text: Die Nummer 1813 ist mit Ärztinnen und Pflegekräften besetzt und leitet Anrufende außerhalb der Hausarzt-Sprechzeiten zur passenden Hilfe.
      vergleichbarkeit: mittel
      vergleichbarkeit_text: Dänemark hat ein steuerfinanziertes System mit starker Hausarztsteuerung. Die deutsche Akutleitstelle der 116117 verfolgt ein ähnliches Ziel, startet aber in einem System mit freiem Zugang zu Praxen.
      quellen: [regionh-1813]

verknuepft:
  - frage: ambulant-steuerung
    grund: Ein Primärarztsystem soll teils über telefonische und digitale Ersteinschätzung laufen.
  - frage: ambulant-land
    grund: Telemedizin kann weite Wege zur Praxis ersetzen.
  - frage: digitalisierung-gesundheitsdaten
    grund: Digitale Ersteinschätzung und Terminvermittlung sollen in die ePA eingebunden werden.

