bereich: digitalisierung
reihenfolge: 2
status: entwurf
stand: "2026-11-25"
titel: Telemedizin und digitale Ersteinschätzung
frage: Welche Rolle sollen Videosprechstunde, Telefon und digitale Ersteinschätzung künftig spielen – erster Kontakt, Ergänzung oder Ausnahme?

optionen:
  - id: digital-zuerst
    titel: Digital als regulärer erster Kontakt
    kurz: Wer krank ist, meldet sich zuerst per App, Telefon oder Video. Eine strukturierte Ersteinschätzung entscheidet, ob und wohin es weitergeht.
    pro:
      - typ: wertung
        text: Viele Anliegen lassen sich ohne Wartezimmer klären. Das spart Wege, Ansteckungen und Praxiszeit für die, die wirklich vor Ort untersucht werden müssen.
      - typ: wertung
        text: Eine einheitliche Ersteinschätzung lenkt nach Dringlichkeit, nicht nach dem Zufall, wer zuerst anruft.
    contra:
      - typ: wertung
        text: Ältere Menschen und Menschen ohne gutes Internet oder mit Sprachbarrieren könnten benachteiligt werden.
      - typ: wertung
        text: Manche Erkrankungen zeigen sich erst bei der körperlichen Untersuchung. Ein Fehler in der Ersteinschätzung kann eine Behandlung verzögern.
    gewinnt: [Menschen mit wenig Zeit oder weiten Wegen, Praxen mit vollem Wartezimmer, Steuerung nach Dringlichkeit]
    kostet: [Menschen ohne digitale Zugänge, persönlicher Erstkontakt]

  - id: ergaenzung
    titel: Ergänzung mit klaren Grenzen
    kurz: Telemedizin wird weiter ausgebaut, bleibt aber Ergänzung. Grenzen – etwa beim Anteil reiner Videofälle je Praxis – sichern den Praxisbetrieb.
    pro:
      - typ: wertung
        text: Die Mischung nutzt Vorteile beider Wege. Folgetermine und Besprechungen gehen per Video, Untersuchungen in der Praxis.
      - typ: fakt
        text: Heute darf eine Praxis bis zu 50 Prozent ihrer Behandlungsfälle ausschließlich per Video versorgen. Darauf haben sich Kassenärztliche Bundesvereinigung und GKV-Spitzenverband 2025 geeinigt.
        quellen: [kbv-video-obergrenze-2025]
    contra:
      - typ: wertung
        text: Feste Quoten sind willkürlich. Für manche Fächer wie die Psychotherapie passt ein hoher Video-Anteil, für andere nicht.
      - typ: wertung
        text: Solange Telemedizin nur ergänzt, bleibt ihr Effekt auf Wartezeiten und Wege eher klein.
    gewinnt: [Praxen mit gemischtem Angebot, Patienten mit Folgeterminen]
    kostet: [Tempo der Digitalisierung, Anbieter rein digitaler Versorgung]

  - id: persoenlich
    titel: Vorrang des persönlichen Kontakts
    kurz: Der Erstkontakt findet in der Regel persönlich statt. Telemedizin bleibt die Ausnahme für bekannte Patientinnen und einfache Anliegen.
    pro:
      - typ: wertung
        text: Vertrauen, Gespräch und körperliche Untersuchung sind der Kern ärztlicher Arbeit. Gerade beim ersten Kontakt sieht man im Raum mehr als auf dem Bildschirm.
      - typ: wertung
        text: Eine Behandlung „aus der Ferne“ durch wechselnde Anbieter kann die feste Beziehung zur Hausarztpraxis schwächen.
    contra:
      - typ: wertung
        text: Wege und Wartezeiten bleiben, auch für Anliegen, die sich per Video schnell klären ließen.
      - typ: wertung
        text: Gerade dort, wo Praxen fehlen, verzichtet man auf ein Mittel, um Versorgung überhaupt zu ermöglichen.
    gewinnt: [persönliche Arzt-Patienten-Beziehung, Menschen ohne digitale Zugänge]
    kostet: [Menschen mit weiten Wegen, Praxiszeit]

erklaerung:
  - typ: fakt
    text: 2024 gab es in den Arztpraxen rund 2,7 Millionen **Videosprechstunden** – ein Viertel mehr als 2023. Bei insgesamt 579 Millionen Behandlungsfällen ist das aber nur ein kleiner Teil. Die Hälfte entfiel auf Hausarztpraxen, ein Drittel auf die Psychotherapie.
    quellen: [zi-trendreport-2024]
  - typ: fakt
    text: Unter der Nummer **116117** bekommen Anrufende eine strukturierte **Ersteinschätzung**, also eine Einschätzung, wie dringend ihr Anliegen ist und wo sie Hilfe finden. Im ersten Halbjahr 2026 gab es rund 1,85 Millionen solcher Ersteinschätzungen, davon rund 440.000 online.
    quellen: [aerzteblatt-ersteinschaetzung-2026]
  - typ: fakt
    text: Mit der Notfallreform, die der Bundestag im Oktober 2026 beschlossen hat, wird die 116117 in eine Terminservice- und eine Akutleitstelle geteilt. Für Akutfälle soll es dort auch telefonische oder videogestützte Versorgung geben.
    quellen: [bmg-notfallreform-2026]
  - typ: fakt
    text: Ein weiteres Gesetz (GeDIG), das das Kabinett im Juli 2026 beschlossen hat, soll eine digitale Ersteinschätzung, die Terminvermittlung und die elektronische Überweisung in die ePA einbinden.
    quellen: [zm-gedig-2026]

zielkonflikte:
  - typ: wertung
    text: Bequemlichkeit und Tempo stehen gegen Gründlichkeit. Nicht jedes Anliegen lässt sich am Bildschirm sicher einschätzen.
  - typ: wertung
    text: Digitale Wege entlasten die einen und schließen andere aus. Je mehr „digital zuerst“ gilt, desto wichtiger sind gute Alternativen.
  - typ: wertung
    text: Steuerung durch eine zentrale Ersteinschätzung kann Praxen entlasten, nimmt Patientinnen aber ein Stück Entscheidung ab.

