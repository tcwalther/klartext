geschichte:
  ereignisse:
    - jahr: "2011"
      titel: AMNOG tritt in Kraft
      text: Neue Arzneimittel müssen ihren Zusatznutzen nachweisen; danach wird ein Erstattungsbetrag verhandelt.
      quellen: [gkv-sv-amnog-fokus]
    - jahr: "2022"
      titel: GKV-Finanzstabilisierungsgesetz
      text: Neue „Leitplanken“ für die Verhandlung – ob die Vergleichstherapie noch patentgeschützt ist, wird für den Preis relevant.
      quellen: [gkv-sv-amnog-fokus]
    - jahr: "2025"
      titel: Medizinforschungsgesetz
      text: Vertrauliche Erstattungsbeträge für Unternehmen mit Forschung in Deutschland werden möglich; der EU-Preisvergleich entfällt.
      quellen: [gkv-sv-amnog-fokus]
  bilanz:
    - typ: fakt
      text: Das Gesetz zur Preisverhandlung (§ 130b SGB V) wurde bis Ende 2024 in sechzehn Gesetzen geändert, im Schnitt mehr als einmal im Jahr.
      quellen: [gkv-sv-amnog-fokus]
verknuepft:
  - frage: arzneimittel-lieferengpaesse
    grund: Preise beeinflussen auch, wo und wie zuverlässig Medikamente hergestellt werden.
  - frage: finanzierung-kostenanstieg
    grund: Arzneimittel sind einer der am stärksten wachsenden Ausgabenblöcke.
