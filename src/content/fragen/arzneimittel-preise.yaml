bereich: arzneimittel
reihenfolge: 1
status: entwurf
stand: "2026-11-25"
titel: Wie sollen Preise neuer Medikamente festgelegt werden?
frage: Neue, patentgeschützte Medikamente machen gut die Hälfte der Arzneimittelausgaben aus. Soll Deutschland ihre Preise strenger regulieren oder schnellen Zugang und den Pharmastandort in den Vordergrund stellen?
kurzfrage: Neue Medikamente sind sehr teuer. Wie streng sollen ihre Preise geregelt werden?
kurz_erklaert:
  - typ: fakt
    text: Neue Medikamente mit Patent machen nur einen kleinen Teil der Verordnungen aus, aber mehr als die Hälfte der Arzneimittelkosten.
    quellen: [wido-arzneimittelmarkt-2026]
  - typ: fakt
    text: Ihr Preis wird zwischen Hersteller und Krankenkassen verhandelt, je nach zusätzlichem Nutzen. Im ersten halben Jahr bestimmt der Hersteller ihn selbst.
    quellen: [sgb5-130b, gkv-sv-amnog-fokus]
  - typ: wertung
    text: Niedrigere Preise entlasten die Beitragszahler. Höhere Preise sollen schnellen Zugang zu neuen Mitteln und Forschung in Deutschland sichern.
optionen:
  - id: amnog-beibehalten
    titel: Heutige Regeln beibehalten
    kurz: Nutzenbewertung und Preisverhandlung nach dem AMNOG bleiben wie heute, mit Anpassungen im Detail.
    pro:
      - typ: wertung
        text: Das System verbindet schnellen Zugang mit einer Preisbindung an den Nutzen. Neue Mittel sind sofort verfügbar, der Preis wird danach verhandelt.
      - typ: position
        wer: European Federation of Pharmaceutical Industries and Associations (EFPIA)
        text: In Deutschland seien neue Medikamente nach der EU-Zulassung europaweit am schnellsten verfügbar, im Median nach 56 Tagen. Über alle untersuchten Länder liege der Median bei 532 Tagen.
        quellen: [efpia-wait-2026]
      - typ: wertung
        text: Das System wurde seit 2011 immer wieder angepasst. Weitere große Eingriffe könnten Hersteller verunsichern.
    contra:
      - typ: fakt
        text: Trotz des AMNOG verursachten patentgeschützte Arzneimittel 2025 rund 55 % der Nettokosten für Arzneimittel, aber nur gut 7 % der verordneten Tagesdosen.
        quellen: [wido-arzneimittelmarkt-2026]
      - typ: wertung
        text: Neue Ausnahmen wie vertrauliche Preise für Unternehmen mit Forschung in Deutschland machen das System weniger transparent.
    gewinnt: [schneller Zugang zu neuen Medikamenten, Planungssicherheit für Hersteller]
    kostet: ["Beitragszahlende, wenn die Ausgaben weiter stark wachsen"]
    kurz_pro: Neue Medikamente sind in Deutschland sehr schnell verfügbar.
    kurz_contra: Patentgeschützte Mittel verursachen trotzdem mehr als die Hälfte der Kosten.
  - id: strenger-regulieren
    titel: Preise strenger begrenzen
    kurz: Der verhandelte Preis gilt rückwirkend ab dem ersten Tag und richtet sich noch strenger nach dem nachgewiesenen Zusatznutzen.
    pro:
      - typ: wertung
        text: In den ersten sechs Monaten dürfen Hersteller ihren Preis heute frei festlegen. Gilt der verhandelte Preis ab dem ersten Tag, entfällt dieser Anreiz zu hohen Einstiegspreisen.
      - typ: position
        wer: Wissenschaftliches Institut der AOK (WIdO)
        text: Was die GKV für ein Arzneimittel bezahlt, müsse sich am zusätzlichen Nutzen für die Patientinnen und Patienten orientieren. Dafür sei eine Reform der Preisbildung nötig.
        quellen: [wido-arzneimittelmarkt-2026]
      - typ: wertung
        text: Geld, das bei Arzneimitteln gespart wird, steht für andere Leistungen zur Verfügung oder entlastet die Beitragszahler.
    contra:
      - typ: position
        wer: Verband Forschender Arzneimittelhersteller (vfa)
        text: Der Anteil der Bewertungen mit nicht belegtem Zusatznutzen sei gestiegen. Diese Entwicklung sei nach den Verschärfungen durch das GKV-Finanzstabilisierungsgesetz „alarmierend“.
        quellen: [vfa-amnog-zahlen-2024]
      - typ: wertung
        text: Strengere Preisregeln können dazu führen, dass Hersteller Medikamente in Deutschland später oder gar nicht auf den Markt bringen.
      - typ: wertung
        text: Niedrigere Preise können Investitionen in Forschung und Produktion in Deutschland unattraktiver machen.
    gewinnt: [Beitragszahlende, Krankenkassen]
    kostet: [Umsätze der Hersteller, möglicherweise Zugang zu einzelnen neuen Medikamenten]
    kurz_pro: Keine hohen Einstiegspreise mehr; das Ersparte entlastet die Beitragszahler.
    kurz_contra: Hersteller könnten Medikamente hier später oder gar nicht anbieten.
  - id: zugang-standort
    titel: Weniger Preisregeln
    kurz: Regeln werden gelockert oder mit Standortförderung verbunden, damit neue Medikamente schnell auf den Markt kommen und Pharmaforschung in Deutschland bleibt.
    pro:
      - typ: wertung
        text: Patientinnen und Patienten profitieren, wenn neue Therapien früh verfügbar sind, besonders bei schweren Erkrankungen wie Krebs.
      - typ: fakt
        text: Unternehmen mit Forschung in Deutschland können seit 2025 einen vertraulichen Erstattungsbetrag vereinbaren. Das soll Forschung und Investitionen im Land fördern.
        quellen: [gkv-sv-amnog-fokus]
      - typ: wertung
        text: Die Pharmaindustrie schafft gut bezahlte Arbeitsplätze und Wertschöpfung. Ein attraktiver Standort kann auch die Versorgungssicherheit stärken.
    contra:
      - typ: position
        wer: GKV-Spitzenverband
        text: Würde Standortförderung für die Pharmaindustrie aus Beitragsmitteln bezahlt, stünde die Finanzstabilität der Krankenkassen wieder in Frage.
        quellen: [gkv-sv-beitragsniveau-2026]
      - typ: wertung
        text: Industriepolitik ist Aufgabe des Staates. Werden Beitragsgelder dafür eingesetzt, zahlen Versicherte für etwas, das allen nützt.
      - typ: wertung
        text: Geheime Preise erschweren es Ärzten und der Öffentlichkeit, Kosten und Nutzen zu vergleichen.
    gewinnt: [schneller Zugang zu Innovationen, Pharmastandort und Arbeitsplätze]
    kostet: [Beitragszahlende, Preistransparenz]
    kurz_pro: Neue Therapien kommen früh zu Patienten, Pharmaforschung bleibt im Land.
    kurz_contra: Versicherte zahlen für Industriepolitik; geheime Preise erschweren Vergleiche.
erklaerung:
  - typ: fakt
    text: Neue, patentgeschützte Medikamente machen nur einen kleinen Teil der Verordnungen aus, aber mehr als die Hälfte der Arzneimittelkosten der Krankenkassen.
    quellen: [wido-arzneimittelmarkt-2026]
    genau: 2025 gab die GKV im ambulanten Bereich netto 62,6 Mrd. € für Arzneimittel aus, 5,6 % mehr als im Vorjahr. Davon entfielen 34,4 Mrd. € (rund 55 %) auf patentgeschützte Mittel; ihr Anteil an den verordneten Tagesdosen lag bei gut 7 %.
  - typ: fakt
    text: Solange ein Patent gilt, gibt es keine günstigeren Nachahmer. Der Preis entsteht deshalb nicht durch Wettbewerb, sondern wird verhandelt. Grundlage ist seit 2011 der **Zusatznutzen**, den der Hersteller gegenüber bisherigen Therapien belegen muss.
    quellen: [gkv-sv-amnog-fokus]
    genau: Geregelt im AMNOG (Arzneimittelmarktneuordnungsgesetz). Den Zusatznutzen prüft der Gemeinsame Bundesausschuss (G-BA).
  - typ: fakt
    text: Auf dieser Grundlage handeln Hersteller und GKV-Spitzenverband einen **Erstattungsbetrag** aus; ohne Einigung entscheidet eine Schiedsstelle. Im ersten halben Jahr gilt aber der Preis, den der Hersteller selbst festlegt.
    quellen: [sgb5-130b, gkv-sv-amnog-fokus]
    genau: Der Erstattungsbetrag gilt ab dem siebten Monat nach Markteinführung (§ 130b SGB V).
  - typ: fakt
    text: Die Bewertung ist kein Formalakt. Nur gut die Hälfte der neuen Medikamente kann einen Zusatznutzen belegen, bei den übrigen gilt er als nicht belegt.
    quellen: [vfa-amnog-zahlen-2024]
    genau: Von 464 neuen Arzneimitteln, die zwischen 2011 und 2024 bewertet wurden, zeigten 57 % einen Zusatznutzen; bei 43 % galt er als nicht belegt.
  - typ: fakt
    text: Seit 2025 dürfen Hersteller, die in Deutschland forschen, einen **vertraulichen Erstattungsbetrag** vereinbaren. Der Vergleich mit Preisen in anderen EU-Ländern ist als Kriterium weggefallen. Der Preis soll damit auch Forschung in Deutschland fördern.
    quellen: [gkv-sv-amnog-fokus]
    genau: Eingeführt mit dem Medizinforschungsgesetz.
  - typ: wertung
    text: 'Der Streit dreht sich darum, wie streng verhandelt werden soll: Niedrigere Preise entlasten die Beitragszahler. Höhere oder vertrauliche Preise sollen schnellen Zugang zu neuen Mitteln und Forschung im Land sichern. Wie stark Preise diese Ziele tatsächlich beeinflussen, ist umstritten.'
zielkonflikte:
  - typ: wertung
    text: '**Bezahlbarkeit gegen schnellen Zugang:** Niedrigere Preise entlasten die Beitragszahler, können aber dazu führen, dass Medikamente später oder nicht auf den Markt kommen.'
  - typ: wertung
    text: '**Transparenz gegen Standortpolitik:** Vertrauliche Preise sollen Investitionen anlocken, erschweren aber den öffentlichen Vergleich.'
  - typ: wertung
    text: '**Beitragsgeld gegen Industriepolitik:** Unklar ist, ob die Krankenversicherung oder der Staat Standortförderung bezahlen soll.'
