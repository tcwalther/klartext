bereich: krankenhaeuser
reihenfolge: 2
status: entwurf
stand: "2026-11-25"
titel: Wie sollen Krankenhäuser bezahlt werden?
frage: "Sollen Krankenhäuser weiter vor allem je Behandlungsfall bezahlt werden, einen festen Anteil für das Bereithalten von Leistungen bekommen oder ein Budget, das ihre tatsächlichen Kosten deckt?"

optionen:
  - id: fallpauschalen
    titel: Fallpauschalen weiterentwickeln
    kurz: "Das Geld folgt weiterhin der einzelnen Behandlung. Jeder Fall hat einen festen Preis, der von Diagnose und Schweregrad abhängt; das System wird verfeinert statt ersetzt."
    pro:
      - typ: position
        wer: Verband der Privaten Krankenversicherung (PKV)
        text: "„Zwei Jahrzehnte DRG-System haben Transparenz über die Leistungen der deutschen Krankenhäuser gebracht.“ Die geplante Vorhaltevergütung gehe dagegen in die falsche Richtung, führe zu neuen Fehlanreizen und mehr Bürokratie."
        quellen: [pkv-khvvg-2024]
      - typ: position
        wer: Bundesverband Deutscher Privatkliniken (BDPK)
        text: "Das DRG-System werde „zu Unrecht als Ursache“ für die Probleme gesehen. Den wirtschaftlichen Druck verursache vor allem, dass Personal- und Investitionskosten nicht vollständig refinanziert würden."
        quellen: [bdpk-2021]
      - typ: wertung
        text: "Wer mehr Patientinnen und Patienten gut und effizient behandelt, bekommt mehr Geld. Das belohnt Leistung und macht Kosten zwischen Kliniken vergleichbar."
    contra:
      - typ: position
        wer: Regierungskommission Krankenhausversorgung
        text: "Die rein leistungs- und mengenorientierte Vergütung erzeuge erhebliche Fehlanreize, insbesondere „eine sachlich nicht gerechtfertigte Mengenausweitung“. In Deutschland übten die Fallpauschalen wahrscheinlich den stärksten Mengenanreiz im OECD-Vergleich aus."
        quellen: [regkom-3-2022]
      - typ: wertung
        text: "Eine Notaufnahme oder ein Kreißsaal kostet auch dann Geld, wenn wenig los ist. Häuser mit wenigen Fällen geraten so unter Druck, unabhängig davon, wie gut sie behandeln."
    gewinnt: [Kliniken mit hohen Fallzahlen und effizienten Abläufen, Transparenz über Leistungen und Kosten]
    kostet: [kleine Häuser mit hohen Bereitschaftskosten, Bereiche mit schwankender Nachfrage wie Geburtshilfe und Kinderheilkunde]

  - id: mischsystem
    titel: Mischsystem mit Vorhaltepauschalen
    kurz: "Ein großer Teil des Geldes fließt unabhängig von der genauen Fallzahl für das Bereithalten von Personal und Technik, der Rest weiterhin je Fall. So sieht es die Reform von 2024/2026 vor."
    pro:
      - typ: position
        wer: Regierungskommission Krankenhausversorgung
        text: "Leistungsanreize müssten erhalten bleiben. Daneben solle es eine Vorhaltefinanzierung geben, die an Versorgungsstufen und Leistungsgruppen gekoppelt sei."
        quellen: [regkom-3-2022]
      - typ: fakt
        text: "Nach geltendem Recht werden 60 % der Kosten einer Behandlung (ohne Materialkosten wie Implantate, die Pflegepersonalkosten mitgerechnet) aus den Fallpauschalen herausgelöst und als **Vorhaltebudget** gezahlt."
        quellen: [khg-17b]
      - typ: wertung
        text: "Kliniken können besser planen, wenn ein Teil des Geldes nicht davon abhängt, wie viele Fälle in einem Jahr kommen. Das senkt den Druck, zusätzliche Behandlungen aus wirtschaftlichen Gründen anzubieten."
    contra:
      - typ: position
        wer: Deutsche Krankenhausgesellschaft (DKG)
        text: "Die Vorhaltevergütung verursache „massiven Bürokratieaufwand“, erreiche aber die Ziele nicht. Sie verteile nur bestehende, aus Sicht der DKG zu knappe Mittel um. Da die Vorhaltebudgets weiter an Fallzahlen anknüpften, ändere sich wenig."
        quellen: [dkg-khvvg-2024]
      - typ: position
        wer: Deutscher Landkreistag
        text: "Die Idee einer echten Vorhaltefinanzierung sei richtig, die fallzahlabhängige Ausgestaltung aber „ein grundsätzlich ungeeignetes Instrument“. Daran ändere auch die zeitliche Verschiebung nichts."
        quellen: [dlt-khag-2025]
      - typ: wertung
        text: "Ein zweites Abrechnungssystem neben den Fallpauschalen macht die Finanzierung komplizierter und schwerer zu überprüfen."
    gewinnt: [Häuser mit hohen Bereitschaftskosten (Notfall, Geburtshilfe, Kinder), Planbarkeit für Kliniken, Spezialisierung über Leistungsgruppen]
    kostet: [Einfachheit der Abrechnung, Anreiz zur Effizienz je Fall, Häuser ohne zugewiesene Leistungsgruppen]

  - id: budgets
    titel: Budgets nach tatsächlichen Kosten
    kurz: "Jedes Krankenhaus bekommt ein festes Budget, das seine nachgewiesenen, notwendigen Kosten deckt. So war es früher allgemein, und so ist es heute schon beim Pflegepersonal."
    pro:
      - typ: position
        wer: ver.di (Vereinte Dienstleistungsgewerkschaft)
        text: "ver.di fordert, das DRG-System abzuschaffen. Es solle durch eine Finanzierung ersetzt werden, die sich am tatsächlichen Bedarf der Patientinnen und Patienten orientiere. Die Gewerkschaft unterstützt außerdem die Wiedereinführung des Selbstkostendeckungsprinzips."
        quellen: [verdi-2021]
      - typ: fakt
        text: "Für das Pflegepersonal am Bett gilt das Prinzip bereits: Seit 2020 werden diese Kosten außerhalb der Fallpauschalen über ein krankenhausindividuelles **Pflegebudget** nach dem Selbstkostendeckungsprinzip bezahlt."
        quellen: [gkv-sv-pflegebudget]
      - typ: wertung
        text: "Wenn Kosten gedeckt sind, lohnt es sich weder, Behandlungen aus finanziellen Gründen auszuweiten, noch, beim Personal zu sparen. Ärztliche Entscheidungen werden von wirtschaftlichem Druck entlastet."
    contra:
      - typ: position
        wer: Regierungskommission Krankenhausversorgung
        text: "Auch eine ausschließlich leistungsunabhängige Vergütung, etwa ein zu 100 % garantiertes Budget oder die Selbstkostendeckung, setze Fehlanreize und löse erhebliche Risiken für die Versorgung sowie finanzielle Risiken für die Krankenkassen aus."
        quellen: [regkom-3-2022]
      - typ: position
        wer: GKV-Spitzenverband
        text: "Beim Pflegebudget seien Kosten aus den Fallpauschalen in das Budget verschoben worden. Das führe zu einer Doppelfinanzierung von Personalkosten zulasten der Beitragszahler."
        quellen: [gkv-sv-fokus-finanzierung, gkv-sv-pflegebudget]
      - typ: fakt
        text: "Bis 2003 wurden Krankenhausleistungen überwiegend über Tagessätze bezahlt, die unabhängig vom Behandlungsaufwand waren. Die Kasse zahlte bei gleicher Liegedauer für leicht Erkrankte genauso viel wie für schwer Kranke."
        quellen: [bmg-fallpauschalen]
    gewinnt: [Beschäftigte (weniger Kostendruck), Häuser mit wenigen Fällen, Versorgung mit schwankender Nachfrage]
    kostet: [Beitragszahler (schwerere Ausgabenkontrolle), Anreize zu wirtschaftlichem Handeln, Vergleichbarkeit zwischen Kliniken]

erklaerung:
  - typ: fakt
    text: "Krankenhäuser haben zwei Geldgeber. Die Bundesländer sollen Neubauten und Geräte bezahlen, die Krankenkassen die laufende Behandlung. Für die Kassen ist das der größte Ausgabenposten: Fast jeder dritte Euro geht ins Krankenhaus."
    quellen: [gkv-sv-fokus-finanzierung, khg-4, bmg-kv45-2025]
    genau: "Diese „duale Finanzierung“ gilt seit 1972. 2025 gaben die gesetzlichen Krankenkassen rund 111,4 Mrd. € für Krankenhausbehandlung aus, rund 31,6 % ihrer Ausgaben (vorläufige Rechnungsergebnisse)."
  - typ: fakt
    text: "Seit 2004 bekommt eine Klinik für die meisten Behandlungen einen festen Betrag pro Fall, die **Fallpauschale**. Er hängt von Diagnose und Eingriff ab, nicht davon, wie lange jemand bleibt. Wer günstiger behandelt als die Pauschale, behält die Differenz. Damit lohnt es sich, Patienten zügig zu entlassen und mehr Fälle zu behandeln."
    quellen: [bmg-fallpauschalen]
    genau: "Fallpauschalen heißen auch DRG („Diagnosis Related Groups“). 2003 wurden sie freiwillig eingeführt, ab 2004 für alle somatischen Krankenhäuser verpflichtend. Seit 2010 gilt in jedem Bundesland ein einheitlicher Grundpreis je Fall (Basisfallwert)."
  - typ: fakt
    text: "Beides ist eingetreten: Die Verweildauer hat sich seit 1991 halbiert, und die Zahl der Fälle stieg bis zur Corona-Pandemie. Allerdings sanken die Liegezeiten schon vor den Fallpauschalen."
    quellen: [destatis-grunddaten-2021, destatis-pm-2026-376]
    unsicherheit: "Wie viel davon auf die Pauschalen zurückgeht und wie viel auf eine ältere Bevölkerung und medizinischen Fortschritt, ist umstritten."
    genau: "Durchschnittliche Verweildauer 1991: 14,0 Tage, 2025: 7,0 Tage. Vollstationäre Fälle 2005: 16,5 Mio., 2019: 19,4 Mio., 2025: 17,7 Mio."
  - typ: fakt
    text: "Seit 2020 ist die Pflege am Bett aus den Pauschalen herausgelöst. Ein eigenes **Pflegebudget** erstattet die tatsächlichen Kosten. Am Pflegepersonal zu sparen, bringt einer Klinik dadurch keinen finanziellen Vorteil mehr."
    quellen: [gkv-sv-pflegebudget]
    genau: "Der GKV-Spitzenverband nennt das Pflegebudget die tiefgreifendste Veränderung seit Einführung der Fallpauschalen."
  - typ: fakt
    text: "Die Reform von 2024 fügt ein **Vorhaltebudget** hinzu. Es bezahlt dafür, dass eine Klinik eine Leistung überhaupt bereithält, unabhängig davon, wie viele Fälle sie hat. Damit hängt weniger Geld an der Fallzahl. Wirksam wird das aber erst gegen Ende des Jahrzehnts."
    quellen: [bt-drs-21-2512, khentgg-6b, khg-17b]
    genau: "2026 und 2027 ändern sich die Budgets noch nicht, 2028 und 2029 folgt der Übergang, ab 2030 wirkt das Vorhaltebudget voll (Verschiebung durch das KHAG von 2026). Als Vorhalteanteil gelten 60 % der Kosten ohne variable Sachkosten; die Pflegepersonalkosten werden darauf angerechnet."
  - typ: wertung
    text: "Strittig ist, ob das Geld der einzelnen Behandlung folgen soll, dem Bereithalten von Versorgung oder den tatsächlichen Kosten einer Klinik. Jedes Modell gewichtet Effizienz, den Anreiz zur Mengenausweitung und die finanzielle Sicherheit der Klinik anders."

zielkonflikte:
  - typ: wertung
    text: "**Effizienz gegen Sicherheit.** Je stärker Geld an Fälle gebunden ist, desto mehr lohnt sich effizientes Arbeiten, aber auch das Ausweiten lukrativer Behandlungen. Je stärker Kosten garantiert sind, desto sicherer ist die Klinik, aber desto geringer ist der Druck, wirtschaftlich zu arbeiten."
  - typ: wertung
    text: "**Verteilung und Höhe sind zwei Fragen.** Ein neues Bezahlsystem verteilt zunächst die vorhandenen Mittel anders. Ob insgesamt mehr Geld nötig ist, muss getrennt entschieden werden. Diese Frage betrifft Beitrags- und Steuerzahler."
  - typ: wertung
    text: "**Genauigkeit gegen Bürokratie.** Je genauer ein System Aufwand abbildet, desto mehr muss dokumentiert, kodiert und geprüft werden."
  - typ: fakt
    text: "**Die zweite Säule fehlt teilweise.** Für 2023 standen einem Investitionsbedarf von 6,52 Milliarden Euro Fördermittel der Länder von 3,89 Milliarden Euro gegenüber, so die Deutsche Krankenhausgesellschaft. Kliniken finanzieren Investitionen deshalb zum Teil aus dem Geld für die laufende Behandlung."
    quellen: [dkg-pm-2026-01-09, regkom-3-2022]

