      quellen: [gemeinsame-pm-invest-2024]

geschichte:
  ereignisse:
    - jahr: "1972"
      titel: Selbstkostendeckung wird Grundsatz
      text: "Das Krankenhausfinanzierungsgesetz schreibt die Selbstkostendeckung fest: Die Kassen erstatten die Betriebskosten der Krankenhäuser, bis 1984 sogar im Nachhinein. Die Länder übernehmen die Investitionen."
      quellen: [bpb-verguetung-2017, gkv-sv-fokus-finanzierung]
    - jahr: "1993"
      titel: Budgetdeckel und erste Pauschalen
      text: "Das Gesundheitsstrukturgesetz begrenzt die Budgets der Krankenhäuser und leitet den Umbau ein. Ab 1996 gelten für alle Kliniken erste Fallpauschalen und Sonderentgelte neben den Tagessätzen."
      quellen: [bpb-verguetung-2017]
    - jahr: "2003/2004"
      titel: Einführung der DRG-Fallpauschalen
      text: "Nach einem australischen Vorbild werden Fallpauschalen eingeführt: 2003 freiwillig, ab 2004 für alle somatischen Krankenhäuser verpflichtend. Zunächst ändern sich die Budgets der einzelnen Häuser noch nicht."
      quellen: [bmg-fallpauschalen]
    - jahr: "2005–2010"
      titel: Angleichung der Preise
      text: "Die zunächst krankenhausindividuellen Preise werden schrittweise angeglichen. Seit 2010 gilt in jedem Bundesland ein einheitlicher Basisfallwert, also ein Grundpreis je Fall."
      quellen: [bpb-verguetung-2017]
    - jahr: "2020"
      titel: Pflegebudget
      text: "Die Pflegepersonalkosten am Bett werden aus den Fallpauschalen herausgelöst und wieder nach tatsächlichen Kosten bezahlt. Der GKV-Spitzenverband nennt das die tiefgreifendste Veränderung seit Einführung der DRG."
      quellen: [gkv-sv-pflegebudget]
    - jahr: "2022"
      titel: Regierungskommission schlägt Vorhaltefinanzierung vor
      text: "Eine Expertenkommission empfiehlt, die Vergütung auf zwei Säulen zu stellen: Vorhaltung und Fallpauschalen. Je nach Bereich sollen 40 bis 60 % als Vorhaltung gezahlt werden (Pflegebudget eingerechnet)."
      quellen: [regkom-3-2022]
    - jahr: "2024"
      titel: KHVVG
      text: "Die Krankenhausreform tritt am 12. Dezember 2024 in Kraft. Sie verankert ein Vorhaltebudget je Leistungsgruppe."
      quellen: [bt-drs-21-2512, khentgg-6b]
    - jahr: "2026"
      titel: KHAG verschiebt Vorhaltevergütung
      text: "Das Krankenhausreformanpassungsgesetz tritt am 15. April 2026 in Kraft. Es verschiebt die Vorhaltevergütung um ein Jahr; voll wirksam wird sie erst ab 2030."
      quellen: [bmg-khag-verfahren, bt-drs-21-2512]
  bilanz:
    - typ: fakt
      text: "Die Verweildauer hat sich seit 1991 halbiert. Sie sank allerdings schon vor 2003 deutlich, also bereits zur Zeit der Tagessätze und des Budgetdeckels."
      quellen: [destatis-grunddaten-2021]
    - typ: wertung
      text: "Deutschland hat in 50 Jahren fast alle Grundmodelle ausprobiert: Kostenerstattung, Budgetdeckel, Fallpauschalen und nun ein Mischsystem. Jedes Modell wurde eingeführt, um Probleme des vorherigen zu lösen, und erzeugte eigene Nebenwirkungen."
    - typ: wertung
      text: "Wie das neue Vorhaltebudget wirkt, lässt sich frühestens ab 2028 beobachten, wenn es tatsächlich Geld verteilt."

laender:
  beispiele:
    - land: Dänemark
      ansatz: "Globale Budgets, Abkehr von Leistungsvergütung"
      text: "Seit 1982 bekommen Krankenhäuser im Voraus festgelegte Gesamtbudgets, vor allem um die Kosten zu begrenzen. Ab den 1990er-Jahren kam leistungsbezogene Bezahlung hinzu; 2010 verteilten zwei der fünf Regionen 70 % der Budgets danach. Seit 2017 haben alle Regionen diese leistungsbezogene Finanzierung weitgehend abgeschafft und setzen auf Ziele wie Wartezeiten und Qualitätsstandards. Fallpauschalen dienen weiter zur Verrechnung zwischen Regionen und zum Vergleich."
      vergleichbarkeit: mittel
      vergleichbarkeit_text: "In Dänemark legen die Regionen die Budgets ihrer Krankenhäuser selbst fest und können sie direkt steuern. In Deutschland verhandeln Kassen mit Krankenhäusern sehr unterschiedlicher Träger."
      quellen: [observatory-dk-2024]
    - land: Frankreich
      ansatz: "Fallpauschalen plus Pauschalen und Ausgabendeckel"
      text: "Seit 2005 werden Akutbehandlungen in öffentlichen und privaten Kliniken über Fallpauschalen (T2A) bezahlt. Öffentliche Kliniken bekommen daneben Pauschalen etwa für Lehre, Forschung und Aufgaben im öffentlichen Interesse. Das Parlament legt jährlich Ausgabenziele fest; wächst die Menge stärker, sinken im Folgejahr die Preise. Das Gesundheitsministerium will den Anteil der Fallpauschalen schrittweise senken."
      vergleichbarkeit: hoch
      vergleichbarkeit_text: "Frankreich hat wie Deutschland ein Versicherungssystem und ein Nebeneinander öffentlicher und privater Kliniken. Der jährliche Ausgabendeckel mit Preisanpassung ist in Deutschland aber so nicht vorgesehen."
      quellen: [observatory-fr-2023]
    - land: Niederlande
      ansatz: "Pauschalen mit Preisverhandlung durch Versicherer"
      text: "Seit 2005 werden Krankenhäuser über Behandlungspauschalen (DBC, heute DOT) bezahlt. 2012 wurde die Zahl der Pauschalen von rund 30.000 auf 4.400 gesenkt. Für einen Teil der Leistungen handeln Krankenhäuser und Versicherer die Preise frei aus, für den anderen setzt eine Behörde Höchstpreise fest."
      vergleichbarkeit: mittel
      vergleichbarkeit_text: "Die niederländischen Versicherer verhandeln einzeln und mit viel Spielraum mit den Kliniken. In Deutschland gilt dagegen je Bundesland ein einheitlicher Grundpreis je Fall."
      quellen: [observatory-nl-2016-finanzierung, bpb-verguetung-2017]
  fazit:
    - typ: wertung
      text: "Kein Land nutzt ein reines Modell. Fallpauschalen werden fast überall mit Budgets, Ausgabendeckeln oder Pauschalen für besondere Aufgaben kombiniert. Strittig ist vor allem das Mischungsverhältnis."
    - typ: wertung
      text: "Dänemark ist ein Beispiel für den Weg zurück von der Leistungsvergütung. Ob das auf ein System mit vielen unabhängigen Trägern übertragbar ist, ist offen."

verknuepft:
  - frage: krankenhaus-standorte
    grund: "Ob sich kleine Häuser halten können, hängt stark davon ab, ob Geld je Fall oder für das Bereithalten fließt."
  - frage: krankenhaus-traeger
    grund: "Gewinne und Verluste eines Krankenhauses entstehen innerhalb des Bezahlsystems. Das prägt, für welche Träger sich ein Haus lohnt."
  - frage: finanzierung-kostenanstieg
    grund: "Krankenhausausgaben sind der größte Posten der gesetzlichen Krankenversicherung."
  - frage: fachkraefte-pflege
    grund: "Das Pflegebudget bezahlt Pflegepersonal nach tatsächlichen Kosten. Das hat Folgen für Stellen und Beiträge."
  - frage: ambulant-steuerung
    grund: "Wie stationäre Behandlungen bezahlt werden, beeinflusst, was ambulant oder im Krankenhaus gemacht wird."

parteien:
  - partei: AfD
    option: budgets
    beleg: Notwendig ist die vollständige Abschaffung der Fallpauschalen und mittelfristig die Rückkehr zu individuellen Budgetvereinbarungen zwischen den Krankenhäusern und den Spitzenverbänden der GKV auf Landesebene.
    seite: "27"
    quelle: wahlprogramm-2025-afd
  - partei: Grüne
    option: mischsystem
    beleg: Die Umsetzung der Krankenhausreform werden wir weiter vorantreiben und gemeinsam mit den Ländern umsetzen. Wo erforderlich werden wir diese für eine bestmögliche Versorgung der Patient*innen weiterentwickeln, insbesondere im Hinblick auf bestmögliche Struktur-, Prozess- und Ergebnisqualität sowie eine sachgerechte Vorhaltevergütung.
    seite: "89"
    quelle: wahlprogramm-2025-gruene
  - partei: Die Linke
    option: budgets
    beleg: Wir wollen, dass die notwendigen Betriebskosten der Krankenhäuser von den Krankenkassen vollständig finanziert werden. Die Fallpauschalen müssen vollständig abgeschafft werden. Dadurch werden Gewinne und Verluste weitgehend unmöglich.
    seite: "18"
    quelle: wahlprogramm-2025-die-linke
  - partei: SPD
    option: mischsystem
