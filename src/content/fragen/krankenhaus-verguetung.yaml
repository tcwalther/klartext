      quellen: [destatis-grunddaten-2021, destatis-pm-2026-376]
    - typ: wertung
      text: "Ob der Anstieg der Fallzahlen vor allem an den Fallpauschalen lag oder an einer älteren Bevölkerung und medizinischem Fortschritt, ist umstritten. Die Daten allein beantworten das nicht."
    - typ: position
