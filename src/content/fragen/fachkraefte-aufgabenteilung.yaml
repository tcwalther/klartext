    beleg: Für Gesundheitsberufe, etwa in der Physio-, Logo- und Ergotherapie, sowie in der Pflege und im Rettungsdienst wollen wir mehr Kompetenzen zur eigenständigen heilkundlichen Behandlung.
    seite: "89"
    quelle: wahlprogramm-2025-gruene
  - partei: Die Linke
    option: erweitern
    beleg: Sie sollen stärker eigenverantwortlich behandeln und beraten können. Wir wollen die Befugnisse der Heilberufe ausweiten und eine flächendeckende Versorgung gewährleisten.
    seite: "19"
    quelle: wahlprogramm-2025-die-linke
