      text: Eine IGES-Studie im Auftrag des Bosch Health Campus rechnet für Baden-Württemberg vor, dass der Einsatz nichtärztlicher Berufsgruppen die hausärztliche Versorgungslücke 2040 von 6,5 auf 4,4 Millionen Behandlungsfälle pro Jahr verringern könnte.
      quellen: [aerzteblatt-iges-2026]
