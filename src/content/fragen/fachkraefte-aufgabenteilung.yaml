    - label: Neue Auszubildende Pflegefachfrau/-mann
      wert: "63.900"
      stand: "2025"
      quelle: destatis-pflegeausbildung-2026
  aussagen:
    - typ: schaetzung
      text: Eine IGES-Studie im Auftrag des Bosch Health Campus rechnet für Baden-Württemberg vor, dass der Einsatz nichtärztlicher Berufsgruppen die hausärztliche Versorgungslücke 2040 von 6,5 auf 4,4 Millionen Behandlungsfälle pro Jahr verringern könnte.
      quellen: [aerzteblatt-iges-2026]
      unsicherheit: Szenariorechnung; hängt stark von Annahmen zu übertragbaren Aufgaben ab.

laender:
  beispiele:
    - land: Mehrere OECD-Länder
      ansatz: Pflegekräfte in erweiterten Rollen in der Primärversorgung
      text: Eine OECD-Studie zu 37 Ländern beschreibt, wie Pflegekräfte dort Aufgaben übernehmen, die früher Ärzten vorbehalten waren – von Chronikerbetreuung bis zur Verordnung von Medikamenten. Voraussetzung sind meist eine akademische Zusatzqualifikation und eine klare gesetzliche Regelung.
      vergleichbarkeit: mittel
      vergleichbarkeit_text: Ausbildung, Rollen und Bezahlung unterscheiden sich stark. Länder mit langer akademischer Pflegeausbildung sind schwer mit Deutschland zu vergleichen, wo die Akademisierung erst begonnen hat.
      quellen: [oecd-nurses-advanced-2017]

verknuepft:
  - frage: fachkraefte-pflege
    grund: Mehr Aufgaben für Pflegekräfte setzen voraus, dass es genug Pflegekräfte gibt.
  - frage: ambulant-steuerung
    grund: In einem Primärversorgungssystem könnten Pflegekräfte einen Teil der Steuerung übernehmen.
  - frage: ambulant-land
    grund: Erweiterte Befugnisse könnten Lücken dort füllen, wo Ärzte fehlen.

