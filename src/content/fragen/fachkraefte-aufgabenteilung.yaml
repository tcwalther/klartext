bereich: fachkraefte
reihenfolge: 2
status: entwurf
stand: "2026-11-25"
titel: Wer darf was in der Versorgung?
frage: Sollen Pflegekräfte, Apothekerinnen und andere Gesundheitsberufe mehr Aufgaben eigenständig übernehmen dürfen, die bisher Ärztinnen und Ärzten vorbehalten sind?

optionen:
  - id: erweitern
    titel: Befugnisse deutlich erweitern
    kurz: Speziell ausgebildete Pflegekräfte, etwa Community Health Nurses oder Advanced Practice Nurses, behandeln bestimmte Krankheiten eigenständig und verordnen selbst Medikamente.
    pro:
      - typ: wertung
        text: Ärztinnen und Ärzte sind knapp. Wenn andere Berufe Routineaufgaben eigenständig übernehmen, bleibt mehr Arztzeit für schwierige Fälle.
      - typ: wertung
        text: Mehr Verantwortung macht Gesundheitsberufe attraktiver. Das kann helfen, Fachkräfte zu gewinnen und zu halten.
      - typ: fakt
        text: In mehreren europäischen Ländern dürfen bestimmte Pflegekräfte bereits Medikamente verordnen, etwa in Finnland, Frankreich, den Niederlanden, Polen, Spanien und Estland.
        quellen: [oecd-nurses-advanced-2017]
    contra:
      - typ: position
        wer: Bundesärztekammer
        text: Diagnose und Differenzialdiagnose müssten ärztliche Aufgabe bleiben. Bei der Ausweitung heilkundlicher Befugnisse müssten die „ärztlichen Kernkompetenzen erhalten bleiben“; auch das Haftungsrecht sei betroffen.
        quellen: [baek-stellungnahme-pkg-2025]
      - typ: wertung
        text: Mehr Beteiligte bedeuten mehr Schnittstellen. Wenn unklar ist, wer verantwortlich ist, kann für Patientinnen etwas verloren gehen.
    gewinnt: [Pflegekräfte und andere Gesundheitsberufe, Patienten in Regionen mit wenigen Ärzten]
    kostet: [ärztliche Gesamtverantwortung, klare Zuständigkeiten (in der Übergangszeit)]

  - id: schrittweise
    titel: Schrittweise mit ärztlicher Einbindung
    kurz: "Pflegekräfte und Apotheken übernehmen nach und nach mehr Aufgaben: über festgelegte Leistungskataloge, nach ärztlicher Diagnose oder mit ärztlicher Rückfrage."
    pro:
      - typ: wertung
        text: Neue Aufgaben lassen sich erproben und auswerten, bevor sie zur Regel werden.
      - typ: position
        wer: Kassenärztliche Bundesvereinigung
        text: Die KBV unterstützt den Ausbau von Pflegekompetenzen, warnt aber vor neuen und „entbehrlichen Schnittstellen zwischen den Professionen“.
        quellen: [kbv-stellungnahme-beep-2025]
    contra:
      - typ: wertung
        text: "Ein Kompromiss kann die Nachteile beider Seiten verbinden: zusätzliche Abstimmung, aber wenig echte Entlastung."
      - typ: wertung
        text: Wenn die Selbstverwaltung die Leistungskataloge erst aushandeln muss, kann es Jahre dauern, bis sich im Alltag etwas ändert.
    gewinnt: [Patientensicherheit durch Erprobung, schrittweise Entlastung der Praxen]
    kostet: [Tempo, Abstimmungsaufwand]

  - id: arztvorbehalt
    titel: Arztvorbehalt beibehalten
    kurz: Diagnose und Behandlungsentscheidung bleiben bei Ärztinnen und Ärzten. Andere Berufe arbeiten weiter auf ärztliche Anordnung („Delegation“).
    pro:
      - typ: wertung
        text: Ärztinnen und Ärzte haben die längste Ausbildung und den Überblick über das ganze Krankheitsbild. Gerade bei mehreren Erkrankungen und vielen Medikamenten zählt das.
      - typ: wertung
        text: Klare Verantwortung schützt Patientinnen. Es ist eindeutig, wer haftet und wer entscheidet.
    contra:
      - typ: wertung
        text: Ärztliche Zeit wird für Aufgaben gebunden, die gut ausgebildete Pflegekräfte oder Apotheker ebenso erledigen könnten.
      - typ: wertung
        text: Gut qualifizierte Pflegekräfte bleiben unter ihren Möglichkeiten. Das kann den Beruf weniger attraktiv machen.
    gewinnt: [einheitliche ärztliche Verantwortung, Klarheit bei der Haftung]
    kostet: [Arztzeit, Entwicklungsmöglichkeiten anderer Gesundheitsberufe]

erklaerung:
  - typ: fakt
    text: Viele medizinische Aufgaben dürfen in Deutschland nur Ärztinnen und Ärzte eigenständig ausführen. Andere Berufe übernehmen sie meist nur auf ärztliche Anordnung (Delegation). Übernimmt ein anderer Beruf eine Aufgabe in eigener Verantwortung, spricht man von Substitution.
    quellen: [baek-stellungnahme-pkg-2025]
  - typ: schaetzung
    text: Weil Arztzeit knapp ist, liegt hier ein Hebel. Eine Modellrechnung für Baden-Württemberg kommt zu dem Ergebnis, dass nichtärztliche Berufe etwa ein Drittel der erwarteten hausärztlichen Versorgungslücke schließen könnten.
    genau: Laut der IGES-Studie im Auftrag des Bosch Health Campus könnte der Einsatz nichtärztlicher Berufsgruppen die Lücke 2040 von 6,5 auf 4,4 Millionen Behandlungsfälle pro Jahr verringern.
    quellen: [aerzteblatt-iges-2026]
    unsicherheit: Szenariorechnung; hängt stark von Annahmen zu übertragbaren Aufgaben ab.
  - typ: wertung
    text: Dem stehen Fragen der Verantwortung und des Überblicks gegenüber. Wer diagnostiziert, haftet und muss das ganze Krankheitsbild im Blick haben. Mehr Beteiligte bedeuten mehr Schnittstellen. Zudem sind auch Pflegekräfte knapp. Was sie zusätzlich übernehmen, fehlt womöglich an anderer Stelle.
  - typ: fakt
    text: Erste Schritte sind gemacht. Pflegefachpersonen dürfen seit 2026 bestimmte ärztliche Aufgaben eigenständig übernehmen, etwa bei chronischen Erkrankungen. Welche genau, legt die Selbstverwaltung erst noch in Verträgen fest. Apotheken dürfen mehr impfen und in dringenden Fällen bestimmte Medikamente ohne Rezept abgeben.
    genau: Das Gesetz zur Befugniserweiterung und Entbürokratisierung in der Pflege gilt seit dem 1. Januar 2026. Mit der Apothekenreform (Bundestag, Mai 2026) dürfen Apotheken mit allen Impfstoffen impfen, die keine Lebendimpfstoffe sind.
    quellen: [bundesregierung-beep-2026, bmg-apothekenreform-2026]
  - typ: fakt
    text: Andere Länder gehen weiter. In mehreren europäischen Ländern dürfen speziell ausgebildete Pflegekräfte selbst Medikamente verordnen. Ein Gesetz für solche **Advanced Practice Nurses** ist in Deutschland angekündigt.
    genau: Verordnen dürfen bestimmte Pflegekräfte etwa in Finnland, Frankreich, den Niederlanden, Polen, Spanien und Estland (OECD 2017). Advanced Practice Nurses sind Pflegekräfte mit Masterabschluss und erweiterten Befugnissen; das Gesundheitsministerium kündigte das Gesetz im Juli 2026 für die zweite Jahreshälfte an.
    quellen: [oecd-nurses-advanced-2017, aerzteblatt-apn-2026]
    unsicherheit: Ob inzwischen ein Entwurf vorliegt, war bei Redaktionsschluss nicht geklärt.

zielkonflikte:
  - typ: wertung
    text: Mehr Befugnisse für andere Berufe können den Zugang zur Versorgung verbessern, verteilen aber Verantwortung auf mehr Schultern.
  - typ: wertung
    text: Wer Pflegekräften ärztliche Aufgaben überträgt, braucht noch mehr Pflegekräfte. Auch diese sind knapp.
  - typ: wertung
    text: Schnelle Entlastung steht gegen sorgfältige Erprobung. Je vorsichtiger man vorgeht, desto länger dauert es, bis Patienten etwas merken.

